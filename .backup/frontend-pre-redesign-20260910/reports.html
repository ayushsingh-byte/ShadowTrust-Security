<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reports | Shadow Trust</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .rp-bar { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end; margin-bottom: 18px;
            background: #0a0a0f; border: 1px solid #222; border-radius: 8px; padding: 14px; }
        .rp-bar .fld { display: flex; flex-direction: column; gap: 4px; }
        .rp-bar label { font-size: .62rem; letter-spacing: 1px; color: #7d8590; text-transform: uppercase; }
        .rp-bar select, .rp-bar input { background: #161b22; border: 1px solid #30363d; color: #e6edf3;
            padding: 8px 10px; border-radius: 6px; font: inherit; font-size: .85rem; min-width: 190px; }
        .rp-wrap { border: 1px solid #1c2128; border-radius: 8px; overflow: auto; }
        table.rp { border-collapse: collapse; width: 100%; font-size: .8rem; font-family: var(--font-mono, monospace); }
        table.rp th { position: sticky; top: 0; background: #161b22; color: #7d8590; text-align: left; padding: 9px 12px; white-space: nowrap; }
        table.rp td { padding: 8px 12px; border-top: 1px solid #14181e; color: #c9d1d9; vertical-align: top; }
        table.rp tr:hover td { background: #11161d; }
        .rp-dl { background: #1f6feb; color: #fff; border: 0; padding: 5px 12px; border-radius: 5px; cursor: pointer; font: inherit; font-size: .75rem; }
        .rp-hash { color: #6e7681; font-size: .7rem; }
        .rp-type { color: #58a6ff; }
    </style>
</head>
<body>
    <div class="app-container">
        <aside class="sidebar" id="sidebar"></aside>
        <main class="main-content">
            <div class="top-bar">
                <div class="page-header">
                    <h2>REPORTS</h2>
                    <p>GENERATED PDF INTELLIGENCE &amp; COMPLIANCE REPORTS &nbsp;<span id="rp-meta" class="rp-hash"></span></p>
                </div>
            </div>

            <div class="rp-bar">
                <div class="fld">
                    <label>Report type</label>
                    <select id="rp-type"></select>
                </div>
                <div class="fld" id="rp-param-wrap" style="display:none;">
                    <label id="rp-param-label">Subject</label>
                    <input id="rp-param" placeholder="">
                </div>
                <div class="fld">
                    <label>Window (days)</label>
                    <select id="rp-days">
                        <option value="">all data</option>
                        <option value="1">1</option><option value="7" selected>7</option><option value="30">30</option><option value="90">90</option>
                    </select>
                </div>
                <button class="soc-btn soc-btn-primary" id="rp-gen"><i class="fas fa-file-pdf"></i> GENERATE</button>
            </div>

            <div class="rp-wrap">
                <table class="rp">
                    <thead><tr><th>Generated</th><th>Type</th><th>Title</th><th>Subject</th><th>By</th><th>Size</th><th>SHA-256</th><th></th></tr></thead>
                    <tbody id="rp-rows"><tr><td colspan="8" style="padding:16px;color:#7d8590;">loading…</td></tr></tbody>
                </table>
            </div>
        </main>
    </div>

    <script src="js/sidebar.js"></script>
    <script src="js/report-download.js"></script>
    <script>
        const B = STReports.apiBase();
        const H = () => ({ 'Authorization': `Bearer ${STReports.token()}` });
        const $ = s => document.querySelector(s);
        const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

        // report types whose builder needs a subject param
        const NEEDS_PARAM = {
            incident: { label: 'Incident key or id', key: 'incident_id' },
            malware: { label: 'Sample SHA-256', key: 'sha256' },
            forensic_dfir: { label: 'Source IP (optional)', key: 'source_ip' },
        };

        async function loadTypes() {
            const r = await fetch(`${B}/reports/types`, { headers: H() });
            const types = await r.json();
            $('#rp-type').innerHTML = types.map(t => `<option value="${t.type}">${esc(t.title)}${t.admin_only ? ' (admin)' : ''}</option>`).join('');
            syncParam();
        }
        function syncParam() {
            const t = $('#rp-type').value;
            const cfg = NEEDS_PARAM[t];
            $('#rp-param-wrap').style.display = cfg ? '' : 'none';
            if (cfg) { $('#rp-param-label').textContent = cfg.label; $('#rp-param').value = ''; }
        }
        $('#rp-type').addEventListener('change', syncParam);

        async function loadReports() {
            try {
                const r = await fetch(`${B}/reports`, { headers: H() });
                const d = await r.json();
                const rows = d.reports || [];
                $('#rp-meta').textContent = `${rows.length} report(s) on file`;
                $('#rp-rows').innerHTML = rows.length ? rows.map(x => `
                    <tr>
                        <td>${esc((x.generated_at || '').replace('T', ' ').slice(0, 19))}</td>
                        <td class="rp-type">${esc(x.report_type)}</td>
                        <td>${esc(x.title)}</td>
                        <td>${esc((x.subject || '').slice(0, 40))}</td>
                        <td>${esc(x.generated_by || '')}</td>
                        <td>${(x.size_bytes / 1024).toFixed(1)} KB</td>
                        <td class="rp-hash">${esc((x.sha256 || '').slice(0, 16))}…</td>
                        <td><button class="rp-dl" data-id="${x.id}" data-name="${esc(x.filename)}">Download</button></td>
                    </tr>`).join('') : '<tr><td colspan="8" style="padding:16px;color:#7d8590;">No reports generated yet.</td></tr>';
                $('#rp-rows').querySelectorAll('.rp-dl').forEach(b => b.onclick = async () => {
                    const dl = await fetch(`${B}/reports/${b.dataset.id}/download`, { headers: H() });
                    const blob = await dl.blob();
                    const a = document.createElement('a');
                    a.href = URL.createObjectURL(blob); a.download = b.dataset.name;
                    document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(a.href);
                });
            } catch (e) {
                $('#rp-rows').innerHTML = `<tr><td colspan="8" style="padding:16px;color:#f85149;">${esc(e.message)}</td></tr>`;
            }
        }

        $('#rp-gen').addEventListener('click', async () => {
            const type = $('#rp-type').value;
            const params = {};
            const days = $('#rp-days').value;
            if (days) params.days = parseInt(days, 10);
            const cfg = NEEDS_PARAM[type];
            if (cfg && $('#rp-param').value.trim()) params[cfg.key] = $('#rp-param').value.trim();
            try {
                await STReports.generateAndDownload(type, params, { button: $('#rp-gen'), title: type });
                loadReports();
            } catch (_) { }
        });

        loadTypes();
        loadReports();
        setInterval(loadReports, 15000);
    </script>
</body>
</html>
