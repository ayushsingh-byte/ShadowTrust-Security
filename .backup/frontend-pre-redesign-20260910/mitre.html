<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>MITRE ATT&CK Matrix | Shadow Trust</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.6/Sortable.min.js"></script>
    <style>
        .mitre-grid {
            display: grid;
            grid-template-columns: repeat(7, minmax(190px, 1fr));
            gap: 10px;
            overflow-x: auto;
            padding-bottom: 20px;
        }

        .tactic-column {
            background: #050507;
            border: 1px solid #333;
            min-width: 190px;
            display: flex;
            flex-direction: column;
        }

        .tactic-header {
            background: #111;
            padding: 10px;
            text-align: center;
            font-weight: bold;
            border-bottom: 1px solid #333;
            color: #fff;
            font-size: 0.82rem;
            text-transform: uppercase;
        }

        .tcol-list {
            min-height: 40px;
            padding: 4px;
            flex: 1;
        }

        .tcol-empty {
            padding: 14px 8px;
            color: #2c2c2c;
            font-style: italic;
            font-size: 0.7rem;
            text-align: center;
        }

        .tcol-add {
            margin: 6px 8px 8px;
            background: transparent;
            border: 1px dashed #333;
            color: #666;
            font-size: 0.7rem;
            padding: 5px;
            cursor: pointer;
            border-radius: 4px;
        }

        .tcol-add:hover {
            border-color: var(--neon-cyan);
            color: var(--neon-cyan);
        }

        .technique-card {
            background: #0a0a0a;
            border: 1px solid #222;
            border-left: 3px solid #333;
            margin: 6px 0;
            padding: 8px;
            font-size: 0.78rem;
            color: #aaa;
            position: relative;
            border-radius: 4px;
        }

        .technique-card.active {
            background: rgba(255, 0, 0, 0.08);
            color: #fff;
        }

        .technique-card.manual {
            border-style: dashed;
        }

        .tc-ghost {
            opacity: 0.35;
        }

        .tc-top {
            display: flex;
            align-items: center;
            gap: 5px;
            cursor: grab;
        }

        .tc-id {
            font-weight: bold;
            font-family: 'JetBrains Mono', monospace;
        }

        .tc-name {
            margin: 4px 0;
            line-height: 1.25;
        }

        .count-badge {
            background: var(--neon-red);
            color: #000;
            font-size: 0.6rem;
            padding: 1px 5px;
            border-radius: 4px;
            font-weight: bold;
        }

        .tc-manual {
            font-size: 0.58rem;
            color: #666;
            border: 1px solid #333;
            padding: 0 4px;
            border-radius: 3px;
            text-transform: uppercase;
        }

        .tc-pin,
        .tc-del {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 0.72rem;
            padding: 0;
            filter: grayscale(1) opacity(0.4);
        }

        .tc-pin.on {
            filter: none;
        }

        .tc-del {
            color: #a33;
            margin-left: auto;
            filter: none;
        }

        .tc-doc {
            color: #666;
            font-size: 0.7rem;
        }

        .tc-doc:hover {
            color: var(--neon-cyan);
        }

        .tc-status {
            width: 100%;
            background: #060606;
            border: 1px solid #2a2a2a;
            font-size: 0.68rem;
            padding: 3px;
            border-radius: 3px;
            text-transform: uppercase;
        }

        .tc-note {
            width: 100%;
            margin-top: 5px;
            background: #060606;
            border: 1px solid #2a2a2a;
            color: #ccc;
            font-size: 0.7rem;
            padding: 4px;
            border-radius: 3px;
        }

        #tech-picker {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(5, 10, 15, 0.8);
            z-index: 10001;
            justify-content: center;
            align-items: flex-start;
            padding-top: 8vh;
            backdrop-filter: blur(4px);
        }

        .tp-box {
            background: #0a0d12;
            border: 1px solid var(--accent-primary, #3ba7ff);
            width: 460px;
            max-width: 92%;
            padding: 16px;
            border-radius: 6px;
        }

        .tp-head {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            color: #e2e8f0;
        }

        .tp-head button {
            background: none;
            border: none;
            color: #888;
            cursor: pointer;
        }

        #tp-search {
            width: 100%;
            background: #060606;
            border: 1px solid #2a2a2a;
            color: #ccc;
            padding: 7px;
            border-radius: 4px;
            margin-bottom: 8px;
        }

        #tp-list {
            max-height: 320px;
            overflow-y: auto;
        }

        .tp-item {
            padding: 6px 8px;
            font-size: 0.78rem;
            color: #bbb;
            cursor: pointer;
            border-bottom: 1px solid #161616;
            display: flex;
            justify-content: space-between;
        }

        .tp-item:hover {
            background: #12181f;
            color: #fff;
        }

        .tp-item span {
            color: #666;
            font-size: 0.68rem;
        }

        .tp-manual {
            margin-top: 10px;
            font-size: 0.72rem;
            color: #888;
        }

        .tp-manual input {
            background: #060606;
            border: 1px solid #2a2a2a;
            color: #ccc;
            padding: 4px;
            border-radius: 3px;
        }

        .tp-manual button {
            background: var(--accent-primary, #3ba7ff);
            border: none;
            color: #001;
            padding: 4px 8px;
            border-radius: 3px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <!-- Custom Modal styles & container -->
    <style>
        .export-progress-bar {
            width: 0%;
            height: 100%;
            background: var(--accent-primary);
            transition: width 1.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        @keyframes cyber-pulse {
            0% {
                opacity: 0.8;
                transform: scale(0.98) translateZ(0);
            }

            50% {
                opacity: 1;
                transform: scale(1.02) translateZ(0);
                text-shadow: 0 0 10px var(--accent-primary);
            }

            100% {
                opacity: 0.8;
                transform: scale(0.98) translateZ(0);
            }
        }

        .cyber-pulse-anim {
            animation: cyber-pulse 2s infinite;
            display: inline-block;
        }
    </style>

    <!-- Custom Modal -->
    <div id="custom-modal"
        style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(5, 10, 15, 0.85); z-index:10000; justify-content:center; align-items:center; backdrop-filter:blur(5px);">
        <div class="soc-card"
            style="width: 400px; max-width: 90%; border-color: var(--accent-primary); box-shadow: 0 0 20px rgba(0, 0, 0, 0.5); position: relative; overflow: hidden;">

            <div class="soc-card-header"
                style="border-bottom: 1px solid #334155; padding-bottom: 10px; margin-bottom: 15px; position:relative;">
                <span id="modal-title" class="card-title text-yellow"><i class="fas fa-exclamation-triangle"></i>
                    AUTHORIZATION REQUIRED</span>
            </div>

            <div id="modal-message"
                style="color: #e2e8f0; font-family: 'JetBrains Mono', monospace; font-size: 0.9rem; margin-bottom: 15px; line-height: 1.5; position:relative;">
                Please confirm action.
            </div>

            <!-- Progress Bar Container -->
            <div id="modal-progress-container"
                style="display:none; width: 100%; height: 6px; background: #1e293b; margin-bottom: 25px; border-radius: 3px; overflow: hidden; position:relative;">
                <div id="modal-progress-bar" class="export-progress-bar"></div>
            </div>

            <div id="modal-buttons" style="display: flex; justify-content: flex-end; gap: 10px; position:relative;">
                <button id="modal-btn-cancel" class="soc-btn"
                    style="background: transparent; border: 1px solid #334155; color: #94a3b8;">CANCEL</button>
                <button id="modal-btn-confirm" class="soc-btn soc-btn-primary">PROCEED</button>
            </div>
        </div>
    </div>

    <div id="tech-picker"></div>

    <div class="app-container">

        <aside class="sidebar" id="sidebar"></aside>

        <main class="main-content">
            <div class="top-bar">
                <div class="page-header">
                    <h2>MITRE ATT&CK MATRIX</h2>
                    <p>REAL-TIME TACTIC MAPPING // <span class="text-red" id="activeThreatsCount">0 ACTIVE
                            THREATS</span></p>
                </div>
                <div class="filters-bar">
                    <button id="btn-live-matrix" class="soc-btn">LIVE MATRIX</button>
                    <button id="btn-ext-lib" class="soc-btn">EXTERNAL LIBRARY</button>
                    <button id="btn-refresh" class="soc-btn soc-btn-primary"><i class="fas fa-sync"></i>
                        REFRESH</button>
                </div>
            </div>

            <!-- LOCAL VIEW -->
            <div id="localView" class="dashboard-grid" style="display: block;"> <!-- Full width for Matrix -->

                <div class="soc-card" style="margin-bottom: 20px;">
                    <div class="soc-card-header">
                        <span class="card-title">ACTIVE TACTICS (LIVE)</span>
                        <span class="badge badge-green">UPDATED: JUST NOW</span>
                    </div>

                    <div class="mitre-grid" id="matrixContainer">
                        <!-- Matrix columns injected here -->
                    </div>
                </div>

                <div class="soc-card">
                    <div class="soc-card-header"><span class="card-title">RECENT MAPPED EVENTS</span></div>
                    <table class="terminal-table" style="width: 100%;">
                        <thead>
                            <tr>
                                <th>TIMESTAMP</th>
                                <th>TACTIC</th>
                                <th>TECHNIQUE ID</th>
                                <th>SEVERITY</th>
                            </tr>
                        </thead>
                        <tbody id="eventsTable">
                            <!-- JS Populated -->
                        </tbody>
                    </table>
                </div>

            </div>

            <!-- EXTERNAL VIEW -->
            <div id="externalView" style="display: none; height: calc(100vh - 180px);">
                <div class="soc-card" style="height: 100%; padding: 0; overflow: hidden; background: #050507;">
                    <iframe src="https://attack.mitre.org/"
                        style="width: 100%; height: 100%; border: none; filter: invert(0.92) hue-rotate(180deg) contrast(1.1) brightness(0.95);"></iframe>
                </div>
            </div>
        </main>
    </div>

    <script src="js/sidebar.js"></script>
    <script type="module">
        import { apiService } from './js/api.js';

        // ── state ────────────────────────────────────────────────────────────
        const TACTICS = ["Reconnaissance","Resource Development","Initial Access","Execution",
            "Persistence","Privilege Escalation","Defense Evasion","Credential Access","Discovery",
            "Lateral Movement","Collection","Command and Control","Exfiltration","Impact"];
        let CATALOG = [];
        let analyticsById = {};
        let annotations = {};          // { techId: {status,note,pinned,order,tactic,manual,name} }
        let liveMatrix = {};           // { tactic: [ {id,technique,severity,timestamp} ] }
        let saveTimer = null, dirty = false;
        const sortables = [];         // active Sortable instances, destroyed+recreated each render

        const STATUS = ["observed","investigating","mitigated","false-positive"];
        const statusColor = { observed:"#8b949e", investigating:"#d29922", mitigated:"#3fb950", "false-positive":"#6e7681" };

        function saveSoon() {
            dirty = true;
            clearTimeout(saveTimer);
            saveTimer = setTimeout(saveAnnotations, 900);
        }
        async function saveAnnotations() {
            if (!dirty) return;
            dirty = false;
            try { await apiService.put('/mitre/annotations', { annotations }); }
            catch (e) {
                console.warn('mitre save failed', e);
                dirty = true;
                const badge = document.querySelector('.badge-green');
                if (badge) badge.innerText = 'SAVE FAILED — RETRYING';
                clearTimeout(saveTimer);
                saveTimer = setTimeout(saveAnnotations, 5000);
            }
        }

        async function loadMatrix() {
            if (!localStorage.getItem('access_token') && !localStorage.getItem('authToken')) { window.location.href = 'login.html'; return; }
            try {
                if (!CATALOG.length) {
                    try { CATALOG = (await apiService.get('/mitre/catalog')).techniques || []; } catch (e) { CATALOG = []; }
                }
                const [m, ann, an] = await Promise.all([
                    apiService.get('/mitre/').catch(() => ({ status: 'error', matrix: {} })),
                    apiService.get('/mitre/annotations').catch(() => ({ annotations: {} })),
                    apiService.get('/mitre/analytics').catch(() => ({ techniques: [] })),
                ]);
                liveMatrix = (m.status === 'success' && m.matrix) ? m.matrix : {};
                analyticsById = {};
                (an.techniques || []).forEach(t => { analyticsById[t.technique_id] = t; });
                // don't clobber unsaved local edits
                if (!dirty) annotations = ann.annotations || {};
                render();
            } catch (e) { console.error(e); }
        }

        // observed techniques from the live feed, keyed by id
        function observed() {
            const out = {};
            for (const [tactic, evs] of Object.entries(liveMatrix)) {
                for (const e of (evs || [])) {
                    if (!out[e.id]) out[e.id] = { id: e.id, name: e.technique, tactic, count: 0, severity: e.severity, last: e.timestamp };
                    out[e.id].count++;
                    if (e.timestamp > (out[e.id].last || '')) out[e.id].last = e.timestamp;
                }
            }
            return out;
        }

        function render() {
            const container = document.getElementById('matrixContainer');
            const obs = observed();

            // union of observed + annotated (manual) techniques -> which tactic column each sits in
            const nz = o => Object.fromEntries(Object.entries(o).filter(([, v]) => v !== '' && v != null));
            const cards = {};
            for (const o of Object.values(obs)) cards[o.id] = { ...o, ...nz(annotations[o.id] || {}) };
            for (const [id, a] of Object.entries(annotations)) {
                if (!cards[id]) {
                    const cat = CATALOG.find(c => c.id === id);
                    cards[id] = {
                        id, count: 0, severity: null, ...nz(a),
                        name: a.name || (cat ? cat.name : id),
                        tactic: a.tactic || (cat ? cat.tactic : 'Execution'),
                    };
                }
            }

            let total = 0;
            container.innerHTML = TACTICS.map(tactic => {
                const list = Object.values(cards)
                    .filter(c => (c.tactic || 'Execution') === tactic)
                    .sort((a, b) => (a.pinned === b.pinned ? (a.order || 0) - (b.order || 0) : (b.pinned ? 1 : -1)));
                total += list.filter(c => c.count > 0).length;
                const active = list.some(c => c.count > 0);
                return `<div class="tactic-column">
                    <div class="tactic-header" style="${active ? 'color:var(--neon-red);border-bottom-color:var(--neon-red);' : ''}">${tactic}</div>
                    <div class="tcol-list" data-tactic="${tactic}">
                        ${list.map(c => cardHtml(c)).join('') || '<div class="tcol-empty">drop here</div>'}
                    </div>
                    <button class="tcol-add" data-tactic="${tactic}"><i class="fas fa-plus"></i> add technique</button>
                </div>`;
            }).join('');

            document.getElementById('activeThreatsCount').innerText = `${total} OBSERVED TECHNIQUES`;
            const badge = document.querySelector('.badge-green');
            if (badge) badge.innerText = `UPDATED: ${new Date().toLocaleTimeString()}`;

            // recent-events table
            const tb = document.getElementById('eventsTable');
            const rows = [];
            for (const [tactic, evs] of Object.entries(liveMatrix))
                for (const e of (evs || []).slice(0, 40))
                    rows.push({ tactic, ...e });
            rows.sort((a, b) => (b.timestamp || '').localeCompare(a.timestamp || ''));
            tb.innerHTML = rows.slice(0, 40).map(e => `<tr>
                <td class="text-mono text-muted">${e.timestamp ? new Date(e.timestamp).toLocaleTimeString() : '—'}</td>
                <td class="text-cyan">${e.tactic}</td><td class="text-mono">${e.id}</td>
                <td class="${e.severity === 'CRITICAL' ? 'text-red' : 'text-yellow'}">${e.severity || ''}</td></tr>`).join('')
                || '<tr><td colspan="4" class="text-muted">No mapped events yet</td></tr>';

            wireCards();
        }

        function cardHtml(c) {
            const a = annotations[c.id] || {};
            const st = a.status || 'observed';
            return `<div class="technique-card ${c.count ? 'active' : 'manual'}" data-id="${c.id}" data-tactic="${c.tactic}" style="border-left-color:${statusColor[st]}">
                <div class="tc-top">
                    <span class="tc-id">${c.id}</span>
                    ${c.count ? `<span class="count-badge">${c.count}</span>` : '<span class="tc-manual">manual</span>'}
                    <button class="tc-pin ${a.pinned ? 'on' : ''}" title="pin">📌</button>
                    <a class="tc-doc" href="#" data-doc="${c.id}" title="ATT&CK docs"><i class="fas fa-arrow-up-right-from-square"></i></a>
                    ${c.count ? '' : '<button class="tc-del" title="remove">✕</button>'}
                </div>
                <div class="tc-name">${c.name || ''}</div>
                <div class="tc-row">
                    <select class="tc-status" style="color:${statusColor[st]}">
                        ${STATUS.map(s => `<option ${s === st ? 'selected' : ''}>${s}</option>`).join('')}
                    </select>
                </div>
                <input class="tc-note" placeholder="note…" value="${(a.note || '').replace(/"/g, '&quot;')}">
                ${analyticsPanel(c.id)}
            </div>`;
        }

        function analyticsPanel(id) {
            const t = analyticsById[id];
            if (!t) return '';
            const inc = (t.incident_ids || []).length;
            return `<div class="tc-analytics" style="margin-top:6px;font-size:0.62rem;color:#8b949e;line-height:1.4;border-top:1px solid #1c1c1c;padding-top:4px;">
                <b style="color:#adbac7">${t.event_count}</b> events · <b style="color:#adbac7">${t.detection_count}</b> detections
                · conf <b style="color:${t.confidence === 'High' ? '#3fb950' : t.confidence === 'Medium' ? '#d29922' : '#8b949e'}">${t.confidence}</b>
                ${(t.sensors || []).length ? '<br>sensors: ' + t.sensors.join(', ') : ''}
                ${inc ? `<br><a href="incidents.html" style="color:#58a6ff">${inc} incident${inc > 1 ? 's' : ''}</a>` : ''}
                ${t.last_seen ? '<br>last: ' + t.last_seen.replace('T', ' ').slice(0, 16) : ''}
            </div>`;
        }

        function ensureAnn(id, seed = {}) {
            if (!annotations[id]) annotations[id] = { status: 'observed', note: '', pinned: false, order: 0, ...seed };
            return annotations[id];
        }

        function wireCards() {
            document.querySelectorAll('.technique-card').forEach(card => {
                const id = card.dataset.id;
                card.querySelector('.tc-status').onchange = e => { ensureAnn(id, { tactic: card.dataset.tactic }).status = e.target.value; e.target.style.color = statusColor[e.target.value]; card.style.borderLeftColor = statusColor[e.target.value]; saveSoon(); };
                card.querySelector('.tc-note').oninput = e => { ensureAnn(id, { tactic: card.dataset.tactic }).note = e.target.value; saveSoon(); };
                card.querySelector('.tc-pin').onclick = e => { const A = ensureAnn(id, { tactic: card.dataset.tactic }); A.pinned = !A.pinned; e.target.classList.toggle('on', A.pinned); saveSoon(); render(); };
                const doc = card.querySelector('.tc-doc'); if (doc) doc.onclick = e => { e.preventDefault(); openTechnique(doc.dataset.doc); };
                const del = card.querySelector('.tc-del'); if (del) del.onclick = () => { delete annotations[id]; saveSoon(); render(); };
            });
            document.querySelectorAll('.tcol-add').forEach(b => b.onclick = () => openPicker(b.dataset.tactic));
            // drag & drop
            sortables.forEach(s => s.destroy());
            sortables.length = 0;
            if (window.Sortable) {
                document.querySelectorAll('.tcol-list').forEach(el => {
                    sortables.push(Sortable.create(el, {
                        group: 'mitre', animation: 120, ghostClass: 'tc-ghost',
                        onEnd: evt => {
                            const id = evt.item.dataset.id;
                            const newTactic = evt.to.dataset.tactic;
                            const A = ensureAnn(id);
                            A.tactic = newTactic;
                            A.name = A.name || (evt.item.querySelector('.tc-name')?.textContent || '');
                            [...evt.to.children].forEach((ch, i) => { if (ch.dataset.id) ensureAnn(ch.dataset.id).order = i; });
                            saveSoon(); render();
                        }
                    }));
                });
            }
        }

        function openPicker(tactic) {
            const existing = new Set(Object.keys(annotations).concat(Object.keys(observed())));
            const opts = CATALOG.filter(c => !existing.has(c.id));
            const pick = document.getElementById('tech-picker');
            pick.innerHTML = `<div class="tp-box">
                <div class="tp-head">Add technique to <b>${tactic}</b> <button id="tp-x">✕</button></div>
                <input id="tp-search" placeholder="search id or name…">
                <div id="tp-list"></div>
                <div class="tp-manual">or free-text: <input id="tp-fid" placeholder="T1234" size="8"> <input id="tp-fname" placeholder="name"> <button id="tp-fadd">add</button></div>
            </div>`;
            pick.style.display = 'flex';
            const listEl = document.getElementById('tp-list');
            const draw = (f = '') => {
                listEl.innerHTML = opts.filter(o => (o.id + ' ' + o.name).toLowerCase().includes(f.toLowerCase()))
                    .slice(0, 60).map(o => `<div class="tp-item" data-id="${o.id}" data-name="${o.name}">${o.id} · ${o.name} <span>${o.tactic}</span></div>`).join('');
                listEl.querySelectorAll('.tp-item').forEach(it => it.onclick = () => {
                    annotations[it.dataset.id] = { status: 'investigating', note: '', pinned: false, order: 99, tactic, manual: true, name: it.dataset.name };
                    saveSoon(); pick.style.display = 'none'; render();
                });
            };
            draw();
            document.getElementById('tp-search').oninput = e => draw(e.target.value);
            document.getElementById('tp-x').onclick = () => pick.style.display = 'none';
            document.getElementById('tp-fadd').onclick = () => {
                const fid = (document.getElementById('tp-fid').value || '').trim().toUpperCase();
                if (!/^T\d{4}(\.\d{3})?$/.test(fid)) { alert('id like T1059 or T1059.001'); return; }
                annotations[fid] = { status: 'investigating', note: '', pinned: false, order: 99, tactic, manual: true, name: document.getElementById('tp-fname').value.trim() || fid };
                saveSoon(); pick.style.display = 'none'; render();
            };
        }

        window.addEventListener('beforeunload', () => { if (dirty) navigator.sendBeacon && saveAnnotations(); });
        loadMatrix();
        setInterval(loadMatrix, 15000);

        // View Toggle Logic
        window.toggleView = function (view) {
            const local = document.getElementById('localView');
            const external = document.getElementById('externalView');

            if (view === 'local') {
                local.style.display = 'block';
                external.style.display = 'none';
            } else {
                local.style.display = 'none';
                external.style.display = 'block';
            }
        };

        // Open MITRE Technique Documentation
        window.openTechnique = function (id) {
            // Parse ID (e.g., T1595.001 -> T1595/001)
            let url = 'https://attack.mitre.org/techniques/';
            if (id.includes('.')) {
                const parts = id.split('.');
                url += `${parts[0]}/${parts[1]}/`;
            } else {
                url += `${id}/`;
            }
            window.open(url, '_blank');
        };

        // --- CUSTOM MODAL & BUTTON LOGIC ---
        const topModal = document.getElementById('custom-modal');
        const modalTitle = document.getElementById('modal-title');
        const modalMessage = document.getElementById('modal-message');
        const btnConfirm = document.getElementById('modal-btn-confirm');
        const btnCancel = document.getElementById('modal-btn-cancel');
        const modalButtons = document.getElementById('modal-buttons');
        const progressContainer = document.getElementById('modal-progress-container');
        const progressBar = document.getElementById('modal-progress-bar');

        let modalConfirmCallback = null;

        function showModal(title, message, isDanger, callback, isAlert = false) {
            modalTitle.innerHTML = title;
            modalMessage.innerHTML = message;

            // Reset modal states
            progressContainer.style.display = 'none';
            progressBar.style.width = '0%';
            progressBar.style.transition = 'none';

            // Force reflow to instantly reset the width before transition re-added
            progressBar.offsetHeight;
            progressBar.style.transition = 'width 1.5s cubic-bezier(0.4, 0, 0.2, 1)';

            modalButtons.style.display = 'flex';

            if (isDanger) {
                modalTitle.className = 'card-title text-red';
                btnConfirm.className = 'soc-btn soc-btn-danger';
                btnConfirm.innerText = isAlert ? 'ACKNOWLEDGE' : 'INITIATE';
                topModal.querySelector('.soc-card').style.borderColor = 'var(--accent-critical)';
            } else {
                modalTitle.className = 'card-title text-cyan';
                btnConfirm.className = 'soc-btn soc-btn-primary';
                btnConfirm.innerText = isAlert ? 'ACKNOWLEDGE' : 'PROCEED';
                topModal.querySelector('.soc-card').style.borderColor = 'var(--accent-primary)';
            }

            btnCancel.style.display = isAlert ? 'none' : 'block';
            modalConfirmCallback = callback;
            topModal.style.display = 'flex';
        }

        function hideModal() {
            topModal.style.display = 'none';
            modalConfirmCallback = null;
        }

        btnCancel.addEventListener('click', hideModal);
        btnConfirm.addEventListener('click', () => {
            if (modalConfirmCallback) modalConfirmCallback();
            else hideModal();
        });

        document.getElementById('btn-live-matrix').addEventListener('click', () => {
            toggleView('local');
        });

        document.getElementById('btn-ext-lib').addEventListener('click', () => {
            toggleView('external');
        });

        document.getElementById('btn-refresh').addEventListener('click', () => {
            showModal(
                '<i class="fas fa-sync-alt"></i> RECALIBRATE SENSORS',
                'Refresh the matrix with the latest sensor data mapping?',
                false,
                () => {
                    modalButtons.style.display = 'none';
                    progressContainer.style.display = 'block';
                    modalMessage.innerHTML = '<span class="text-cyan cyber-pulse-anim">Fetching updated TTP correlations...</span>';

                    setTimeout(() => { progressBar.style.width = '100%'; }, 50);

                    loadMatrix();

                    setTimeout(() => {
                        hideModal();
                    }, 1500);
                }
            );
        });

    </script>
</body>

</html>
