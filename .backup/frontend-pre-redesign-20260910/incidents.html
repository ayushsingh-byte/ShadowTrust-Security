<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Investigations | Shadow Trust</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* =========================================================
           INVESTIGATIONS WORKSPACE
           Muted command theme — flat ground, no glow, no grid.
           ========================================================= */
        body {
            /* flat ground: drop the shared hex-grid + vignette on this page */
            background-image: none;
            background-color: #0c1218;

            --c-crit: #c9545e;
            --c-high: #c07d48;
            --c-med: #ad9036;
            --c-low: #5b8aa6;
            --c-ok: #55906a;
            --c-idle: #69737f;

            --acc: #6f9bb5;
            --acc-dim: #3a5265;

            --line: #222a33;
            --line-soft: #1a212a;
            --panel: #131a21;
            --panel-2: #10171d;
            --panel-3: #0d141a;
        }

        .app-container {
            position: relative;
        }

        /* ---------- page shell ---------- */
        .inc-main {
            display: flex;
            flex-direction: column;
            overflow: hidden;
            padding-bottom: 1.2rem;
        }

        .inc-main .top-bar {
            margin-bottom: 1.1rem;
            border-bottom: 1px solid var(--line);
        }

        .inc-main .page-header h2::before {
            color: var(--acc);
        }

        .page-header h2 {
            animation: fadeUp .45s both;
        }

        .page-header p {
            animation: fadeUp .45s .06s both;
        }

        .hdr-right {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            animation: fadeUp .45s .12s both;
        }

        /* calm down the shared tactical button on this page */
        .inc-main .soc-btn,
        .modal .soc-btn {
            background: rgba(255, 255, 255, .02);
            border: 1px solid var(--acc-dim);
            color: var(--acc);
            letter-spacing: 1px;
            font-size: .82rem;
            padding: 8px 18px;
        }

        .inc-main .soc-btn::before,
        .modal .soc-btn::before {
            display: none;
        }

        .inc-main .soc-btn:hover,
        .modal .soc-btn:hover {
            background: var(--acc-dim);
            border-color: var(--acc);
            color: #e8eef3;
            box-shadow: none;
        }

        /* live pill */
        .live-pill {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 6px 12px;
            border: 1px solid var(--line);
            background: rgba(0, 0, 0, .2);
            font-family: var(--font-mono);
            font-size: .66rem;
            letter-spacing: 1px;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        .live-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--c-ok);
            flex: none;
            animation: breathe 2.6s ease-in-out infinite;
        }

        .live-pill.paused .live-dot {
            background: var(--c-idle);
            animation: none;
        }

        @keyframes breathe {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: .35;
            }
        }

        .icon-btn {
            background: rgba(255, 255, 255, .02);
            border: 1px solid var(--line);
            color: var(--text-muted);
            width: 34px;
            height: 34px;
            cursor: pointer;
            transition: border-color .2s, color .2s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .icon-btn:hover {
            border-color: var(--acc);
            color: var(--acc);
        }

        .icon-btn.spin i {
            animation: spin .7s linear;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* ---------- KPI strip ---------- */
        .kpi-strip {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
            margin-bottom: 12px;
        }

        @media (max-width:1200px) {
            .kpi-strip {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        @media (max-width:640px) {
            .kpi-strip {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        .kpi {
            position: relative;
            overflow: hidden;
            background: var(--panel);
            border: 1px solid var(--line);
            border-left: 2px solid var(--k, var(--acc));
            padding: 12px 14px;
            animation: fadeUp .45s both;
            animation-delay: calc(var(--i) * 60ms);
            transition: border-color .2s, background .2s;
        }

        .kpi:hover {
            background: #171f27;
            border-color: #2e3a45;
            border-left-color: var(--k, var(--acc));
        }

        .kpi .kv {
            font-family: var(--font-heading);
            font-size: 1.9rem;
            font-weight: 800;
            line-height: 1;
            color: var(--k, var(--text-primary));
            letter-spacing: 1px;
        }

        .kpi .kl {
            font-size: .6rem;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-top: 6px;
            font-family: var(--font-mono);
        }

        .kpi .kbar {
            height: 3px;
            background: rgba(255, 255, 255, .05);
            margin-top: 8px;
        }

        .kpi .kbar span {
            display: block;
            height: 100%;
            width: 0;
            background: var(--k, var(--acc));
            opacity: .65;
            transition: width .9s cubic-bezier(.2, .8, .2, 1) .15s;
        }

        .kpi .kicon {
            position: absolute;
            right: 11px;
            top: 11px;
            font-size: 1.4rem;
            color: var(--k, var(--acc));
            opacity: .1;
        }

        /* ---------- console bar ---------- */
        .console-bar {
            background: var(--panel-2);
            border: 1px solid var(--line);
            padding: 10px 12px;
            margin-bottom: 12px;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
            animation: fadeUp .45s .18s both;
        }

        .search-wrap {
            position: relative;
            flex: 1 1 240px;
            min-width: 200px;
        }

        .search-wrap i {
            position: absolute;
            left: 10px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: .78rem;
            pointer-events: none;
        }

        .search-wrap input {
            width: 100%;
            background: var(--panel-3);
            border: 1px solid var(--line);
            color: var(--text-primary);
            font-family: var(--font-mono);
            font-size: .8rem;
            padding: 8px 34px 8px 30px;
            outline: none;
            transition: border-color .2s;
        }

        .search-wrap input:focus {
            border-color: var(--acc);
        }

        .search-wrap kbd {
            position: absolute;
            right: 8px;
            top: 50%;
            transform: translateY(-50%);
            font-family: var(--font-mono);
            font-size: .6rem;
            color: var(--text-muted);
            border: 1px solid var(--line);
            padding: 1px 5px;
        }

        .sel-mini {
            background: var(--panel-3);
            border: 1px solid var(--line);
            color: var(--text-secondary);
            font-family: var(--font-mono);
            font-size: .74rem;
            padding: 8px 10px;
            outline: none;
            cursor: pointer;
            transition: border-color .2s, color .2s;
        }

        .sel-mini:hover,
        .sel-mini:focus {
            border-color: var(--acc);
            color: var(--text-primary);
        }

        /* status filter pills */
        .pills {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }

        .pill {
            position: relative;
            background: transparent;
            border: 1px solid var(--line);
            color: var(--text-muted);
            font-family: var(--font-mono);
            font-size: .68rem;
            letter-spacing: .8px;
            text-transform: uppercase;
            padding: 6px 12px;
            cursor: pointer;
            transition: color .2s, border-color .2s, background .2s;
        }

        .pill:hover {
            color: var(--text-primary);
            border-color: #34414d;
        }

        .pill.on {
            color: var(--text-primary);
            border-color: var(--p, var(--acc));
            background: rgba(255, 255, 255, .04);
            box-shadow: inset 2px 0 0 var(--p, var(--acc));
        }

        .pill .cnt {
            opacity: .6;
            margin-left: 5px;
            font-weight: 400;
        }

        /* ---------- workspace split ---------- */
        .inc-wrap {
            flex: 1;
            min-height: 0;
            display: grid;
            grid-template-columns: 390px 1fr;
            gap: 12px;
            animation: fadeUp .45s .24s both;
        }

        @media (max-width:1100px) {
            .inc-wrap {
                grid-template-columns: 1fr;
                min-height: auto;
            }

            .inc-main {
                overflow: auto;
            }

            .panel {
                max-height: 70vh;
            }
        }

        .panel {
            position: relative;
            display: flex;
            flex-direction: column;
            min-height: 0;
            background: var(--panel-2);
            border: 1px solid var(--line);
        }

        .panel-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            padding: 10px 14px;
            border-bottom: 1px solid var(--line);
            background: rgba(0, 0, 0, .18);
            flex: none;
        }

        .panel-head h3 {
            font-size: .72rem;
            letter-spacing: 2px;
            margin: 0;
            color: var(--text-secondary);
        }

        .panel-head .sub {
            font-family: var(--font-mono);
            font-size: .64rem;
            color: var(--text-muted);
        }

        .scroll {
            overflow-y: auto;
            overflow-x: hidden;
            min-height: 0;
            flex: 1;
            scrollbar-gutter: stable;
        }

        /* ---------- incident queue rows ---------- */
        .inc-row {
            position: relative;
            padding: 11px 13px 11px 16px;
            border-bottom: 1px solid var(--line-soft);
            cursor: pointer;
            transition: background .18s;
            animation: rowIn .35s both;
            animation-delay: calc(var(--i) * 25ms);
        }

        .inc-row::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 2px;
            background: var(--sv, var(--c-idle));
            opacity: .8;
        }

        .inc-row:hover {
            background: rgba(255, 255, 255, .028);
        }

        .inc-row.sel {
            background: rgba(255, 255, 255, .05);
        }

        .inc-row.sel::before {
            width: 3px;
            opacity: 1;
        }

        @keyframes rowIn {
            from {
                opacity: 0;
                transform: translateY(6px);
            }
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(8px);
            }
        }

        .inc-row .k {
            font-family: var(--font-mono);
            font-size: .64rem;
            color: var(--text-muted);
            display: flex;
            justify-content: space-between;
            gap: 8px;
        }

        .inc-row .t {
            font-size: .85rem;
            color: var(--text-primary);
            margin: 4px 0 6px;
            line-height: 1.35;
        }

        .inc-row .m {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            align-items: center;
        }

        /* ---------- badges ---------- */
        .sev {
            display: inline-block;
            padding: 2px 7px;
            font-size: .6rem;
            font-weight: 700;
            letter-spacing: 1px;
            font-family: var(--font-mono);
            border: 1px solid;
            text-transform: uppercase;
        }

        .sev-CRITICAL {
            color: var(--c-crit);
            border-color: rgba(201, 84, 94, .45);
            background: rgba(201, 84, 94, .1);
        }

        .sev-HIGH {
            color: var(--c-high);
            border-color: rgba(192, 125, 72, .45);
            background: rgba(192, 125, 72, .1);
        }

        .sev-MEDIUM {
            color: var(--c-med);
            border-color: rgba(173, 144, 54, .45);
            background: rgba(173, 144, 54, .1);
        }

        .sev-LOW {
            color: var(--c-low);
            border-color: rgba(91, 138, 166, .45);
            background: rgba(91, 138, 166, .1);
        }

        .st {
            display: inline-block;
            padding: 2px 7px;
            font-size: .6rem;
            letter-spacing: 1px;
            font-family: var(--font-mono);
            border: 1px solid var(--line);
            color: var(--text-muted);
            text-transform: uppercase;
        }

        .st-NEW {
            color: var(--c-low);
            border-color: rgba(91, 138, 166, .4);
        }

        .st-TRIAGING {
            color: var(--c-med);
            border-color: rgba(173, 144, 54, .4);
        }

        .st-INVESTIGATING {
            color: var(--c-high);
            border-color: rgba(192, 125, 72, .4);
        }

        .st-CONTAINED {
            color: var(--acc);
            border-color: rgba(111, 155, 181, .4);
        }

        .st-RESOLVED {
            color: var(--c-ok);
            border-color: rgba(85, 144, 106, .4);
        }

        .st-FALSE_POSITIVE {
            color: var(--c-idle);
            border-color: rgba(105, 115, 127, .4);
        }

        .mini {
            font-family: var(--font-mono);
            font-size: .64rem;
            color: var(--text-muted);
        }

        .chip {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 3px 9px;
            font-size: .68rem;
            font-family: var(--font-mono);
            background: rgba(255, 255, 255, .03);
            border: 1px solid var(--line);
            color: var(--text-secondary);
            margin: 3px 4px 3px 0;
            text-decoration: none;
            transition: border-color .18s, color .18s, background .18s;
        }

        .chip:hover {
            border-color: var(--acc-dim);
            color: var(--text-primary);
            background: rgba(255, 255, 255, .05);
        }

        .chip i {
            color: var(--text-muted);
        }

        .chip.ioc {
            color: var(--c-med);
            border-color: rgba(173, 144, 54, .3);
        }

        .chip.ioc i {
            color: var(--c-med);
            opacity: .8;
        }

        .chip.usr {
            color: var(--c-ok);
            border-color: rgba(85, 144, 106, .3);
        }

        .chip.usr i {
            color: var(--c-ok);
            opacity: .8;
        }

        /* ---------- detail hero ---------- */
        .hero {
            position: relative;
            padding: 18px;
            border-bottom: 1px solid var(--line);
            background: rgba(255, 255, 255, .015);
            animation: fadeUp .35s both;
        }

        .hero-top {
            display: flex;
            justify-content: space-between;
            gap: 18px;
            flex-wrap: wrap;
        }

        .hero h3 {
            font-size: 1.1rem;
            letter-spacing: 1px;
            margin: 6px 0 8px;
            line-height: 1.3;
            color: var(--text-primary);
        }

        .hero .keyline {
            font-family: var(--font-mono);
            font-size: .66rem;
            color: var(--text-muted);
            letter-spacing: 1px;
        }

        .hero .badges {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            align-items: center;
        }

        /* gauges */
        .gauges {
            display: flex;
            gap: 14px;
            align-items: center;
        }

        .gauge {
            position: relative;
            width: 88px;
            height: 88px;
            flex: none;
        }

        .gauge svg {
            width: 100%;
            height: 100%;
            transform: rotate(-90deg);
        }

        .gauge .trk {
            fill: none;
            stroke: rgba(255, 255, 255, .06);
            stroke-width: 6;
        }

        .gauge .val {
            fill: none;
            stroke-width: 6;
            stroke-linecap: butt;
            stroke-dasharray: 213.6;
            stroke-dashoffset: 213.6;
            opacity: .85;
            transition: stroke-dashoffset 1.1s cubic-bezier(.2, .8, .2, 1);
        }

        .gauge .ctr {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2px;
        }

        .gauge .ctr b {
            font-family: var(--font-heading);
            font-size: 1.35rem;
            line-height: 1;
            color: var(--text-primary);
        }

        .gauge .ctr small {
            font-family: var(--font-mono);
            font-size: .5rem;
            letter-spacing: .4px;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        .hero-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 14px;
            align-items: center;
        }

        .sbtn {
            background: rgba(255, 255, 255, .02);
            border: 1px solid var(--line);
            color: var(--text-muted);
            font-family: var(--font-mono);
            font-size: .7rem;
            letter-spacing: .6px;
            padding: 7px 12px;
            cursor: pointer;
            transition: border-color .2s, color .2s;
            text-transform: uppercase;
        }

        .sbtn:hover {
            border-color: var(--acc);
            color: var(--text-primary);
        }

        .sbtn:disabled {
            opacity: .45;
            cursor: not-allowed;
        }

        /* ---------- status workflow rail ---------- */
        .flow {
            display: flex;
            gap: 3px;
            margin-top: 14px;
            flex-wrap: wrap;
        }

        .flow-seg {
            position: relative;
            flex: 1 1 0;
            min-width: 92px;
            border: 1px solid var(--line);
            background: rgba(0, 0, 0, .2);
            color: var(--text-muted);
            font-family: var(--font-mono);
            font-size: .6rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            padding: 8px 6px;
            cursor: pointer;
            overflow: hidden;
            transition: color .2s, border-color .2s, background .2s;
        }

        .flow-seg span {
            position: relative;
            z-index: 1;
        }

        .flow-seg::before {
            content: '';
            position: absolute;
            inset: 0;
            background: rgba(111, 155, 181, .12);
            transform: scaleX(0);
            transform-origin: left;
            transition: transform .45s cubic-bezier(.2, .8, .2, 1);
            transition-delay: calc(var(--i) * 70ms);
        }

        .flow-seg.done::before,
        .flow-seg.cur::before {
            transform: scaleX(1);
        }

        .flow-seg.done {
            color: var(--text-muted);
            border-color: #2a3542;
        }

        .flow-seg.cur {
            color: var(--text-primary);
            border-color: var(--acc);
        }

        .flow-seg:hover {
            color: var(--text-primary);
            border-color: #3c4a57;
        }

        .flow-seg.fp {
            flex: 0 0 auto;
            min-width: 120px;
        }

        .flow-seg.fp::before {
            background: rgba(105, 115, 127, .14);
        }

        /* ---------- tabs ---------- */
        .tabs {
            position: relative;
            display: flex;
            gap: 2px;
            padding: 0 14px;
            border-bottom: 1px solid var(--line);
            background: rgba(0, 0, 0, .16);
            flex-wrap: wrap;
        }

        .tab {
            position: relative;
            background: none;
            border: 0;
            color: var(--text-muted);
            font-family: var(--font-mono);
            font-size: .7rem;
            letter-spacing: 1.2px;
            text-transform: uppercase;
            padding: 12px 14px;
            cursor: pointer;
            transition: color .2s;
        }

        .tab:hover {
            color: var(--text-secondary);
        }

        .tab.on {
            color: var(--text-primary);
        }

        .tab::after {
            content: '';
            position: absolute;
            left: 12px;
            right: 12px;
            bottom: -1px;
            height: 2px;
            background: var(--acc);
            transform: scaleX(0);
            transition: transform .28s cubic-bezier(.2, .8, .2, 1);
        }

        .tab.on::after {
            transform: scaleX(1);
        }

        .tab b {
            display: inline-block;
            margin-left: 6px;
            font-size: .58rem;
            padding: 1px 5px;
            border: 1px solid var(--line);
            color: var(--text-muted);
            font-weight: 400;
        }

        .tab.on b {
            border-color: var(--acc-dim);
            color: var(--text-secondary);
        }

        .tab-body {
            padding: 16px 18px 26px;
            animation: tabIn .28s cubic-bezier(.2, .8, .2, 1) both;
        }

        @keyframes tabIn {
            from {
                opacity: 0;
                transform: translateY(6px);
            }
        }

        /* ---------- sections ---------- */
        .sec {
            margin-bottom: 22px;
            animation: fadeUp .35s both;
            animation-delay: calc(var(--i, 0) * 50ms);
        }

        .sec>h4 {
            font-size: .64rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--text-muted);
            margin: 0 0 10px;
            padding-bottom: 6px;
            border-bottom: 1px solid var(--line);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .sec>h4::before {
            content: '';
            width: 5px;
            height: 5px;
            background: var(--acc-dim);
            flex: none;
        }

        .why {
            background: rgba(255, 255, 255, .02);
            border: 1px solid var(--line);
            border-left: 2px solid var(--c-med);
            padding: 12px 14px;
            font-size: .8rem;
            color: var(--text-secondary);
        }

        .why ul {
            margin: 0;
            padding-left: 18px;
        }

        .why li {
            margin: 4px 0;
        }

        /* risk breakdown bars */
        .rbk {
            display: grid;
            gap: 7px;
            margin-top: 12px;
        }

        .rbk-row {
            display: grid;
            grid-template-columns: 150px 1fr 46px;
            gap: 10px;
            align-items: center;
            font-family: var(--font-mono);
            font-size: .66rem;
            color: var(--text-muted);
        }

        .rbk-bar {
            height: 6px;
            background: rgba(255, 255, 255, .05);
            overflow: hidden;
        }

        .rbk-bar span {
            display: block;
            height: 100%;
            width: 0;
            background: var(--acc);
            opacity: .6;
            transition: width .8s cubic-bezier(.2, .8, .2, 1);
            transition-delay: calc(var(--i) * 70ms);
        }

        .rbk-row b {
            text-align: right;
            color: var(--text-secondary);
        }

        /* raw evidence counts — no shared scale, so no bars */
        .facts {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 12px;
            padding-top: 10px;
            border-top: 1px solid var(--line);
        }

        .fact {
            display: inline-flex;
            align-items: baseline;
            gap: 6px;
            border: 1px solid var(--line);
            background: rgba(0, 0, 0, .2);
            padding: 4px 9px;
            font-family: var(--font-mono);
        }

        .fact em {
            font-style: normal;
            font-size: .6rem;
            letter-spacing: .8px;
            text-transform: uppercase;
            color: var(--text-muted);
        }

        .fact b {
            font-size: .74rem;
            color: var(--text-secondary);
        }

        /* attribution grid */
        .attr {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
            gap: 12px;
        }

        .attr-box {
            border: 1px solid var(--line);
            background: rgba(0, 0, 0, .18);
            padding: 10px 12px;
            transition: border-color .2s;
        }

        .attr-box:hover {
            border-color: #2e3a45;
        }

        .attr-box>span {
            display: block;
            font-family: var(--font-mono);
            font-size: .58rem;
            letter-spacing: 1.4px;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-bottom: 7px;
        }

        /* kill chain */
        .kc {
            display: flex;
            gap: 3px;
            flex-wrap: wrap;
        }

        .kc-seg {
            flex: 1 1 68px;
            padding: 7px 4px;
            border: 1px solid var(--line);
            background: rgba(0, 0, 0, .2);
            font-family: var(--font-mono);
            font-size: .52rem;
            letter-spacing: .2px;
            line-height: 1.35;
            text-transform: uppercase;
            color: var(--text-muted);
            text-align: center;
            position: relative;
            overflow: hidden;
            overflow-wrap: anywhere;
            /* long tactic names must wrap, not clip */
            transition: color .2s, border-color .2s;
        }

        .kc-seg span {
            position: relative;
            z-index: 1;
        }

        .kc-seg::before {
            content: '';
            position: absolute;
            inset: 0;
            background: rgba(201, 84, 94, .16);
            transform: scaleY(0);
            transform-origin: bottom;
            transition: transform .45s cubic-bezier(.2, .8, .2, 1);
            transition-delay: calc(var(--i) * 55ms);
        }

        .kc-seg.hit::before {
            transform: scaleY(1);
        }

        .kc-seg.hit {
            color: var(--text-secondary);
            border-color: rgba(201, 84, 94, .38);
        }

        .kc-seg:hover {
            color: var(--text-primary);
            border-color: #34414d;
        }

        /* ---------- tables ---------- */
        table.det {
            width: 100%;
            border-collapse: collapse;
            font-size: .74rem;
            font-family: var(--font-mono);
        }

        table.det th {
            text-align: left;
            font-size: .6rem;
            letter-spacing: 1.2px;
            text-transform: uppercase;
            color: var(--text-muted);
            padding: 8px 10px;
            border-bottom: 1px solid var(--line);
            background: rgba(0, 0, 0, .2);
        }

        table.det td {
            padding: 9px 10px;
            border-bottom: 1px solid var(--line-soft);
            vertical-align: top;
            color: var(--text-secondary);
        }

        table.det tbody tr {
            transition: background .18s;
            animation: rowIn .3s both;
            animation-delay: calc(var(--i) * 35ms);
        }

        table.det tbody tr:hover {
            background: rgba(255, 255, 255, .028);
        }

        .rb {
            font-family: var(--font-mono);
            font-size: .66rem;
            color: var(--text-muted);
            word-break: break-word;
        }

        .mono {
            font-family: var(--font-mono);
        }

        /* detection cards */
        .dcard {
            border: 1px solid var(--line);
            border-left: 2px solid var(--sv, var(--c-idle));
            background: rgba(0, 0, 0, .18);
            padding: 12px 14px;
            margin-bottom: 10px;
            animation: rowIn .35s both;
            animation-delay: calc(var(--i) * 55ms);
            transition: border-color .2s, background .2s;
        }

        .dcard:hover {
            background: rgba(255, 255, 255, .025);
        }

        .dcard .dh {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
        }

        .dcard .dn {
            color: var(--text-primary);
            font-size: .84rem;
        }

        /* ---------- timeline ---------- */
        .tl {
            position: relative;
            padding-left: 26px;
        }

        .tl::before {
            content: '';
            position: absolute;
            left: 7px;
            top: 4px;
            bottom: 4px;
            width: 1px;
            background: var(--line);
            transform-origin: top;
            animation: draw .7s cubic-bezier(.2, .8, .2, 1) both;
        }

        @keyframes draw {
            from {
                transform: scaleY(0);
            }
        }

        .tl-item {
            position: relative;
            padding: 9px 0 11px;
            border-bottom: 1px solid var(--line-soft);
            animation: rowIn .35s both;
            animation-delay: calc(var(--i) * 40ms);
        }

        .tl-item::before {
            content: '';
            position: absolute;
            left: -23px;
            top: 14px;
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--sv, var(--acc));
            box-shadow: 0 0 0 3px var(--panel-2);
        }

        .tl-item .tl-t {
            font-family: var(--font-mono);
            font-size: .64rem;
            color: var(--text-muted);
            letter-spacing: .5px;
        }

        .tl-item .tl-h {
            color: var(--text-primary);
            font-size: .8rem;
            margin: 3px 0;
            display: flex;
            gap: 7px;
            flex-wrap: wrap;
            align-items: center;
        }

        .tl-item .tl-r {
            color: var(--text-muted);
            font-size: .7rem;
        }

        /* ---------- notes ---------- */
        .note-log {
            display: grid;
            gap: 8px;
            margin-bottom: 12px;
        }

        .note {
            border: 1px solid var(--line);
            border-left: 2px solid var(--acc-dim);
            background: rgba(0, 0, 0, .18);
            padding: 9px 12px;
            font-size: .78rem;
            color: var(--text-secondary);
            white-space: pre-wrap;
            word-break: break-word;
            animation: rowIn .3s both;
            animation-delay: calc(var(--i) * 40ms);
        }

        .note .nmeta {
            font-family: var(--font-mono);
            font-size: .62rem;
            color: var(--text-muted);
            margin-bottom: 3px;
        }

        .note-add {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .note-add input {
            flex: 1 1 260px;
            background: var(--panel-3);
            border: 1px solid var(--line);
            color: var(--text-primary);
            font-family: var(--font-mono);
            font-size: .8rem;
            padding: 9px 11px;
            outline: none;
            transition: border-color .2s;
        }

        .note-add input:focus {
            border-color: var(--acc);
        }

        /* activity feed */
        .act {
            display: grid;
            gap: 5px;
        }

        .act-row {
            display: grid;
            grid-template-columns: 150px 1fr;
            gap: 10px;
            font-family: var(--font-mono);
            font-size: .68rem;
            color: var(--text-muted);
            padding: 6px 8px;
            border-left: 2px solid var(--line);
            background: rgba(0, 0, 0, .15);
            animation: rowIn .3s both;
            animation-delay: calc(var(--i) * 35ms);
            transition: border-color .2s;
        }

        .act-row:hover {
            border-left-color: var(--acc-dim);
        }

        .act-row b {
            color: var(--text-secondary);
            font-weight: 700;
        }

        @media (max-width:640px) {
            .act-row {
                grid-template-columns: 1fr;
            }
        }

        /* ---------- empty / skeleton ---------- */
        .empty {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 46px 20px;
            text-align: center;
            color: var(--text-muted);
            font-family: var(--font-mono);
            font-size: .76rem;
        }

        .empty i {
            font-size: 2rem;
            opacity: .2;
        }

        .empty .radar {
            width: 66px;
            height: 66px;
            border-radius: 50%;
            border: 1px solid var(--line);
            position: relative;
            overflow: hidden;
        }

        .empty .radar::before {
            content: '';
            position: absolute;
            inset: 0;
            background: conic-gradient(from 0deg, rgba(111, 155, 181, .18), transparent 30%);
            animation: radar 3.2s linear infinite;
        }

        .empty .radar::after {
            content: '';
            position: absolute;
            inset: 30%;
            border-radius: 50%;
            border: 1px solid var(--line);
        }

        @keyframes radar {
            to {
                transform: rotate(360deg);
            }
        }

        .sk {
            padding: 12px 14px;
            border-bottom: 1px solid var(--line-soft);
        }

        .sk i {
            display: block;
            height: 9px;
            background: linear-gradient(90deg, #161d24 25%, #1d262f 37%, #161d24 63%);
            background-size: 400% 100%;
            animation: shimmer 1.4s ease-in-out infinite;
            margin-bottom: 7px;
        }

        .sk i:nth-child(1) {
            width: 42%;
        }

        .sk i:nth-child(2) {
            width: 88%;
            height: 12px;
        }

        .sk i:nth-child(3) {
            width: 60%;
        }

        @keyframes shimmer {
            0% {
                background-position: 100% 50%;
            }

            100% {
                background-position: 0 50%;
            }
        }

        /* ---------- toasts ---------- */
        .toasts {
            position: fixed;
            right: 18px;
            bottom: 18px;
            z-index: 999;
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-width: 340px;
        }

        .toast {
            position: relative;
            background: var(--panel);
            border: 1px solid var(--line);
            border-left: 2px solid var(--tc, var(--acc));
            padding: 11px 14px;
            font-family: var(--font-mono);
            font-size: .72rem;
            color: var(--text-secondary);
            box-shadow: 0 8px 24px rgba(0, 0, 0, .45);
            animation: toastIn .26s cubic-bezier(.2, .9, .3, 1) both;
            overflow: hidden;
        }

        .toast i {
            color: var(--tc, var(--acc));
            margin-right: 4px;
        }

        .toast.out {
            animation: toastOut .26s ease-in both;
        }

        @keyframes toastIn {
            from {
                opacity: 0;
                transform: translateX(30px);
            }
        }

        @keyframes toastOut {
            to {
                opacity: 0;
                transform: translateX(30px);
            }
        }

        /* ---------- modal ---------- */
        .backdrop {
            position: fixed;
            inset: 0;
            z-index: 900;
            background: rgba(6, 10, 14, .7);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
            animation: fadeIn .18s both;
        }

        .backdrop.open {
            display: flex;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
        }

        .modal {
            width: min(520px, 100%);
            background: var(--panel);
            border: 1px solid var(--line);
            box-shadow: 0 18px 50px rgba(0, 0, 0, .5);
            animation: modalIn .26s cubic-bezier(.2, .9, .3, 1) both;
        }

        @keyframes modalIn {
            from {
                opacity: 0;
                transform: translateY(12px);
            }
        }

        .modal header {
            padding: 14px 18px;
            border-bottom: 1px solid var(--line);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal header h3 {
            font-size: .8rem;
            letter-spacing: 2px;
            margin: 0;
            color: var(--text-secondary);
        }

        .modal .body {
            padding: 16px 18px;
            display: grid;
            gap: 12px;
        }

        .fld {
            display: grid;
            gap: 5px;
        }

        .fld label {
            font-family: var(--font-mono);
            font-size: .6rem;
            letter-spacing: 1.4px;
            text-transform: uppercase;
            color: var(--text-muted);
        }

        .fld input,
        .fld select {
            background: var(--panel-3);
            border: 1px solid var(--line);
            color: var(--text-primary);
            font-family: var(--font-mono);
            font-size: .8rem;
            padding: 9px 11px;
            outline: none;
            transition: border-color .2s;
        }

        .fld input:focus,
        .fld select:focus {
            border-color: var(--acc);
        }

        .modal footer {
            padding: 12px 18px 18px;
            display: flex;
            gap: 8px;
            justify-content: flex-end;
        }

        /* ---------- wizard / pickers ---------- */
        .modal.wide {
            width: min(900px, 100%);
        }

        .modal .body {
            max-height: min(62vh, 560px);
            overflow-y: auto;
        }

        .steps {
            display: flex;
            gap: 2px;
            padding: 0 18px;
            border-bottom: 1px solid var(--line);
            background: rgba(0, 0, 0, .16);
        }

        .step {
            flex: 1;
            padding: 9px 6px;
            text-align: center;
            font-family: var(--font-mono);
            font-size: .58rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: var(--text-muted);
            border-bottom: 2px solid transparent;
            background: none;
            border-top: 0;
            border-left: 0;
            border-right: 0;
            cursor: pointer;
            transition: color .2s, border-color .2s;
        }

        .step b {
            display: block;
            font-family: var(--font-heading);
            font-size: .85rem;
            margin-bottom: 3px;
        }

        .step.done {
            color: var(--text-secondary);
        }

        .step.on {
            color: var(--text-primary);
            border-bottom-color: var(--acc);
        }

        .step:hover {
            color: var(--text-secondary);
        }

        /* pick lists — events + techniques */
        .pick-bar {
            display: flex;
            gap: 7px;
            flex-wrap: wrap;
            align-items: center;
            margin-bottom: 10px;
        }

        .pick-bar input,
        .pick-bar select {
            background: var(--panel-3);
            border: 1px solid var(--line);
            color: var(--text-primary);
            font-family: var(--font-mono);
            font-size: .73rem;
            padding: 7px 9px;
            outline: none;
            transition: border-color .2s;
        }

        .pick-bar input {
            min-width: 130px;
        }

        .pick-bar input:focus,
        .pick-bar select:focus {
            border-color: var(--acc);
        }

        .pick {
            border: 1px solid var(--line);
            max-height: 300px;
            overflow-y: auto;
            background: rgba(0, 0, 0, .18);
        }

        .pick-row {
            display: grid;
            grid-template-columns: 20px 1fr;
            gap: 9px;
            padding: 8px 10px;
            border-bottom: 1px solid var(--line-soft);
            cursor: pointer;
            font-family: var(--font-mono);
            font-size: .7rem;
            transition: background .15s;
        }

        .pick-row:hover {
            background: rgba(255, 255, 255, .035);
        }

        .pick-row.on {
            background: rgba(111, 155, 181, .1);
        }

        .pick-row input {
            accent-color: #6f9bb5;
            margin-top: 2px;
        }

        .pick-row .pr-h {
            color: var(--text-primary);
            display: flex;
            gap: 7px;
            flex-wrap: wrap;
            align-items: center;
        }

        .pick-row .pr-s {
            color: var(--text-muted);
            font-size: .64rem;
            margin-top: 3px;
            word-break: break-word;
        }

        .pick-empty {
            padding: 26px;
            text-align: center;
            color: var(--text-muted);
            font-family: var(--font-mono);
            font-size: .72rem;
        }

        .pick-foot {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 8px;
            font-family: var(--font-mono);
            font-size: .66rem;
            color: var(--text-muted);
        }

        .tactic-head {
            padding: 7px 10px 4px;
            font-family: var(--font-mono);
            font-size: .58rem;
            letter-spacing: 1.3px;
            text-transform: uppercase;
            color: var(--text-muted);
            background: rgba(0, 0, 0, .25);
            border-bottom: 1px solid var(--line-soft);
            position: sticky;
            top: 0;
        }

        /* IOC editor */
        .ioc-add {
            display: flex;
            gap: 7px;
            flex-wrap: wrap;
        }

        .ioc-add input {
            flex: 1 1 220px;
            background: var(--panel-3);
            border: 1px solid var(--line);
            color: var(--text-primary);
            font-family: var(--font-mono);
            font-size: .76rem;
            padding: 7px 9px;
            outline: none;
        }

        .ioc-add input:focus {
            border-color: var(--acc);
        }

        .ioc-del {
            background: none;
            border: 0;
            color: var(--text-muted);
            cursor: pointer;
            padding: 0 0 0 5px;
            font-size: .85rem;
            line-height: 1;
        }

        .ioc-del:hover {
            color: var(--c-crit);
        }

        /* evidence upload */
        .up {
            border: 1px solid var(--line);
            background: rgba(0, 0, 0, .18);
            padding: 12px 14px;
            margin-bottom: 14px;
            display: grid;
            gap: 9px;
        }

        .up-row {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            align-items: center;
        }

        .up input[type=text],
        .up select,
        .up input[type=file] {
            background: var(--panel-3);
            border: 1px solid var(--line);
            color: var(--text-primary);
            font-family: var(--font-mono);
            font-size: .75rem;
            padding: 7px 9px;
            outline: none;
        }

        .up input[type=text] {
            flex: 1 1 240px;
        }

        .up input[type=text]:focus,
        .up select:focus {
            border-color: var(--acc);
        }

        .up input[type=file]::file-selector-button {
            background: rgba(255, 255, 255, .04);
            border: 1px solid var(--line);
            color: var(--text-secondary);
            font-family: var(--font-mono);
            font-size: .7rem;
            padding: 4px 9px;
            margin-right: 9px;
            cursor: pointer;
        }

        .sec-act {
            margin-left: auto;
            background: none;
            border: 1px solid var(--line);
            color: var(--text-muted);
            font-family: var(--font-mono);
            font-size: .58rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            padding: 3px 8px;
            cursor: pointer;
            transition: border-color .2s, color .2s;
        }

        .sec-act:hover {
            border-color: var(--acc);
            color: var(--text-primary);
        }

        /* silent re-render (auto-refresh): keep entrance animations from replaying */
        .dtl.no-anim .hero,
        .dtl.no-anim .tab-body,
        .dtl.no-anim .sec,
        .dtl.no-anim .tl::before,
        .dtl.no-anim .tl-item,
        .dtl.no-anim .dcard,
        .dtl.no-anim table.det tbody tr,
        .dtl.no-anim .note,
        .dtl.no-anim .act-row {
            animation: none !important;
        }

        .dtl.no-anim .gauge .val,
        .dtl.no-anim .rbk-bar span,
        .dtl.no-anim .kc-seg::before,
        .dtl.no-anim .flow-seg::before {
            transition: none !important;
        }

        /* reduced motion */
        @media (prefers-reduced-motion: reduce) {

            *,
            *::before,
            *::after {
                animation-duration: .001ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: .001ms !important;
            }
        }
    </style>
</head>

<body>
    <div class="app-container">
        <aside class="sidebar" id="sidebar"></aside>

        <main class="main-content inc-main">
            <div class="top-bar">
                <div class="page-header">
                    <h2>INVESTIGATIONS</h2>
                    <p>INCIDENT WORKSPACE // correlated detections, evidence &amp; attack reconstruction</p>
                </div>
                <div class="hdr-right">
                    <span class="live-pill" id="live-pill">
                        <span class="live-dot"></span>
                        <span id="live-txt">SYNCING…</span>
                    </span>
                    <button class="icon-btn" id="inc-auto" title="Toggle auto-refresh (12s)"><i class="fas fa-pause"></i></button>
                    <button class="icon-btn" id="inc-refresh" title="Refresh now (r)"><i class="fas fa-rotate"></i></button>
                    <button class="soc-btn soc-btn-primary" id="inc-new"><i class="fas fa-plus"></i> NEW CASE</button>
                </div>
            </div>

            <div class="kpi-strip" id="inc-kpi"></div>

            <div class="console-bar">
                <div class="search-wrap">
                    <i class="fas fa-magnifying-glass"></i>
                    <input id="inc-q" placeholder="filter by key, title, IP, technique…" autocomplete="off">
                    <kbd>/</kbd>
                </div>
                <select class="sel-mini" id="inc-sev">
                    <option value="">all severities</option>
                    <option value="CRITICAL">critical</option>
                    <option value="HIGH">high</option>
                    <option value="MEDIUM">medium</option>
                    <option value="LOW">low</option>
                </select>
                <select class="sel-mini" id="inc-sort">
                    <option value="recent">sort · most recent</option>
                    <option value="risk">sort · risk score</option>
                    <option value="severity">sort · severity</option>
                    <option value="confidence">sort · confidence</option>
                </select>
                <div class="pills" id="inc-filters"></div>
            </div>

            <div class="inc-wrap">
                <section class="panel">
                    <div class="panel-head">
                        <h3>CASE QUEUE</h3>
                        <span class="sub" id="inc-count">—</span>
                    </div>
                    <div class="scroll" id="inc-list">
                        <div class="sk"><i></i><i></i><i></i></div>
                        <div class="sk"><i></i><i></i><i></i></div>
                        <div class="sk"><i></i><i></i><i></i></div>
                        <div class="sk"><i></i><i></i><i></i></div>
                    </div>
                </section>

                <section class="panel">
                    <div class="panel-head">
                        <h3>CASE FILE</h3>
                        <span class="sub" id="dtl-sub">no case selected</span>
                    </div>
                    <div class="scroll" id="inc-detail">
                        <div class="empty">
                            <div class="radar"></div>
                            <div>SELECT A CASE FROM THE QUEUE</div>
                            <div style="font-size:.66rem;opacity:.7">j / k to move &nbsp;·&nbsp; / to search &nbsp;·&nbsp; r to refresh</div>
                        </div>
                    </div>
                </section>
            </div>
        </main>
    </div>

    <!-- generic modal shell: case wizard, event picker, ATT&CK picker -->
    <div class="backdrop" id="modal">
        <div class="modal" id="modal-panel">
            <header>
                <h3 id="modal-title"></h3>
                <button class="icon-btn" data-close><i class="fas fa-xmark"></i></button>
            </header>
            <div id="modal-steps"></div>
            <div class="body" id="modal-body"></div>
            <footer id="modal-footer"></footer>
        </div>
    </div>

    <div class="toasts" id="toasts"></div>

    <script src="js/report-download.js"></script>
    <script src="js/sidebar.js"></script>
    <script type="module">
        import { apiService } from './js/api.js';

        /* ================= helpers ================= */
        const $ = s => document.querySelector(s);
        const $$ = s => Array.from(document.querySelectorAll(s));
        const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
        const fmt = t => t ? String(t).replace('T', ' ').slice(0, 19) : '—';
        const num = (v, d = 0) => Number(v ?? 0).toFixed(d);

        function rel(t) {
            if (!t) return '—';
            const ms = Date.now() - new Date(/Z|[+-]\d\d:\d\d$/.test(t) ? t : t + 'Z').getTime();
            if (!isFinite(ms)) return fmt(t);
            const s = Math.max(0, Math.floor(ms / 1000));
            if (s < 60) return s + 's ago';
            if (s < 3600) return Math.floor(s / 60) + 'm ago';
            if (s < 86400) return Math.floor(s / 3600) + 'h ago';
            return Math.floor(s / 86400) + 'd ago';
        }

        const SEV_RANK = { CRITICAL: 4, HIGH: 3, MEDIUM: 2, LOW: 1 };
        const SEV_COLOR = { CRITICAL: 'var(--c-crit)', HIGH: 'var(--c-high)', MEDIUM: 'var(--c-med)', LOW: 'var(--c-low)' };
        const STATUSES = ['NEW', 'TRIAGING', 'INVESTIGATING', 'CONTAINED', 'RESOLVED'];
        const ALL_STATUSES = [...STATUSES, 'FALSE_POSITIVE'];
        const KILLCHAIN = ['reconnaissance', 'initial-access', 'execution', 'persistence', 'privilege-escalation',
            'defense-evasion', 'credential-access', 'discovery', 'lateral-movement', 'collection',
            'command-and-control', 'exfiltration', 'impact'];
        /* short forms so narrow columns break on a space instead of mid-word */
        const KC_LABEL = {
            'reconnaissance': 'recon', 'initial-access': 'initial access', 'execution': 'execution',
            'persistence': 'persistence', 'privilege-escalation': 'priv esc', 'defense-evasion': 'defense evasion',
            'credential-access': 'cred access', 'discovery': 'discovery', 'lateral-movement': 'lateral move',
            'collection': 'collection', 'command-and-control': 'c2', 'exfiltration': 'exfil', 'impact': 'impact',
        };

        function toast(msg, kind = 'ok') {
            const colors = { ok: 'var(--c-ok)', err: 'var(--c-crit)', info: 'var(--acc)', warn: 'var(--c-med)' };
            const el = document.createElement('div');
            el.className = 'toast';
            el.style.setProperty('--tc', colors[kind] || colors.info);
            el.innerHTML = `<i class="fas ${kind === 'err' ? 'fa-triangle-exclamation' : kind === 'warn' ? 'fa-circle-exclamation' : 'fa-circle-check'}"></i> ${esc(msg)}`;
            $('#toasts').appendChild(el);
            setTimeout(() => { el.classList.add('out'); setTimeout(() => el.remove(), 320); }, 3600);
        }

        function countUp(el, to, dur = 800) {
            const from = Number(el.dataset.v || 0);
            if (from === to) { el.textContent = to; return; }
            const t0 = performance.now();
            (function step(t) {
                const p = Math.min(1, (t - t0) / dur);
                const e = 1 - Math.pow(1 - p, 3);
                el.textContent = Math.round(from + (to - from) * e);
                if (p < 1) requestAnimationFrame(step);
                else el.dataset.v = to;
            })(t0);
        }

        /* ================= state ================= */
        const S = {
            statusFilter: '', severityFilter: '', q: '', sort: 'recent',
            selected: null, incidents: [], view: [], stats: null,
            detail: null, timeline: [], tab: 'overview', splunk: false,
            me: null, listSig: '', auto: true, busy: false
        };

        /* ================= KPI strip ================= */
        function renderKpis(st) {
            const wrap = $('#inc-kpi');
            const total = st.total || 0;
            const cards = [
                { k: 'var(--acc)', v: st.open || 0, l: 'open cases', icon: 'fa-folder-open', of: total },
                { k: 'var(--c-crit)', v: st.by_severity?.CRITICAL || 0, l: 'critical', icon: 'fa-radiation', of: total },
                { k: 'var(--c-high)', v: st.by_severity?.HIGH || 0, l: 'high', icon: 'fa-fire', of: total },
                { k: 'var(--c-ok)', v: st.by_status?.RESOLVED || 0, l: 'resolved', icon: 'fa-circle-check', of: total },
                { k: 'var(--c-idle)', v: total, l: 'total tracked', icon: 'fa-database', of: total },
            ];
            if (!wrap.children.length) {
                wrap.innerHTML = cards.map((c, i) => `
                    <div class="kpi" style="--k:${c.k};--i:${i}">
                        <i class="fas ${c.icon} kicon"></i>
                        <div class="kv" data-kv>0</div>
                        <div class="kl">${c.l}</div>
                        <div class="kbar"><span></span></div>
                    </div>`).join('');
            }
            Array.from(wrap.children).forEach((el, i) => {
                countUp(el.querySelector('[data-kv]'), cards[i].v);
                const pct = cards[i].of ? Math.min(100, (cards[i].v / cards[i].of) * 100) : 0;
                el.querySelector('.kbar span').style.width = pct + '%';
            });
        }

        function renderFilterPills() {
            const st = S.stats?.by_status || {};
            const open = S.stats?.open ?? '';
            const defs = [
                { v: '', label: 'all', p: 'var(--acc)', n: S.stats?.total },
                { v: 'NEW', label: 'new', p: 'var(--c-low)', n: st.NEW },
                { v: 'TRIAGING', label: 'triaging', p: 'var(--c-med)', n: st.TRIAGING },
                { v: 'INVESTIGATING', label: 'investigating', p: 'var(--c-high)', n: st.INVESTIGATING },
                { v: 'CONTAINED', label: 'contained', p: 'var(--acc)', n: st.CONTAINED },
                { v: 'RESOLVED', label: 'resolved', p: 'var(--c-ok)', n: st.RESOLVED },
                { v: 'FALSE_POSITIVE', label: 'false positive', p: 'var(--c-idle)', n: st.FALSE_POSITIVE },
            ];
            const html = defs.map(d => `
                <button class="pill ${S.statusFilter === d.v ? 'on' : ''}" style="--p:${d.p}" data-status="${d.v}">
                    <span>${d.label}${d.n != null ? `<b class="cnt">${d.n}</b>` : ''}</span>
                </button>`).join('');
            const bar = $('#inc-filters');
            if (bar.dataset.sig === html) return;
            bar.dataset.sig = html;
            bar.innerHTML = html;
            bar.querySelectorAll('.pill').forEach(b => b.onclick = () => {
                S.statusFilter = b.dataset.status;
                bar.querySelectorAll('.pill').forEach(x => x.classList.toggle('on', x === b));
                loadList({ force: true });
            });
        }

        /* ================= queue ================= */
        function applyView() {
            const q = S.q.trim().toLowerCase();
            let v = S.incidents.slice();
            if (q) {
                v = v.filter(i => {
                    const hay = [i.incident_key, i.title, i.status, i.severity, i.assigned_analyst,
                    ...(i.source_ips || []), ...(i.attack_techniques || []).map(t => `${t.id} ${t.name}`)]
                        .join(' ').toLowerCase();
                    return hay.includes(q);
                });
            }
            const cmp = {
                recent: (a, b) => String(b.last_seen || '').localeCompare(String(a.last_seen || '')),
                risk: (a, b) => (b.risk_score ?? 0) - (a.risk_score ?? 0),
                severity: (a, b) => (SEV_RANK[b.severity] || 0) - (SEV_RANK[a.severity] || 0) || (b.risk_score ?? 0) - (a.risk_score ?? 0),
                confidence: (a, b) => (b.confidence ?? 0) - (a.confidence ?? 0),
            }[S.sort];
            v.sort(cmp);
            S.view = v;
        }

        function renderList(force) {
            applyView();
            const sig = JSON.stringify(S.view.map(i => [i.id, i.status, i.severity, i.last_seen, i.risk_score, i.assigned_analyst]));
            if (!force && sig === S.listSig) { markSelected(); return; }
            S.listSig = sig;

            $('#inc-count').textContent = `${S.view.length} shown · ${S.incidents.length} loaded`;

            const list = $('#inc-list');
            const keepScroll = list.scrollTop;
            list.innerHTML = S.view.length ? S.view.map((i, idx) => `
                <div class="inc-row ${S.selected === i.id ? 'sel' : ''} ${i.severity === 'CRITICAL' ? 'crit' : ''}"
                     style="--i:${Math.min(idx, 24)};--sv:${SEV_COLOR[i.severity] || 'var(--c-idle)'}" data-id="${esc(i.id)}">
                    <div class="k">
                        <span>${esc(i.incident_key)}${i.auto_created ? ' · AUTO' : ' · MANUAL'}</span>
                        <span>${rel(i.last_seen)}</span>
                    </div>
                    <div class="t">${esc(i.title)}</div>
                    <div class="m">
                        <span class="sev sev-${esc(i.severity)}">${esc(i.severity)}</span>
                        <span class="st st-${esc(i.status)}">${esc(String(i.status).replace('_', ' '))}</span>
                        <span class="mini">risk ${num(i.risk_score)}</span>
                        <span class="mini">conf ${num(i.confidence, 2)}</span>
                        ${(i.source_ips || []).slice(0, 1).map(ip => `<span class="mini">${esc(ip)}</span>`).join('')}
                        ${i.assigned_analyst ? `<span class="mini"><i class="fas fa-user-check"></i> ${esc(i.assigned_analyst.split('@')[0])}</span>` : ''}
                    </div>
                </div>`).join('')
                : `<div class="empty"><i class="fas fa-inbox"></i><div>NO CASES MATCH THIS FILTER</div></div>`;

            list.querySelectorAll('.inc-row').forEach(r => r.onclick = () => select(r.dataset.id));
            list.scrollTop = keepScroll;
        }

        /* toggle the selected row without re-rendering (keeps animations calm) */
        function markSelected() {
            $$('#inc-list .inc-row').forEach(r => r.classList.toggle('sel', r.dataset.id === S.selected));
        }

        function select(id) {
            if (!id || id === S.selected) return;
            S.selected = id;
            S.tab = 'overview';
            markSelected();
            const row = $('#inc-list').querySelector('.inc-row.sel');
            if (row) row.scrollIntoView({ block: 'nearest' });
            loadDetail(id);
        }

        /* ================= data loads ================= */
        async function loadList({ force = false } = {}) {
            const p = new URLSearchParams();
            if (S.statusFilter) p.set('status', S.statusFilter);
            if (S.severityFilter) p.set('severity', S.severityFilter);
            p.set('limit', '300');
            try {
                const [res, stats] = await Promise.all([
                    apiService.get('/incidents?' + p.toString()),
                    apiService.get('/incidents/stats').catch(() => null),
                ]);
                S.incidents = res.incidents || [];
                if (stats) { S.stats = stats; renderKpis(stats); }
                renderFilterPills();
                renderList(force);
                markLive(true);
            } catch (e) {
                markLive(false, e.message);
                $('#inc-list').innerHTML = `<div class="empty"><i class="fas fa-plug-circle-xmark"></i><div>QUEUE UNAVAILABLE</div><div class="rb">${esc(e.message)}</div></div>`;
            }
        }

        function markLive(ok, msg) {
            const pill = $('#live-pill');
            pill.classList.toggle('paused', !ok || !S.auto);
            $('#live-txt').textContent = ok
                ? (S.auto ? `LIVE · ${new Date().toLocaleTimeString()}` : `PAUSED · ${new Date().toLocaleTimeString()}`)
                : `OFFLINE${msg ? ' · ' + msg.slice(0, 40) : ''}`;
        }

        async function loadDetail(id, { keepTab = false, animate = !keepTab } = {}) {
            if (!keepTab) $('#inc-detail').innerHTML = `<div class="sk"><i></i><i></i><i></i></div><div class="sk"><i></i><i></i><i></i></div>`;
            try {
                const [d, tl] = await Promise.all([
                    apiService.get('/incidents/' + id),
                    apiService.get(`/incidents/${id}/timeline?splunk=${S.splunk}`).catch(() => ({ timeline: [] })),
                ]);
                if (S.selected !== id) return;   // user moved on while in flight
                S.detail = d;
                S.timeline = tl.timeline || [];
                renderDetail(animate, keepTab);
            } catch (e) {
                $('#inc-detail').innerHTML = `<div class="empty"><i class="fas fa-triangle-exclamation"></i><div>CASE FILE UNAVAILABLE</div><div class="rb">${esc(e.message)}</div></div>`;
            }
        }

        /* ================= detail render ================= */
        function gauge(value, max, label, color, animate) {
            const C = 213.6;
            const pct = Math.max(0, Math.min(1, (value || 0) / max));
            const off = C * (1 - pct);
            return `<div class="gauge">
                <svg viewBox="0 0 80 80">
                    <circle class="trk" cx="40" cy="40" r="34"></circle>
                    <circle class="val" cx="40" cy="40" r="34" style="stroke:${color};color:${color}"
                            data-off="${off}" stroke-dashoffset="${animate ? C : off}"></circle>
                </svg>
                <div class="ctr"><b data-gv data-target="${value}">${animate ? 0 : value}</b><small>${label}</small></div>
            </div>`;
        }

        function renderDetail(animate = true, preserveScroll = !animate) {
            const d = S.detail;
            if (!d) return;
            const pane = $('#inc-detail');
            const keepScroll = preserveScroll ? pane.scrollTop : 0;
            const fresh = animate;
            $('#dtl-sub').textContent = `${d.incident_key} · updated ${rel(d.updated_at || d.last_seen)}`;
            const sevColor = SEV_COLOR[d.severity] || 'var(--c-idle)';
            const curIdx = STATUSES.indexOf(d.status);
            const isFP = d.status === 'FALSE_POSITIVE';

            const counts = {
                overview: null,
                timeline: S.timeline.length,
                detections: (d.detections || []).length,
                evidence: (d.evidence || []).length,
                notes: (d.analyst_notes || '').split('\n').filter(Boolean).length,
                activity: (d.activity || []).length,
            };

            pane.innerHTML = `
              <div class="dtl${fresh ? '' : ' no-anim'}">
                <div class="hero">
                    <div class="hero-top">
                        <div style="min-width:240px;flex:1">
                            <div class="keyline">${esc(d.incident_key)} · ${d.auto_created ? 'AUTO-CORRELATED' : 'ANALYST-CREATED'} · first seen ${fmt(d.first_seen)}</div>
                            <h3>${esc(d.title)}</h3>
                            <div class="badges">
                                <span class="sev sev-${esc(d.severity)}">${esc(d.severity)}</span>
                                <span class="st st-${esc(d.status)}">${esc(String(d.status).replace('_', ' '))}</span>
                                <span class="mini"><i class="fas fa-clock"></i> last activity ${rel(d.last_seen)}</span>
                                <span class="mini"><i class="fas fa-user-shield"></i> ${d.assigned_analyst ? esc(d.assigned_analyst) : 'unassigned'}</span>
                            </div>
                        </div>
                        <div class="gauges">
                            ${gauge(Math.round(d.risk_score ?? 0), 100, 'risk', sevColor, fresh)}
                            ${gauge(Math.round((d.confidence ?? 0) * 100), 100, 'confidence', 'var(--acc)', fresh)}
                        </div>
                    </div>

                    <div class="flow">
                        ${STATUSES.map((s, i) => `
                            <button class="flow-seg ${d.status === s ? 'cur' : (curIdx > i && curIdx !== -1 ? 'done' : '')}"
                                    style="--i:${i}" data-set="${s}"><span>${s.toLowerCase()}</span></button>`).join('')}
                        <button class="flow-seg fp ${isFP ? 'cur' : ''}" style="--i:5" data-set="FALSE_POSITIVE"><span>false positive</span></button>
                    </div>

                    <div class="hero-actions">
                        <button class="sbtn" id="act-assign"><i class="fas fa-user-plus"></i>
                            ${d.assigned_analyst && S.me && d.assigned_analyst === S.me.email ? 'RELEASE' : 'ASSIGN TO ME'}</button>
                        <select class="sel-mini" id="act-sev" title="Analyst severity override">
                            ${['LOW', 'MEDIUM', 'HIGH', 'CRITICAL'].map(s => `<option ${d.severity === s ? 'selected' : ''}>${s}</option>`).join('')}
                        </select>
                        <button class="sbtn" id="act-link"><i class="fas fa-link"></i> LINK EVENTS</button>
                        <button class="sbtn" id="act-copy"><i class="fas fa-clipboard"></i> COPY SUMMARY</button>
                        <button class="soc-btn" id="inc-export" data-key="${esc(d.incident_key)}"><i class="fas fa-file-pdf"></i> EXPORT PDF</button>
                    </div>
                </div>

                <nav class="tabs" id="dtl-tabs">
                    ${Object.keys(counts).map(t => `
                        <button class="tab ${S.tab === t ? 'on' : ''}" data-tab="${t}">${t}${counts[t] != null ? `<b>${counts[t]}</b>` : ''}</button>`).join('')}
                </nav>
                <div class="tab-body" id="tab-body"></div>
              </div>`;

            renderTab();
            wireDetail();
            pane.scrollTop = keepScroll;
            if (fresh) {
                requestAnimationFrame(() => {
                    $$('#inc-detail .gauge .val').forEach(c => c.style.strokeDashoffset = c.dataset.off);
                    $$('#inc-detail [data-gv]').forEach(b => countUp(b, Number(b.dataset.target), 1100));
                });
            }
        }

        /* ---- tab content builders ---- */
        function tabOverview(d) {
            /* risk_breakdown mixes score contributions with raw evidence counts —
               only the score contributions belong on a shared 0..total bar scale. */
            const rbk = Object.entries(d.risk_breakdown || {});
            const isScore = ([k, v]) => /component|score|^total$/i.test(k) && isFinite(Number(v));
            const scoreRows = rbk.filter(isScore);
            const factRows = rbk.filter(r => !isScore(r));
            const scoreMax = Math.max(1, ...scoreRows.map(([, v]) => Number(v) || 0));
            const tactics = new Set((d.attack_techniques || []).map(t => String(t.tactic || '').toLowerCase().replace(/\s+/g, '-')));

            return `
            <div class="sec" style="--i:0">
                <h4>Why this case &amp; this severity</h4>
                <div class="why">
                    ${(d.detection_reasons || []).length
                    ? `<ul>${d.detection_reasons.map((r, i) => `<li style="--i:${i}">${esc(r)}</li>`).join('')}</ul>`
                    : '<span class="rb">manually created — no automated correlation reasons</span>'}
                    ${scoreRows.length ? `<div class="rbk">${scoreRows.map(([k, v], i) => {
                        const n = Number(v) || 0;
                        return `<div class="rbk-row" style="--i:${i}">
                            <span>${esc(k)}</span>
                            <span class="rbk-bar"><span data-w="${n > 0 ? Math.max(2, n / scoreMax * 100) : 0}"></span></span>
                            <b>${esc(v)}</b>
                        </div>`;
                    }).join('')}</div>` : ''}
                    ${factRows.length ? `<div class="facts">${factRows.map(([k, v]) =>
                        `<span class="fact"><em>${esc(k)}</em><b>${esc(v)}</b></span>`).join('')}</div>` : ''}
                </div>
            </div>

            <div class="sec" style="--i:1">
                <h4>Kill chain coverage</h4>
                <div class="kc">
                    ${KILLCHAIN.map((k, i) => `<div class="kc-seg ${tactics.has(k) ? 'hit' : ''}" style="--i:${i}" title="${k.replace(/-/g, ' ')}"><span>${KC_LABEL[k] || k.replace(/-/g, ' ')}</span></div>`).join('')}
                </div>
            </div>

            <div class="sec" style="--i:2">
                <h4>ATT&amp;CK techniques observed
                    <button class="sec-act" id="act-tech"><i class="fas fa-pen"></i> edit</button>
                </h4>
                ${(d.attack_techniques || []).length
                    ? d.attack_techniques.map(t => `<a class="chip" href="mitre.html" title="${esc(t.tactic || '')}"><i class="fas fa-chess-board"></i> ${esc(t.id)} ${esc(t.name || '')}</a>`).join('')
                    : '<span class="rb">no techniques mapped</span>'}
            </div>

            <div class="sec" style="--i:3">
                <h4>Attribution</h4>
                <div class="attr">
                    <div class="attr-box">
                        <span>source ips</span>
                        ${(d.source_ips || []).map(x => `<a class="chip" href="geo.html?ip=${encodeURIComponent(x)}"><i class="fas fa-location-crosshairs"></i> ${esc(x)}</a>`).join('') || '<span class="rb">—</span>'}
                    </div>
                    <div class="attr-box">
                        <span>users targeted</span>
                        ${(d.related_users || []).map(x => `<span class="chip usr"><i class="fas fa-user"></i> ${esc(x)}</span>`).join('') || '<span class="rb">—</span>'}
                    </div>
                    <div class="attr-box">
                        <span>sensors</span>
                        ${(d.related_sensors || []).map(x => `<span class="chip"><i class="fas fa-satellite-dish"></i> ${esc(x)}</span>`).join('') || '<span class="rb">—</span>'}
                    </div>
                    <div class="attr-box">
                        <span>indicators of compromise</span>
                        ${(d.iocs || []).map(i => `<span class="chip ioc"><i class="fas fa-fingerprint"></i> ${esc(i.type)}:${esc(i.value)}<button class="ioc-del" data-ioc="${esc(i.value)}" title="remove">&times;</button></span>`).join('') || '<span class="rb">—</span>'}
                        <div class="ioc-add" style="margin-top:8px">
                            <select id="di-type" class="sel-mini">${IOC_TYPES.map(t => `<option>${t}</option>`).join('')}</select>
                            <input id="di-value" placeholder="add an indicator…">
                            <button class="sbtn" id="di-add"><i class="fas fa-plus"></i></button>
                        </div>
                    </div>
                </div>
            </div>

            <div class="sec" style="--i:4">
                <h4>Linked events (${(d.linked_events || []).length})</h4>
                <table class="det">
                    <thead><tr><th>event id</th><th>source</th><th>correlation reason</th><th>added</th></tr></thead>
                    <tbody>${(d.linked_events || []).slice(0, 60).map((e, i) => `
                        <tr style="--i:${Math.min(i, 16)}">
                            <td class="mono">${esc(e.event_id)}</td>
                            <td>${esc(e.source)}</td>
                            <td class="rb">${esc(e.correlation_reason || '')}</td>
                            <td class="rb">${fmt(e.added_at)}</td>
                        </tr>`).join('') || '<tr><td colspan="4" class="rb">no events linked</td></tr>'}
                    </tbody>
                </table>
            </div>`;
        }

        function tabTimeline() {
            const t = S.timeline;
            return `
            <div class="sec" style="--i:0">
                <h4>Attack reconstruction

                </h4>
                ${t.length ? `<div class="tl">${t.map((e, i) => `
                    <div class="tl-item ${e.severity === 'CRITICAL' ? 'crit' : ''}" style="--i:${Math.min(i, 30)};--sv:${SEV_COLOR[e.severity] || 'var(--acc)'}">
                        <div class="tl-t">${fmt(e.timestamp)} · ${esc(e.source)}${e.attack_technique ? ' · ' + esc(e.attack_technique) : ''}</div>
                        <div class="tl-h">
                            <span>${esc(e.event_type)}</span>

                            ${e.source_ip ? `<span class="mini">${esc(e.source_ip)}</span>` : ''}
                            ${e.destination ? `<span class="mini">→ ${esc(e.destination)}</span>` : ''}
                            ${e.username ? `<span class="mini">user=${esc(e.username)}</span>` : ''}
                            ${e.ioc ? `<span class="chip ioc">${esc(e.ioc)}</span>` : ''}
                        </div>
                        <div class="tl-r">${esc(e.reason || '')}${e.ref ? ' · ref ' + esc(e.ref) : ''}</div>
                    </div>`).join('')}</div>`
                    : '<div class="empty"><i class="fas fa-timeline"></i><div>NO TIMELINE ENTRIES YET</div></div>'}
            </div>`;
        }

        function tabDetections(d) {
            const dets = d.detections || [];
            return `
            <div class="sec" style="--i:0">
                <h4>Rule detections</h4>
                ${dets.length ? dets.map((x, i) => `
                    <div class="dcard" style="--i:${Math.min(i, 16)};--sv:${SEV_COLOR[x.severity] || 'var(--c-idle)'}">
                        <div class="dh">
                            <div class="dn">${esc(x.rule_name)}</div>
                            <div>
                                <span class="sev sev-${esc(x.severity)}">${esc(x.severity)}</span>
                                <span class="mini">conf ${num(x.confidence, 2)}</span>
                            </div>
                        </div>
                        <div class="rb" style="margin-top:6px">
                            ${esc(x.rule_id)}${x.rule_source ? ' · ' + esc(x.rule_source) : ''}
                            ${x.attack_technique ? ` · <span style="color:var(--acc)">${esc(x.attack_technique)}${x.attack_tactic ? ' / ' + esc(x.attack_tactic) : ''}</span>` : ''}
                        </div>
                        ${x.reason ? `<div class="rb" style="margin-top:5px;color:var(--text-secondary)">${esc(x.reason)}</div>` : ''}
                        <div class="rb" style="margin-top:5px">match: ${esc(JSON.stringify(x.match_conditions))}</div>
                        <div class="rb" style="margin-top:5px">
                            ${(x.matched_event_ids || []).length} matched events
                            ${x.source_ip ? ' · ' + esc(x.source_ip) : ''}
