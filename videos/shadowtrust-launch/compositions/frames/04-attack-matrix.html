  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (function () {
      const root = document.querySelector('[data-composition-id="04-attack-matrix"]');
      const $ = (sel) => root.querySelector(sel);
      const tl = gsap.timeline({ paused: true });
      // split a line into word spans so each word can land on its own beat
      function words(el) {
        const parts = el.textContent.trim().split(' ');
        el.textContent = '';
        return parts.map((w, i) => {
          const s = document.createElement('span');
          s.textContent = w;
          s.style.display = 'inline-block';
          el.appendChild(s);
          if (i < parts.length - 1) el.appendChild(document.createTextNode(' '));
          return s;
        });
      }
      // per-word staggered reveal: start times are computed once from the word list
      function reveal(el, at, step, rise) {
        words(el).forEach((w, i) => {
          tl.fromTo(w, { opacity: 0, y: rise }, { opacity: 1, y: 0, duration: 0.8, ease: 'power3.out' }, at + i * step);
        });
      }

      // Scene 1: the recording plays for the whole frame (it is mounted at the host root by the assembler).
      // Scene 2 (0.2 to 1.2s): the label line arrives under the window, then holds still.
      tl.fromTo($('.f04-dot'), { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.45, ease: 'power3.out' }, 0.2);
      tl.fromTo($('.f04-name'), { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.6, ease: 'power3.out' }, 0.28);
      tl.fromTo($('.f04-desc'), { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.6, ease: 'power3.out' }, 0.5);

      window.__timelines = window.__timelines || {};
      window.__timelines["04-attack-matrix"] = tl;
    })();
  </script>
