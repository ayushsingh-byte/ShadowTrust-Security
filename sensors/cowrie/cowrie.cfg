# Cowrie configuration for the local honeynet.
#
# Only the settings that matter for this project are overridden; everything
# else falls back to cowrie.cfg.dist inside the image, so upgrading the image
# does not require rewriting this file.
#
# The critical setting is [output_jsonlog]: it produces the newline-delimited
# JSON the collector tails. Without it Cowrie writes only its human-readable
# text log, which the pipeline does not parse.

[honeypot]
# What the attacker sees in the shell prompt and in `uname -a`.
hostname = srv-prod-01

# Where downloaded files and tty recordings land, inside the container.
download_path = var/lib/cowrie/downloads
ttylog_path = var/lib/cowrie/tty

# Emulated filesystem — the image ships a populated one.
filesystem = share/cowrie/fs.pickle
contents_path = honeyfs
txtcmds_path = txtcmds

# Report the attacker's real source IP rather than a rewritten one.
# (Relevant because Docker NATs the connection.)
fake_addr =

# Keep sessions alive long enough to capture a realistic command sequence.
interactive_timeout = 300
authentication_timeout = 120

[shell]
# Values reported by `uname -a` and friends. Chosen to look like an ordinary
# Linux server rather than a honeypot.
kernel_version = 5.15.0-91-generic
kernel_build_string = #101-Ubuntu SMP
hardware_platform = x86_64
operating_system = GNU/Linux

[ssh]
enabled = true
listen_endpoints = tcp:2222:interface=0.0.0.0
# Banner presented on connect.
version = SSH-2.0-OpenSSH_8.9p1 Ubuntu-3ubuntu0.4

[telnet]
enabled = true
listen_endpoints = tcp:2223:interface=0.0.0.0

# ── Outputs ──────────────────────────────────────────────────────────────────

# The pipeline's input. One JSON object per line, appended as events occur.
[output_jsonlog]
enabled = true
logfile = var/log/cowrie/cowrie.json
epoch_timestamp = false

# Human-readable log, useful when debugging the sensor itself.
[output_textlog]
enabled = true
logfile = var/log/cowrie/cowrie.log
format = text

# Everything below is explicitly disabled: each would phone out to a third
# party, which a local-first lab must not do without being asked.
[output_virustotal]
enabled = false

[output_hpfeeds3]
enabled = false

[output_dshield]
enabled = false
