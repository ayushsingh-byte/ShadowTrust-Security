server {
  listen 80;
  server_name northstar-retail.example.com;
  root /var/www/html;
  index index.html;

  location /uploads/ { autoindex on; }
  location ~ \.php$ { fastcgi_pass unix:/run/php/php8.2-fpm.sock; include fastcgi_params; }
  location /api/    { proxy_pass http://127.0.0.1:8000; }
}
