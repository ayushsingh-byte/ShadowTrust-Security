id: st-recon-006
name: Port / service scan
description: >
  A single source touches many distinct destination ports in a short window —
  a port sweep across the honeynet's emulated services, or an explicit
  scan / reject burst. Pre-attack reconnaissance.
severity: MEDIUM
confidence: 0.6
source: honeypot
attack:
  technique: T1046
  tactic: Discovery
type: threshold
selection:
  sensor_event_type|contains:
    - connection
    - scan
    - reject
    - request
# Count distinct destination ports, not raw packets: a scan is "many ports".
distinct: destination_port
timeframe: 10m
group_by: source_ip
threshold: 6
