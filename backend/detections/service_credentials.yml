id: st-cred-003
name: Service credential capture
description: >
  A login attempt carrying a username and password against a Dionaea-emulated
  service (FTP, SMB, MSSQL, MySQL). The honeypot captures the credential even
  though no shell is granted.
severity: MEDIUM
confidence: 0.6
source: honeypot
attack:
  technique: T1110
  tactic: Credential Access
type: threshold
selection:
  # Dionaea login events are named "dionaea.<service>.login"; Cowrie's end in
  # .failed / .success, so this matches the service honeypots only.
  sensor_event_type|regex:
    - '\.login$'
  password|exists: true
timeframe: 30m
group_by: source_ip
threshold: 1
