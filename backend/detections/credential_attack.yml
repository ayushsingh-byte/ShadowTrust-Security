id: st-cred-002
name: Successful login after brute force
description: >
  A source IP produces several failed logins and then a successful one inside
  the same fifteen-minute window — the classic brute-force-then-access chain.
severity: CRITICAL
confidence: 0.85
source: honeypot
attack:
  technique: T1110
  tactic: Credential Access
type: sequence
group_by: source_ip
timeframe: 15m
steps:
  - selection:
      authentication_result: FAILURE
    min_count: 3
  - selection:
      authentication_result: SUCCESS
    min_count: 1
