id: suspicious-powershell
script_scenario: powershell
description: >
  Encoded / hidden PowerShell. Requires an active Windows analysis lab with a
  forwarding agent; without one this scenario produces no telemetry and the
  validation harness reports telemetry_coverage = 0 rather than a false PASS.
target: 127.0.0.1
requires: windows_lab
expected_telemetry:
  - sensor: windows
    min_events: 1
expected_detections:
  - st-exec-005
expected_techniques:
  - T1059.001
expected_severity: HIGH
expected_incident: true
