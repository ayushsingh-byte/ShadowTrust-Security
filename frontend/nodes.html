<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Honeynet Nodes | Shadow Trust</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        /* RACK UNIT STYLES */
        .rack-unit {
            height: 40px;
            border-bottom: 1px solid var(--st-border);
            background: var(--st-surface);
            display: flex;
            align-items: center;
            padding: 0 10px;
            font-family: var(--st-font-mono);
            font-size: 0.7rem;
            color: var(--st-text-faint);
        }

        .rack-light {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--st-border);
            margin-right: 5px;
            display: inline-block;
        }


        .rack-light.blink {
            animation: blink 0.5s infinite alternate;
        }

        @keyframes blink {
            from {
                opacity: 0.2;
            }

            to {
                opacity: 1;
            }
        }

        /* MODAL STYLES (Copied from Sectors) */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: var(--st-overlay);
            
            z-index: 9999;
            display: none;
            justify-content: center;
            align-items: center;
            opacity: 0;
            transition: opacity 0.2s;
        }

        .modal-overlay.active {
            display: flex;
            opacity: 1;
        }

        .modal-content {
            background: var(--st-surface-2);
            border: 1px solid var(--neon-cyan);
            width: 95vw;
            height: 95vh;
            display: flex;
            flex-direction: column;
            padding: 2rem;
            
            position: relative;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--st-border);
            padding-bottom: 1rem;
            margin-bottom: 1rem;
            flex-shrink: 0;
        }

        .modal-body {
            flex: 1;
            overflow-y: auto;
            padding-right: 10px;
        }

        .stat-grid-compact {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            margin-bottom: 20px;
        }

        .stat-box {
            background: var(--bg-card);
            border: 1px solid var(--st-border);
            padding: 15px;
            display: flex;
            flex-direction: column;
        }

        .terminal-log-container {
            height: 250px;
            background: var(--st-surface-2);
            border: 1px solid var(--st-border);
            padding: 10px;
            overflow-y: auto;
            font-family: var(--st-font-mono);
            font-size: 0.75rem;
            color: var(--st-text-secondary);
        }

        .log-entry {
            margin-bottom: 4px;
            border-bottom: 1px solid var(--st-border);
            padding-bottom: 2px;
            display: flex;
            gap: 10px;
        }

        .log-time {
            color: var(--st-text-faint);
            width: 70px;
        }

        .log-ip {
            color: var(--neon-cyan);
            width: 110px;
        }

        .log-type {
            color: var(--neon-purple);
            width: 100px;
        }

        .log-payload {
            color: var(--st-text-secondary);
            flex: 1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .terminal-table th {
            color: var(--st-text-faint);
            font-size: 0.7rem;
            text-align: left;
            padding: 5px;
        }

        .terminal-table td {
            padding: 5px;
            border-bottom: 1px solid var(--st-border);
            font-size: 0.8rem;
        }

        .ioc-tag {
            background: var(--st-surface);
            border: 1px solid var(--st-border);
            padding: 2px 6px;
            font-size: 0.7rem;
            color: var(--neon-cyan);
            margin-right: 5px;
            font-family: var(--st-font-mono);
            display: inline-block;
            margin-bottom: 5px;
            cursor: pointer;
        }

        .alert-item {
            padding: 10px;
            border-bottom: 1px solid var(--st-border);
        }

        .alert-item.sev-high {
            border-left: 3px solid var(--neon-red);
            background: color-mix(in srgb, var(--st-danger) 5%, transparent);
        }

        .alert-item.sev-med {
            border-left: 3px solid var(--neon-yellow);
            background: color-mix(in srgb, var(--st-warning) 5%, transparent);
        }

        .country-bar {
            height: 4px;
            background: var(--st-surface-hover);
            width: 100%;
            margin-top: 5px;
            border-radius: 2px;
            overflow: hidden;
        }

        /* RBAC Styles */
        .soc-card.restricted {
            filter: grayscale(1) opacity(0.4);
            cursor: not-allowed !important;
        }

        .soc-card.restricted:hover {
            transform: none;
            box-shadow: none;
            border-color: var(--st-border) !important;
        }

        .rbac-lock-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none;
            justify-content: center;
            align-items: center;
            background: color-mix(in srgb, var(--st-bg) 80%, transparent);
            z-index: 10;
        }

        .soc-card.restricted .rbac-lock-overlay {
            display: flex;
        }

        /* TOAST NOTIFICATION STYLES */
        .toast-container {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 10000;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .toast {
            background: var(--st-surface);
            box-shadow: var(--st-shadow-md);
            border: 1px solid var(--st-border);
            color: var(--st-text);
            padding: 15px 20px;
            min-width: 300px;
            border-left: 4px solid var(--neon-cyan);
            box-shadow: var(--st-shadow-md);
            animation: slideIn 0.3s ease-out forwards;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .toast.error {
            border-left-color: var(--neon-red);
        }

        .toast.warning {
            border-left-color: var(--neon-yellow);
        }

        @keyframes slideIn {
            from {
                transform: translateX(100%);
                opacity: 0;
            }

            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        @keyframes fadeOut {
            to {
                transform: translateX(100%);
                opacity: 0;
            }
        }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500;600;700&amp;display=swap">
    <link rel="stylesheet" href="css/tokens.css">
    <script src="js/theme.js"></script>
    <script src="js/live.js"></script>
</head>

<body>

    <div class="app-container">

        <!-- TOAST CONTAINER -->
        <div id="toastContainer" class="toast-container"></div>

        <!-- SIDEBAR -->
        <!-- SIDEBAR -->
        <aside class="sidebar" id="sidebar"></aside>

        <main class="main-content">

            <div class="top-bar">
                <div class="page-header">
                    <h2>HONEYNET NODES</h2>
                    <p>HONEYPOT DEPLOYMENT // <span id="gridStatus" class="text-muted">CHECKING SENSORS…</span></p>
                </div>
                <div class="filters-bar" style="display: flex; gap: 10px; align-items: center;">
                    <div style="color: var(--st-text-muted); font-size: 0.8rem; letter-spacing: 1px;">CLEARANCE LEVEL:</div>
                    <span id="clearanceBadge" class="badge badge-gray" title="Assigned by an administrator">—</span>
                    <button class="soc-btn soc-btn-primary" style="margin-left: 10px;" onclick="window.deployNode()">+ DEPLOY VM</button>
                </div>
            </div>

            <div class="dashboard-grid" style="grid-template-columns: 3fr 1fr; gap:20px;">

                <!-- LEFT COL: DYNAMIC NODE LIST -->
                <div id="nodeListContainer">
                    <!-- JS Injected Nodes will go here -->
                </div>

                <!-- RIGHT COL: RACK VIEW -->
                <div>
                    <div class="soc-card" style="padding:0; height:100%; min-height: 500px;">
                        <div class="soc-card-header" style="padding:15px;">
                            <span class="card-title">SENSOR RACK</span>
                        </div>
                        <div style="background:var(--st-surface-2); height:100%; border-top:1px solid var(--st-border); padding-bottom: 20px;">
                            <div id="rackUnits"><div class="rack-unit">Loading…</div></div>
                        </div>
                    </div>
                </div>

            </div>

            <!-- FOOTER SYSTEM STATUS -->
            <div
                style="margin-top:20px; border-top:1px solid var(--st-border); padding-top:10px; display:flex; justify-content:space-between; color:var(--st-text-faint); font-size:0.7rem; font-family:var(--st-font-mono);">
                <div>SHADOW TRUST NODE CLUSTER // v4.2.0-STABLE</div>
                <div>
                    <span style="margin-right:15px;"><i class="fas fa-circle text-green" style="font-size:0.5rem;"></i>
                        API: ONLINE</span>
                    <span style="margin-right:15px;"><i class="fas fa-circle text-green" style="font-size:0.5rem;"></i>
                        DB: ONLINE</span>
                    <span><i class="fas fa-circle text-green" style="font-size:0.5rem;"></i> WORKERS: 12/12</span>
                </div>
                <div>LATENCY: 12ms</div>
            </div>

        </main>
    </div>

    <script src="js/sidebar.js"></script>
    <script type="module">
        import { apiService } from './js/api.js';

        // Dismissable toast (was previously in the sector sub-dashboard script).
        function showToast(message, type = 'info') {
            const container = document.getElementById('toastContainer');
            if (!container) { console.log(`[${type}] ${message}`); return; }
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            const icon = type === 'error' ? 'fa-exclamation-triangle'
                : type === 'success' ? 'fa-check-circle' : 'fa-info-circle';
            toast.innerHTML = `<div class="toast-icon"><i class="fas ${icon}"></i></div>`
                + `<div class="toast-content"><div class="toast-title">System Notification</div>`
                + `<div class="toast-msg">${message}</div></div>`;
            container.appendChild(toast);
            setTimeout(() => toast.remove(), 4000);
        }
        window.showToast = showToast;

        // Check Auth
        if (!localStorage.getItem('access_token') && !localStorage.getItem('authToken')) {
            window.location.href = 'login.html';
        }

        apiService.get('/users/me').then((me) => {
            const badge = document.getElementById('clearanceBadge');
            if (!badge || !me) return;
            const tier = me.clearance_level != null ? `TIER ${me.clearance_level}` : 'UNASSIGNED';
            badge.textContent = `${tier} — ${(me.role || 'USER').replace(/_/g, ' ')}`;
        }).catch(() => {});

        // RENDER NODES — every figure comes from the API: Docker state and resource samples for
        // compose-managed sensors, stored fields for registered records.
        const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        const num = (v, digits = 1) => (typeof v === 'number' ? v.toFixed(digits) : 'n/a');
        let lastNodes = [];

        function formatUptime(seconds) {
            const s = Math.max(0, Math.floor(seconds || 0));
            const d = Math.floor(s / 86400), h = Math.floor((s % 86400) / 3600), m = Math.floor((s % 3600) / 60);
            if (d) return `${d}d ${h}h`;
            if (h) return `${h}h ${m}m`;
            return `${m}m ${s % 60}s`;
        }

        function metricsHtml(node) {
            if (node.verified === false) {
                return '<span title="Registered record with no container or heartbeat behind it">No live telemetry for this record</span>';
            }
            const m = node.metrics;
            if (!m || m.available === false) {
                return '<span title="The backend could not read Docker stats for this container">Resource metrics unavailable</span>';
            }
            if (m.running === false) return '<span>Container stopped</span>';
            const net = (typeof m.net_rx_kbps === 'number' && typeof m.net_tx_kbps === 'number') ? m.net_rx_kbps + m.net_tx_kbps : null;
            return `<span><i class="fas fa-microchip text-cyan"></i> CPU: ${num(m.cpu_percent)}%</span>`
                + `<span><i class="fas fa-memory text-purple"></i> RAM: ${num(m.memory_percent)}% (${num(m.memory_used_mb, 0)} MB)</span>`
                + `<span><i class="fas fa-network-wired text-green"></i> NET: ${net == null ? 'measuring…' : num(net, 2) + ' KB/s'}</span>`;
        }

        function statusBadge(node) {
            if (node.verified === false) {
                return '<div class="badge badge-yellow" title="Stored record, not verified against a running service">UNVERIFIED</div>';
            }
            return node.status === 'OFFLINE' ? '<div class="badge badge-gray">OFFLINE</div>' : '<div class="badge badge-green">ONLINE</div>';
        }

        function paintGridStatus(nodes) {
            const el = document.getElementById('gridStatus');
            if (!el) return;
            const sensors = nodes.filter((n) => n.verified !== false);
            const online = sensors.filter((n) => n.status !== 'OFFLINE').length;
            el.textContent = sensors.length ? `${online}/${sensors.length} SENSORS ONLINE` : 'NO SENSORS REPORTING';
            el.className = !sensors.length ? 'text-red' : online === sensors.length ? 'text-green' : online ? 'text-yellow' : 'text-red';
        }

        function paintRack(nodes) {
            const rack = document.getElementById('rackUnits');
            if (!rack) return;
            if (!nodes.length) {
                rack.innerHTML = '<div class="rack-unit">No nodes</div>';
                return;
            }
            rack.innerHTML = nodes.map((node, i) => {
                const state = node.verified === false ? 'UNVERIFIED' : node.status;
                const color = node.verified === false ? 'var(--st-warning)' : node.status === 'OFFLINE' ? 'var(--st-text-faint)' : 'var(--st-success)';
                return `<div class="rack-unit"><span class="text-mono" style="width:30px;">${String(i + 1).padStart(2, '0')}</span>`
                    + `<span style="flex:1;">${esc(node.name)} (${esc(node.type)})</span>`
                    + `<span class="rack-light" style="background:${color};" title="${esc(state)}"></span></div>`;
            }).join('');
        }

        function paint(nodes) {
            const container = document.getElementById('nodeListContainer');
            if (!nodes.length) {
                container.innerHTML = '<div style="color:var(--st-text-faint); padding:20px;">No Nodes Deployed.</div>';
            } else {
                container.innerHTML = nodes.map((node) => {
                    const isOffline = node.status === 'OFFLINE';
                    let color = 'var(--st-text-faint)';
                    let icon = 'fa-server';
                    if (node.type === 'honeypot') { color = 'var(--st-warning)'; icon = 'fa-graduation-cap'; }
                    if ((node.name || '').includes('DEF')) { color = 'var(--st-danger)'; icon = 'fa-shield-alt'; }
                    const cardStyle = `margin-bottom: 20px; border-left: 4px solid ${color}; position: relative; cursor: pointer; opacity: ${isOffline ? 0.6 : 1}`;
                    const action = isOffline
                        ? `<button class="soc-btn" onclick="window.startNode('${esc(node.node_id)}')" style="border-color:var(--neon-green); color:var(--neon-green);">START SERVICE</button>`
                        : `<button class="soc-btn" onclick="window.stopNode('${esc(node.node_id)}')" style="border-color:var(--neon-pink); color:var(--neon-pink);">STOP SERVICE</button>`;
                    return `
                        <div class="soc-card" style="${cardStyle}">
                            <div style="display:flex; justify-content:space-between; margin-bottom:15px;">
                                <div style="display:flex; gap:15px; align-items:center;">
                                    <i class="fas ${icon}" style="font-size:2rem; color:${color};"></i>
                                    <div>
                                        <div style="font-size:1.2rem; font-weight:700; color:var(--st-text);">${esc(node.name)} <span style="font-size:0.8rem; font-weight:400; color:var(--st-text-faint);">(${esc(node.type)})</span></div>
                                        <div class="text-mono" style="font-size:0.8rem; color:var(--st-text-muted);">${node.source === 'docker' ? 'Container' : 'IP'}: ${esc(node.ip_address)} | Region: ${esc(node.region || 'Local')}</div>
                                        <div class="text-mono" style="font-size:0.7rem; color:var(--st-text-secondary); margin-top:5px; display:flex; flex-wrap:wrap; gap:15px;">${metricsHtml(node)}</div>
                                        <div class="text-mono" style="font-size:0.7rem; color:var(--st-text-muted); margin-top:4px;">Attack activity (15 min): ${typeof node.activity_load === 'number' ? node.activity_load + '%' : 'n/a'}</div>
                                    </div>
                                </div>
                                <div style="text-align:right;">
                                    ${statusBadge(node)}
                                    <div style="margin-top:5px; font-size:0.7rem; color:var(--st-text-faint);">Uptime: ${node.verified === false ? '—' : formatUptime(node.uptime_seconds)}</div>
                                </div>
                            </div>
                            <div style="display:flex; gap:10px; margin-top:10px;">${action}</div>
                        </div>`;
                }).join('');
            }
            paintGridStatus(nodes);
            paintRack(nodes);
        }

        async function renderNodes() {
            const container = document.getElementById('nodeListContainer');
            if (!lastNodes.length) {
                container.innerHTML = '<div style="color:var(--st-text-faint); padding:20px;">Loading Nodes...</div>';
            }
            try {
                lastNodes = await apiService.get('/nodes/');
                paint(lastNodes);
            } catch (error) {
                console.error("Failed to load nodes:", error);
                container.innerHTML = '<div style="color:var(--neon-red); padding:20px;">Failed to load nodes. Backend might be offline.</div>';
                paintGridStatus([]);
            }
        }
        window.renderNodes = renderNodes;

        // Resource samples are pushed on the "metrics" channel every few seconds; a slower full
        // refresh keeps container state and uptime current.
        if (window.STLive) {
            window.STLive.on('metrics', (snapshot) => {
                let changed = false;
                lastNodes.forEach((node) => {
                    const sample = node.source === 'docker' ? snapshot[(node.type || '').toUpperCase()] : null;
                    if (sample) { node.metrics = sample; changed = true; }
                });
                if (changed) paint(lastNodes);
            });
        }
        setInterval(renderNodes, 30000);

        // DEPLOY NODE
        window.deployNode = async function () {
            const name = prompt("Enter Node Name (e.g., KALI-01):", "");
            if (!name) return;
            const type = prompt("Enter Type (honeypot, firewall, server):", "honeypot");

            try {
                showToast("Deploying Node...", "info");
                await apiService.post('/nodes/launch', { name, type, sector: "General" });
                showToast("Node Deployed Successfully!", "success");
                renderNodes();
            } catch (e) {
                showToast("Deployment Failed: " + e.message, "error");
            }
        }

        // STOP NODE
        window.stopNode = async function (id) {
            if (!confirm("Stop this node? Service will be interrupted.")) return;
            try {
                await apiService.post(`/nodes/${id}/stop`);
                renderNodes();
            } catch (e) { alert(e.message); }
        }

        // START NODE
        window.startNode = async function (id) {
            try {
                await apiService.post(`/nodes/${id}/start`);
                renderNodes();
            } catch (e) { alert(e.message); }
        }

        // Add event listener to Deploy Button
        document.querySelector('.filters-bar .soc-btn-primary').onclick = window.deployNode;

        // Initial Load
        renderNodes();

    </script>
</body>

</html>
