server {
    listen 5500;
    server_name _;

    root /usr/share/nginx/html;
    index dashboard.html;

    # ── API proxy ────────────────────────────────────────────────────────────
    # Serving the API under the same origin as the dashboard means browsers
    # never treat the calls as cross-origin, so viewing the dashboard from
    # another machine on the LAN needs no CORS configuration.
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Live event stream (Server-Sent Events) ───────────────────────────────
    # SSE needs its own block: buffering must be off or events arrive in
    # batches when the proxy buffer fills instead of the moment they happen,
    # and the read timeout must exceed the stream's idle heartbeat or nginx
    # closes a working connection every 60 seconds.
    location /api/v1/live/stream {
        proxy_pass http://backend:8000/api/v1/live/stream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header X-Real-IP $remote_addr;

        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_read_timeout 24h;
    }

    # Serve static files; fall back to index.html for SPA-style navigation
    location / {
        try_files $uri $uri/ /dashboard.html;
    }

    # Cache-busting headers for HTML files
    location ~* \.html$ {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        add_header Pragma "no-cache";
    }

    # No cache for CSS/JS so changes are immediately visible
    location ~* \.(css|js)$ {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        add_header Pragma "no-cache";
    }

    # Long-cache for images/fonts only
    location ~* \.(png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json;
}
