server {
    listen 5500;
    server_name _;

    root /usr/share/nginx/html;
    index dashboard.html;

    # Serve static files; fall back to index.html for SPA-style navigation
    location / {
        try_files $uri $uri/ /dashboard.html;
    }

    # Cache-busting headers for HTML files
    location ~* \.html$ {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        add_header Pragma "no-cache";
    }

    # No cache for CSS/JS so changes are immediately visible
    location ~* \.(css|js)$ {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        add_header Pragma "no-cache";
    }

    # Long-cache for images/fonts only
    location ~* \.(png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json;
}
