<!DOCTYPE html>
<html lang="en" data-require-admin>

<head>
    <meta charset="UTF-8">
    <title>Access Control Console | Shadow Trust</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500;600;700&amp;display=swap">
    <link rel="stylesheet" href="css/tokens.css">
    <script src="js/theme.js"></script>
</head>

<body class="bg-dark text-white">

    <div class="app-container">
        <!-- Sidebar (Reuse existing logic or simplified version) -->
        <aside class="sidebar" id="sidebar"></aside>

        <main class="main-content">
            <div class="top-bar">
                <div class="page-header">
                    <h2>ADVANCED ACCESS CONTROL</h2>
                    <p>SUPER ADMIN CONSOLE // <span class="text-purple">LEVEL 5 CLEARANCE</span></p>
                </div>
            </div>

            <!-- Inner Page Tab Nav -->
            <div style="display:flex; gap:15px; margin-bottom:20px; border-bottom:1px solid var(--st-border); padding-bottom:10px;">
                <button class="soc-btn tab-btn active" onclick="switchTab('tab-requests', this)"
                    style="border-color:var(--neon-purple);"><i class="fas fa-user-clock"></i> Access Requests</button>
                <button class="soc-btn tab-btn" onclick="switchTab('tab-logs', this)"><i class="fas fa-history"></i>
                    Audit Logs</button>
            </div>

            <!-- Tab: Access Requests -->
            <div id="tab-requests">
                <div class="soc-card">
                    <div class="soc-card-header">
                        <span class="card-title">PENDING ACCESS REQUESTS</span>
                        <button class="soc-btn" onclick="loadPendingUsers()"><i class="fas fa-sync"></i>
                            Refresh</button>
                    </div>
                    <table class="terminal-table">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>USERNAME</th>
                                <th>EMAIL</th>
                                <th>NAME</th>
                                <th>DEPARTMENT</th>
                                <th>REQUESTED LEVEL</th>
                                <th>STATUS</th>
                                <th>ACTIONS</th>
                            </tr>
                        </thead>
                        <tbody id="pendingUsersTable">
                            <!-- Populated by JS -->
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- Tab: Audit Logs -->
            <div id="tab-logs" style="display:none;">
                <div class="soc-card">
                    <div class="soc-card-header">
                        <span class="card-title">ACCESS CONTROL AUDIT LOGS</span>
                        <button class="soc-btn" onclick="loadLogs()"><i class="fas fa-sync"></i> Refresh</button>
                    </div>
                    <table class="terminal-table">
                        <thead>
                            <tr>
                                <th>TIME</th>
                                <th>ADMIN</th>
                                <th>TARGET USER</th>
                                <th>ACTION</th>
                                <th>DETAILS</th>
                            </tr>
                        </thead>
                        <tbody id="accessLogsTable">
                            <!-- Populated by JS -->
                        </tbody>
                    </table>
                </div>
            </div>

        </main>
    </div>

    <!-- Approval Modal -->
    <div id="approveModal" class="modal"
        style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:var(--st-overlay); z-index:1000;">
        <div class="modal-content"
            style="background:var(--st-surface); border:1px solid var(--st-border); width:400px; margin:100px auto; padding:20px; border-radius:5px;">
            <h3 class="text-white">APPROVE USER ACCESS</h3>
            <input type="hidden" id="approveUserId">
            <div id="approveRequestedInfo"
                style="margin-top:15px; padding:12px; background:color-mix(in srgb, var(--st-warning) 8%, transparent); border:1px solid var(--st-warning); border-radius:6px; color:var(--st-warning); font-size:0.85rem;">
                <!-- Populated by JS with requested level info -->
            </div>
            <div class="form-group" style="margin-top:15px;">
                <label class="form-label text-muted">ASSIGN ROLE</label>
                <select id="approveRole" class="form-select"
                    style="width:100%; padding:8px; background:var(--st-surface-2); color:var(--st-text); border:1px solid var(--st-border);">
                    <option value="OPERATIVE">OPERATIVE (Level 1 — Basic Access)</option>
                    <option value="SPECIALIST">SPECIALIST (Level 2 — Intermediate Access)</option>
                    <option value="OVERSEER">OVERSEER (Level 3 — Full Access)</option>
                </select>
            </div>
            <div class="form-group" style="margin-top:15px;">
                <label class="form-label text-muted">CLEARANCE LEVEL (1-3)</label>
                <input type="number" id="approveLevel" class="form-input" min="1" max="3" value="1"
                    style="width:100%; padding:8px; background:var(--st-surface-2); color:var(--st-text); border:1px solid var(--st-border);">
            </div>
            <div style="text-align:right; margin-top:20px;">
                <button class="soc-btn" onclick="closeModal('approveModal')">CANCEL</button>
                <button class="soc-btn" style="border-color:var(--st-success); color:var(--st-success);" onclick="submitApproval()">CONFIRM
                    APPROVAL</button>
            </div>
        </div>
    </div>

    <!-- Denial Modal -->
    <div id="denyModal" class="modal"
        style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:var(--st-overlay); z-index:1000;">
        <div class="modal-content"
            style="background:var(--st-surface); border:1px solid var(--st-border); width:400px; margin:100px auto; padding:20px; border-radius:5px;">
            <h3 class="text-red">DENY ACCESS REQUEST</h3>
            <input type="hidden" id="denyUserId">
            <div class="form-group" style="margin-top:15px;">
                <label class="form-label text-muted">REASON FOR REJECTION</label>
                <textarea id="denyReason" class="form-input" rows="3"
                    style="width:100%; padding:8px; background:var(--st-surface-2); color:var(--st-text); border:1px solid var(--st-border);"></textarea>
            </div>
            <div style="text-align:right; margin-top:20px;">
                <button class="soc-btn" onclick="closeModal('denyModal')">CANCEL</button>
                <button class="soc-btn" style="border-color:var(--st-danger); color:var(--st-danger);" onclick="submitDenial()">REJECT
                    REQUEST</button>
            </div>
        </div>
    </div>

    <script type="module" src="js/access_control.js"></script>
    <script>
        // Simple Tab Switcher
        function switchTab(tabId, btn) {
            document.querySelectorAll('main > div[id^="tab-"]').forEach(el => el.style.display = 'none');
            document.getElementById(tabId).style.display = 'block';
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            if (btn) btn.classList.add('active');
            // Auto-load audit logs when switching to logs tab
            if (tabId === 'tab-logs' && typeof loadLogs === 'function') loadLogs();
        }

        window.openModal = (id) => document.getElementById(id).style.display = 'block';
        window.closeModal = (id) => document.getElementById(id).style.display = 'none';
        window.switchTab = switchTab;
    </script>
    <script src="js/sidebar.js"></script>
</body>

</html>
