<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sudo Access | Shadow Trust</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body,
        html {
            margin: 0;
            padding: 0;
            height: 100vh;
            width: 100vw;
            display: flex;
            background: #050000;
            font-family: 'Outfit', sans-serif;
            overflow: hidden;
        }

        /* LEFT SIDE: VISUAL */
        .visual-pane {
            flex: 1;
            /* Red Hacking / Security Visual */
            background: url('https://images.unsplash.com/photo-1555949963-ff9fe0c870eb?q=80&w=2670&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 80px;
        }

        .visual-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            /* Red tint for danger/admin */
            background: linear-gradient(to top, rgba(15, 0, 2, 0.98) 0%, rgba(55, 0, 10, 0.6) 100%);
        }

        .visual-content {
            position: relative;
            z-index: 2;
            color: #fff;
            max-width: 600px;
        }

        .visual-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 0, 85, 0.15);
            backdrop-filter: blur(5px);
            padding: 8px 16px;
            border-radius: 4px;
            font-size: 0.8rem;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 1px;
            border: 1px solid rgba(255, 0, 85, 0.4);
            color: #ff0055;
            font-weight: 700;
        }

        .visual-title {
            font-size: 3.5rem;
            font-weight: 700;
            margin-bottom: 20px;
            line-height: 1.1;
            background: linear-gradient(90deg, #fff 0%, #ff80ab 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .visual-text {
            font-size: 1.1rem;
            line-height: 1.6;
            color: #ffb3c1;
            font-weight: 300;
            border-left: 3px solid #ff0055;
            padding-left: 20px;
        }

        /* RIGHT SIDE: LOGIN FORM */
        .login-pane {
            width: 35%;
            min-width: 500px;
            background: #080102;
            /* Very dark red/black */
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 80px;
            border-left: 1px solid #330510;
            position: relative;
        }

        .logo-area {
            margin-bottom: 50px;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .logo-mark {
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid #ff0055;
            color: #ff0055;
            font-size: 1.2rem;
            font-weight: bold;
        }

        .logo-text {
            font-size: 1.2rem;
            font-weight: 700;
            letter-spacing: 2px;
            color: #fff;
        }

        .login-header {
            margin-bottom: 40px;
        }

        .login-header h1 {
            font-size: 2rem;
            color: #ff0055;
            /* Red Header */
            margin-bottom: 10px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .login-header p {
            color: #888;
            font-size: 0.9rem;
            font-family: 'JetBrains Mono', monospace;
        }

        .input-group {
            margin-bottom: 30px;
            position: relative;
        }

        .input-group label {
            display: block;
            margin-bottom: 12px;
            color: #a05060;
            font-size: 0.8rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .clean-input {
            width: 100%;
            padding: 16px;
            background: rgba(255, 0, 85, 0.05);
            /* Subtle red bg */
            border: 1px solid #440a15;
            border-radius: 0;
            /* Sharp corners for security feel */
            color: #fff;
            font-size: 1rem;
            outline: none;
            transition: 0.3s;
            font-family: 'JetBrains Mono', monospace;
        }

        .clean-input:focus {
            border-color: #ff0055;
            background: rgba(255, 0, 85, 0.1);
            box-shadow: 0 0 15px rgba(255, 0, 85, 0.2);
        }

        .btn-clean {
            width: 100%;
            padding: 18px;
            background: #ff0055;
            color: #fff;
            border: none;
            font-size: 0.95rem;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 10px;
            border-radius: 0;
            position: relative;
            overflow: hidden;
        }

        .btn-clean:hover {
            background: #cc0044;
            box-shadow: 0 0 30px rgba(255, 0, 85, 0.4);
        }

        .warning-box {
            margin-top: 40px;
            padding: 20px;
            border: 1px dashed #ff0055;
            color: #ff0055;
            font-size: 0.75rem;
            text-align: center;
            background: rgba(255, 0, 85, 0.05);
            font-family: 'JetBrains Mono', monospace;
        }

        .logout-link {
            position: absolute;
            top: 40px;
            right: 40px;
            color: #666;
            text-decoration: none;
            font-size: 0.9rem;
            transition: 0.3s;
        }

        .logout-link:hover {
            color: #fff;
        }

        @media (max-width: 1000px) {
            .visual-pane {
                display: none;
            }

            .login-pane {
                width: 100%;
                min-width: auto;
            }
        }
    </style>
</head>

<body>

    <!-- LEFT: SECURITY VISUAL -->
    <div class="visual-pane">
        <div class="visual-overlay"></div>
        <div class="visual-content">
            <div class="visual-badge"><i class="fas fa-exclamation-triangle"></i> &nbsp; RESTRICTED AREA</div>
            <div class="visual-title">Root Access<br>Control</div>
            <div class="visual-text">
                This interface is monitored. All login attempts are logged, geolocated, and reported to the Technical
                Team.
            </div>
        </div>
    </div>

    <!-- RIGHT: LOGIN FORM -->
    <div class="login-pane">

        <div class="logout-link">
            <a href="login.html" style="color:#666; text-decoration:none; margin-right:20px; transition:0.3s;"><i
                    class="fas fa-sign-out-alt"></i> Back to Login</a>
            <a href="dashboard.html" style="color:#ff0055; text-decoration:none; font-weight:bold; transition:0.3s;"><i
                    class="fas fa-arrow-left"></i> Back to Dashboard</a>
        </div>

        <div class="logo-area">
            <div class="logo-mark"><i class="fas fa-user-shield"></i></div>
            <div class="logo-text">SHADOW TRUST : : ADMIN</div>
        </div>

        <div class="login-header">
            <h1>Identity Check</h1>
            <p>Enter root credentials for elevated privilege escalation.</p>
        </div>

        <form id="adminLoginForm">
            <div class="input-group">
                <label>Root Identifier</label>
                <input type="text" class="clean-input" placeholder="Enter root identifier" required>
            </div>

            <div class="input-group">
                <label>Sudo Key</label>
                <input type="password" class="clean-input" placeholder="••••••••••••••••" required>
            </div>

            <div class="input-group">
                <label>2FA Hardware Token</label>
                <input type="text" class="clean-input" placeholder="000-000" maxlength="7"
                    style="letter-spacing: 5px; text-align: center;">
            </div>

            <button type="submit" class="btn-clean">
                <i class="fas fa-fingerprint"></i> &nbsp; Authenticate Root
            </button>
        </form>
    </div>

    <script>
        document.getElementById('adminLoginForm').addEventListener('submit', function (e) {
            e.preventDefault();
            const btn = e.target.querySelector('button');
            const originalText = btn.innerHTML;

            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Authenticating...';
            btn.style.opacity = '0.7';

            // Simulate admin network lookup
            setTimeout(() => {
                // Grant admin access token
                localStorage.setItem('isAdmin', 'true');

                // Redirect to actual admin console
                window.location.href = 'admin.html';
            }, 1000);
        });
    </script>
    </div>

</body>


</html>
