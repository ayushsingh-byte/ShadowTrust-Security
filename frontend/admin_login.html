<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Admin Login | Shadow Trust</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body,
        html {
            margin: 0;
            padding: 0;
            height: 100vh;
            width: 100vw;
            display: flex;
            background: var(--st-bg);
            font-family: var(--st-font-main);
            overflow: hidden;
        }

        /* LEFT SIDE: VISUAL */
        .visual-pane {
            flex: 1;
            /* Red Hacking / Security Visual */
            background: url('https://images.unsplash.com/photo-1555949963-ff9fe0c870eb?q=80&w=2670&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 80px;
        }

        .visual-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            /* Red tint for danger/admin */
            background: linear-gradient(to top, var(--st-surface-2) 0%, color-mix(in srgb, var(--st-surface-2) 55%, transparent) 100%);
        }

        .visual-content {
            position: relative;
            z-index: 2;
            color: var(--st-text);
            max-width: 600px;
        }

        .visual-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: color-mix(in srgb, var(--st-danger) 15%, transparent);
            
            padding: 8px 16px;
            border-radius: 4px;
            font-size: 0.8rem;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 1px;
            border: 1px solid color-mix(in srgb, var(--st-danger) 40%, transparent);
            color: var(--st-danger);
            font-weight: 700;
        }

        .visual-title {
            font-size: 3.5rem;
            font-weight: 700;
            margin-bottom: 20px;
            line-height: 1.1;
            background: linear-gradient(90deg, var(--st-text) 0%, var(--st-text) 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .visual-text {
            font-size: 1.1rem;
            line-height: 1.6;
            color: var(--st-danger);
            font-weight: 300;
            border-left: 3px solid var(--st-danger);
            padding-left: 20px;
        }

        /* RIGHT SIDE: LOGIN FORM */
        .login-pane {
            width: 35%;
            min-width: 500px;
            background: var(--st-surface-2);
            /* Very dark red/black */
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 80px;
            border-left: 1px solid color-mix(in srgb, var(--st-danger) 35%, var(--st-border));
            position: relative;
        }

        .logo-area {
            margin-bottom: 50px;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .logo-mark {
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid var(--st-danger);
            color: var(--st-danger);
            font-size: 1.2rem;
            font-weight: bold;
        }

        .logo-text {
            font-size: 1.2rem;
            font-weight: 700;
            letter-spacing: 2px;
            color: var(--st-text);
        }

        .login-header {
            margin-bottom: 40px;
        }

        .login-header h1 {
            font-size: 2rem;
            color: var(--st-danger);
            /* Red Header */
            margin-bottom: 10px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .login-header p {
            color: var(--st-text-muted);
            font-size: 0.9rem;
            font-family: var(--st-font-mono);
        }

        .input-group {
            margin-bottom: 30px;
            position: relative;
        }

        .input-group label {
            display: block;
            margin-bottom: 12px;
            color: var(--st-danger);
            font-size: 0.8rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .clean-input {
            width: 100%;
            padding: 16px;
            background: color-mix(in srgb, var(--st-danger) 5%, transparent);
            /* Subtle red bg */
            border: 1px solid color-mix(in srgb, var(--st-danger) 35%, var(--st-border));
            border-radius: 0;
            /* Sharp corners for security feel */
            color: var(--st-text);
            font-size: 1rem;
            outline: none;
            transition: 0.3s;
            font-family: var(--st-font-mono);
        }

        .clean-input:focus {
            border-color: var(--st-danger);
            background: color-mix(in srgb, var(--st-danger) 10%, transparent);
            
        }

        .btn-clean {
            width: 100%;
            padding: 18px;
            background: var(--st-danger);
            color: var(--st-on-solid);
            border: none;
            font-size: 0.95rem;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 10px;
            border-radius: 0;
            position: relative;
            overflow: hidden;
        }

        .btn-clean:hover {
            background: var(--st-danger);
            
        }

        .warning-box {
            margin-top: 40px;
            padding: 20px;
            border: 1px dashed var(--st-danger);
            color: var(--st-danger);
            font-size: 0.75rem;
            text-align: center;
            background: color-mix(in srgb, var(--st-danger) 5%, transparent);
            font-family: var(--st-font-mono);
        }

        .logout-link {
            position: absolute;
            top: 40px;
            right: 40px;
            color: var(--st-text-faint);
            text-decoration: none;
            font-size: 0.9rem;
            transition: 0.3s;
        }

        .logout-link:hover {
            color: var(--st-text);
        }

        @media (max-width: 1000px) {
            .visual-pane {
                display: none;
            }

            .login-pane {
                width: 100%;
                min-width: auto;
            }
        }
    </style>
    <link rel="stylesheet" href="css/tokens.css">
    <script src="js/theme.js"></script>
</head>

<body>

    <!-- LEFT: SECURITY VISUAL -->
    <div class="visual-pane st-theme-dark">
        <div class="visual-overlay"></div>
        <div class="visual-content">
            <div class="visual-badge"><i class="fas fa-exclamation-triangle"></i> &nbsp; RESTRICTED AREA</div>
            <div class="visual-title">Root Access<br>Control</div>
            <div class="visual-text">
                This interface is monitored. All login attempts are logged, geolocated, and reported to the Technical
                Team.
            </div>
        </div>
    </div>

    <!-- RIGHT: LOGIN FORM -->
    <div class="login-pane">

        <div class="logout-link">
            <a href="login.html" style="color:var(--st-text-faint); text-decoration:none; margin-right:20px; transition:0.3s;"><i
                    class="fas fa-sign-out-alt"></i> Back to Login</a>
            <a href="dashboard.html" style="color:var(--st-danger); text-decoration:none; font-weight:bold; transition:0.3s;"><i
                    class="fas fa-arrow-left"></i> Back to Dashboard</a>
        </div>

        <div class="logo-area">
            <div class="logo-mark"><i class="fas fa-user-shield"></i></div>
            <div class="logo-text">SHADOW TRUST : : ADMIN</div>
        </div>

        <div class="login-header">
            <h1>Identity Check</h1>
            <p>Enter root credentials for elevated privilege escalation.</p>
        </div>

        <form id="adminLoginForm">
            <div class="input-group">
                <label>Email Address</label>
                <input type="email" id="adminEmail" class="clean-input" placeholder="admin@example.com" required>
            </div>

            <div class="input-group">
                <label>Password</label>
                <input type="password" id="adminPassword" class="clean-input" placeholder="••••••••••••••••" required>
            </div>

            <div class="input-group">
                <label>2FA Hardware Token</label>
                <input type="text" id="adminCode" class="clean-input" placeholder="XXX-XXX" maxlength="7"
                    style="letter-spacing: 5px; text-align: center; text-transform: uppercase;" autocomplete="off">
            </div>

            <button type="submit" class="btn-clean">
                <i class="fas fa-fingerprint"></i> &nbsp; Authenticate Root
            </button>
        </form>
    </div>

    <script>
        const _isLocalDev = window.location.hostname === '127.0.0.1' ||
            window.location.hostname === 'localhost' ||
            window.location.hostname === '0.0.0.0' ||
            window.location.protocol === 'file:';
        const API_BASE = _isLocalDev ? 'http://127.0.0.1:8000/api/v1' : '/api/v1';

        function showAdminMsg(msg, type) {
            let el = document.getElementById('adminMsg');
            if (!el) {
                el = document.createElement('div');
                el.id = 'adminMsg';
                el.style.cssText = 'margin-top:20px;padding:14px 18px;border-radius:4px;font-size:0.85rem;font-family:var(--st-font-mono);';
                document.getElementById('adminLoginForm').after(el);
            }
            el.style.border = type === 'error' ? '1px solid var(--st-danger)' : '1px solid var(--st-success)';
            el.style.background = type === 'error' ? 'color-mix(in srgb, var(--st-danger) 8%, transparent)' : 'color-mix(in srgb, var(--st-success) 8%, transparent)';
            el.style.color = type === 'error' ? 'var(--st-danger)' : 'var(--st-success)';
            el.textContent = msg;
        }

        document.getElementById('adminLoginForm').addEventListener('submit', async function (e) {
            e.preventDefault();
            const email = document.getElementById('adminEmail').value.trim();
            const password = document.getElementById('adminPassword').value;
            const systemCode = document.getElementById('adminCode').value.trim();
            const btn = e.target.querySelector('button');
            const originalText = btn.innerHTML;

            if (!email || !password || !systemCode) {
                showAdminMsg('All fields are required.', 'error');
                return;
            }

            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Authenticating...';
            btn.style.opacity = '0.7';

            try {
                const res = await fetch(`${API_BASE}/auth/admin-login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password, system_code: systemCode })
                });

                if (!res.ok) {
                    const err = await res.json();
                    throw new Error(err.detail || 'Authentication failed');
                }

                const data = await res.json();
                localStorage.setItem('access_token', data.access_token);
                localStorage.setItem('authToken', data.access_token);
                localStorage.setItem('isAdmin', 'true');
                localStorage.setItem('userRole', data.user.role);

                showAdminMsg('Access granted. Redirecting...', 'success');
                setTimeout(() => window.location.href = 'admin.html', 800);

            } catch (err) {
                showAdminMsg(err.message, 'error');
                btn.innerHTML = originalText;
                btn.style.opacity = '1';
            }
        });
    </script>
    </div>

</body>


</html>
