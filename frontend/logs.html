<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logs · ShadowTrust</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 28 28'%3E%3Crect width='28' height='28' rx='6' fill='%23533afd'/%3E%3Cpath d='M4.5 14c2.5-4.3 5.7-6.4 9.500-6.400s7 2.100 9.500 6.400c-2.500 4.300-5.700 6.400-9.500 6.400S7 18.300 4.500 14Z' fill='none' stroke='%23fff' stroke-width='1.8' stroke-linejoin='round'/%3E%3Ccircle cx='14' cy='14' r='3.2' fill='%23fff'/%3E%3C/svg%3E">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#ffffff">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .main-content .lg-kpis > .lg-kpi { cursor: pointer; transition: background-color var(--st-dur-1) ease; }
        .main-content .lg-kpis > .lg-kpi:hover { background: var(--st-surface-2); }
        .main-content .lg-kpis > .lg-kpi.sel { background: var(--st-accent-tint); box-shadow: inset 0 -2px 0 var(--st-accent); }
        .main-content .lg-kpis > .lg-kpi.sel .l { color: var(--st-accent); }
        .lg-bar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 16px; }
        .lg-bar select, .lg-bar input { min-height: 36px; padding: 0 12px; background: var(--st-surface); border: 1px solid var(--st-border-strong);
            border-radius: var(--st-radius-md); color: var(--st-text); font: inherit; font-size: 13.5px; }
        .lg-bar select:focus, .lg-bar input:focus { outline: none; border-color: var(--st-accent); box-shadow: var(--st-focus-ring); }
        .lg-bar input.q { flex: 1; min-width: 200px; }
        .lg-src { display: flex; gap: 6px; }
        .lg-src label { display: inline-flex; align-items: center; height: 32px; padding: 0 13px; border: 1px solid var(--st-border-strong); border-radius: var(--st-radius-sm);
            background: var(--st-surface); font-size: 13px; font-weight: 500; color: var(--st-text-muted); cursor: pointer; user-select: none; transition: all var(--st-dur-1) ease; }
        .lg-src label::first-letter { text-transform: uppercase !important; }
        .lg-src label.on { background: var(--st-accent-tint); border-color: var(--st-accent-border); color: var(--st-accent); }
        .lg-wrap { background: var(--st-surface); border: 1px solid var(--st-border); border-radius: var(--st-radius-lg); box-shadow: var(--st-shadow-sm);
            overflow: auto; max-height: calc(100vh - 372px); min-height: 280px; }
        table.lg { border-collapse: collapse; width: 100%; font-size: 13.5px; }
        table.lg th { position: sticky; top: 0; z-index: 1; background: var(--st-surface); color: var(--st-text-muted); text-align: left; padding: 12px 16px;
            white-space: nowrap; font-size: 12.5px; font-weight: 600; border-bottom: 1px solid var(--st-border); }
        table.lg td { padding: 10px 16px; border-bottom: 1px solid var(--st-border); color: var(--st-text-secondary); vertical-align: top; }
        table.lg td:first-child { font-family: var(--st-font-mono); font-size: 12.5px; color: var(--st-text-muted); white-space: nowrap; }
        table.lg tr:hover td { background: var(--st-surface-2); }
        .chip { display: inline-block; padding: 1px 9px; border-radius: var(--st-radius-sm); font-size: 12px; font-weight: 600; }
        .chip::first-letter { text-transform: uppercase !important; }
        .cat-auth { background: var(--st-info-bg); color: var(--st-info); }
        .cat-recon { background: var(--st-warning-bg); color: var(--st-warning); }
        .cat-exec, .cat-c2 { background: var(--st-caution-bg); color: var(--st-caution); }
        .cat-malware { background: var(--st-danger-bg); color: var(--st-danger); }
        .cat-lateral, .cat-exfil, .cat-persistence, .cat-privilege, .cat-defense-evasion { background: var(--st-info-bg); color: var(--st-info); }
        .cat-error { background: var(--st-danger-bg); color: var(--st-danger); }
        .cat-network, .cat-system, .cat-info { background: var(--st-neutral-bg); color: var(--st-text-secondary); }
        .cat-audit { background: var(--st-success-bg); color: var(--st-success); }
        td[class^="sev-"] { font-size: 12px; font-weight: 600; }
        .sev-CRITICAL { color: var(--st-danger); } .sev-HIGH { color: var(--st-caution); } .sev-MEDIUM { color: var(--st-warning); }
        .sev-LOW { color: var(--st-text-muted); } .sev-INFO { color: var(--st-text-faint); }
        .lg-msg { max-width: 780px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-family: var(--st-font-mono); font-size: 12.5px; color: var(--st-text); cursor: pointer; }
        .lg-msg.exp { white-space: pre-wrap; overflow: visible; }
        .lg-src-tag { color: var(--st-text-muted); }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300..600&family=Source+Code+Pro:wght@400;500;600&display=swap">
    <link rel="stylesheet" href="css/tokens.css">
    <script src="js/theme.js"></script>
</head>

<body>
    <div class="app-container">
        <aside class="sidebar" id="sidebar"></aside>

        <main class="main-content">
            <div class="top-bar">
                <div class="page-header">
                    <h2>Logs</h2>
                    <p>Every source in one feed, categorised. &nbsp;<span id="lg-meta" class="lg-src-tag"></span></p>
                </div>
                <div class="filters-bar">
                    <label class="lg-src-tag" style="font-size:.8rem;"><input type="checkbox" id="lg-auto" checked> Auto-refresh</label>
                    <button class="soc-btn soc-btn-primary" id="lg-refresh"><i class="fas fa-rotate"></i> Refresh</button>
                </div>
            </div>

            <div class="lg-kpis" id="lg-kpis"></div>

            <div class="lg-bar">
                <div class="lg-src" id="lg-sources">
                    <label data-src="honeypot" class="on"><input type="checkbox" checked hidden> honeypot</label>
                    <label data-src="splunk" class="on"><input type="checkbox" checked hidden> splunk</label>
                    <label data-src="platform" class="on"><input type="checkbox" checked hidden> platform</label>
                    <label data-src="audit" class="on"><input type="checkbox" checked hidden> audit</label>
                </div>
                <select id="lg-cat">
                    <option value="">All categories</option>
                    <option>auth</option><option>recon</option><option>exec</option><option>c2</option>
                    <option>malware</option><option>lateral</option><option>exfil</option><option>persistence</option>
                    <option>privilege</option><option>defense-evasion</option><option>network</option>
                    <option>system</option><option>audit</option><option>error</option><option>info</option>
                </select>
                <select id="lg-sev">
                    <option value="">Any severity</option>
                    <option>LOW</option><option>MEDIUM</option><option>HIGH</option><option>CRITICAL</option>
                </select>
                <input class="q" id="lg-q" placeholder="Search log text…">
                <button class="soc-btn" id="lg-csv"><i class="fas fa-download"></i> CSV</button>
            </div>

            <div class="lg-wrap">
                <table class="lg">
                    <thead><tr><th>Time</th><th>Source</th><th>Category</th><th>Severity</th><th>Message</th></tr></thead>
                    <tbody id="lg-rows"><tr><td colspan="5" style="padding:16px; color:var(--st-text-muted);">loading…</td></tr></tbody>
                </table>
            </div>
        </main>
    </div>

    <script src="js/sidebar.js"></script>
    <script type="module">
        import { apiService } from './js/api.js';
        const $ = s => document.querySelector(s);
        const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
        let rows = [];

        function activeSources() {
            return [...document.querySelectorAll('#lg-sources label.on')].map(l => l.dataset.src).join(',') || 'honeypot';
        }

        function render() {
            const cat = $('#lg-cat').value, sev = $('#lg-sev').value, q = $('#lg-q').value.toLowerCase();
            let view = rows;
            if (cat) view = view.filter(r => r.category === cat);
            const sevRank = { INFO: 0, LOW: 1, MEDIUM: 2, HIGH: 3, CRITICAL: 4 };
            if (sev) view = view.filter(r => sevRank[r.severity] >= sevRank[sev]);
            if (q) view = view.filter(r => (r.text + ' ' + r.origin).toLowerCase().includes(q));
            $('#lg-rows').innerHTML = view.length ? view.map((r, i) => `
                <tr>
                    <td>${esc((r.ts || '').replace('T', ' ').slice(0, 19))}</td>
                    <td class="lg-src-tag">${esc(r.source)}<br><span style="opacity:.6">${esc(r.origin || '')}</span></td>
                    <td><span class="chip cat-${esc(r.category)}">${esc(r.category)}</span></td>
                    <td class="sev-${esc(r.severity)}">${esc(r.severity)}</td>
                    <td><div class="lg-msg" title="${esc(r.reason)}" data-i="${i}">${esc(r.text)}</div></td>
                </tr>`).join('') : '<tr><td colspan="5" style="padding:16px;color:var(--st-text-muted);">no matching log lines</td></tr>';
            $('#lg-rows').querySelectorAll('.lg-msg').forEach(el => el.onclick = () => el.classList.toggle('exp'));
        }

        function renderKpis(sum) {
            const cats = sum.by_category || {};
            const order = ['malware', 'exec', 'c2', 'auth', 'recon', 'lateral', 'exfil', 'privilege', 'defense-evasion', 'error', 'network', 'audit', 'system', 'info'];
            const shown = order.filter(c => cats[c]).slice(0, 6);
            $('#lg-kpis').innerHTML = shown.map(c => `
                <div class="lg-kpi" data-cat="${c}"><div class="v chip cat-${c}" style="background:none">${cats[c]}</div><div class="l">${c}</div></div>`
            ).join('') || '<div class="lg-kpi"><div class="v">0</div><div class="l">no events</div></div>';
            $('#lg-kpis').querySelectorAll('.lg-kpi').forEach(el => el.onclick = () => {
                $('#lg-cat').value = ($('#lg-cat').value === el.dataset.cat) ? '' : el.dataset.cat;
                document.querySelectorAll('.lg-kpi').forEach(k => k.classList.toggle('sel', k.dataset.cat === $('#lg-cat').value));
                render();
            });
        }

        async function load() {
            const src = activeSources();
            try {
                const [feed, sum] = await Promise.all([
                    apiService.get(`/logs/feed?sources=${src}&limit=500&hours=72`),
                    apiService.get(`/logs/summary?hours=72`),
                ]);
                rows = feed.items || [];
                $('#lg-meta').textContent = `${feed.count} lines · ${feed.sources.join(', ')}${feed.is_admin ? '' : ' · (login as admin for platform + audit)'}`;
                renderKpis(sum);
                render();
            } catch (e) {
                $('#lg-rows').innerHTML = `<tr><td colspan="5" style="padding:16px;color:var(--st-danger);">${esc(e.message)}</td></tr>`;
            }
        }

        document.querySelectorAll('#lg-sources label').forEach(l => l.onclick = () => { l.classList.toggle('on'); load(); });
        ['lg-cat', 'lg-sev'].forEach(id => $('#' + id).onchange = render);
        $('#lg-q').addEventListener('input', render);
        $('#lg-refresh').onclick = load;
        $('#lg-csv').onclick = () => {
            if (!rows.length) return;
            const hdr = 'ts,source,origin,category,severity,reason,text';
            const body = rows.map(r => [r.ts, r.source, r.origin, r.category, r.severity, r.reason, r.text]
                .map(v => { v = String(v ?? ''); return /[",\n]/.test(v) ? `"${v.replace(/"/g, '""')}"` : v; }).join(',')).join('\n');
            const a = document.createElement('a');
            a.href = URL.createObjectURL(new Blob([hdr + '\n' + body], { type: 'text/csv' }));
            a.download = `shadowtrust-logs-${new Date().toISOString().replace(/[:.]/g, '-')}.csv`;
            a.click(); URL.revokeObjectURL(a.href);
        };

        load();
        setInterval(() => { if ($('#lg-auto').checked) load(); }, 8000);
    </script>
</body>

</html>
