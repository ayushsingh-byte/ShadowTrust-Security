<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Investigations · ShadowTrust</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 28 28'%3E%3Crect width='28' height='28' rx='6' fill='%23533afd'/%3E%3Cpath d='M4.5 14c2.5-4.3 5.7-6.4 9.500-6.400s7 2.100 9.500 6.400c-2.500 4.300-5.700 6.400-9.500 6.400S7 18.300 4.500 14Z' fill='none' stroke='%23fff' stroke-width='1.8' stroke-linejoin='round'/%3E%3Ccircle cx='14' cy='14' r='3.2' fill='%23fff'/%3E%3C/svg%3E">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#ffffff">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* =========================================================
           Investigations: the case queue on the left, the case file on the right.
           One spacing scale (4 / 8 / 12 / 16 / 20 / 24), one radius, one button
           height. Sections inside the case file are divided by hairlines rather
           than nested boxes. Colours, type and radii come from css/tokens.css.
           ========================================================= */

        :root {
            /* fills for severity and status marks (the script reads these names) */
            --c-crit: var(--st-danger-solid);
            --c-high: var(--st-caution-solid);
            --c-med: var(--st-warning-solid);
            --c-low: var(--st-sky);
            --c-ok: var(--st-success-solid);
            --c-idle: var(--st-text-faint);
            --acc: var(--st-accent);
            --ctl-h: 34px;
        }

        /* ---------- page header ---------- */
        .hdr-right {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
        }

        .live-pill {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            height: var(--ctl-h);
            padding: 0 12px;
            border: 1px solid var(--st-border);
            border-radius: var(--st-radius-md);
            background: var(--st-surface);
            font-size: 13px;
            color: var(--st-text-secondary);
            font-variant-numeric: tabular-nums;
            white-space: nowrap;
        }

        .live-pill .live-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--st-success-solid);
            box-shadow: 0 0 0 3px color-mix(in srgb, var(--st-success-solid) 20%, transparent);
            animation: none;
        }

        .live-pill.paused .live-dot {
            background: var(--st-text-faint);
            box-shadow: none;
        }

        .icon-btn {
            display: inline-grid;
            place-items: center;
            width: var(--ctl-h);
            height: var(--ctl-h);
            flex: none;
            border: 1px solid var(--st-accent-border);
            border-radius: var(--st-radius-md);
            background: var(--st-surface);
            color: var(--st-brand-text);
            font-size: 13px;
            cursor: pointer;
            transition: background-color var(--st-dur-1) ease, border-color var(--st-dur-1) ease;
        }

        .icon-btn:hover {
            background: var(--st-accent-tint);
        }

        .icon-btn.spin i {
            animation: inc-spin var(--st-dur-3) linear;
        }

        @keyframes inc-spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* ---------- KPI strip: five equal figures, each with its share of the total ---------- */
        .inc-main .kpi-strip {
            grid-template-columns: repeat(5, minmax(0, 1fr));
        }

        .inc-main .kpi-strip > .kpi {
            gap: 4px;
            padding: 16px 20px 18px;
        }

        .inc-main .kpi .kl {
            order: 1;
        }

        .inc-main .kpi .kv {
            order: 2;
        }

        .inc-main .kpi .kbar {
            order: 3;
            height: 3px;
            margin-top: 10px;
            border-radius: 3px;
            background: var(--st-surface-hover);
            overflow: hidden;
        }

        .inc-main .kpi .kbar span {
            display: block;
            width: 0;
            height: 100%;
            border-radius: 3px;
            background: var(--k, var(--st-accent));
            transition: width 0.9s var(--st-ease-out);
        }

        /* ---------- toolbar: search, two selects, status filters ---------- */
        .console-bar {
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto auto;
            gap: 12px 8px;
            margin-bottom: 20px;
        }

        .search-wrap {
            position: relative;
            display: flex;
            align-items: center;
            gap: 8px;
            height: 38px;
            padding: 0 10px 0 38px;
            border: 1px solid var(--st-border-strong);
            border-radius: var(--st-radius-md);
            background: var(--st-surface);
            transition: border-color var(--st-dur-1) ease, box-shadow var(--st-dur-1) ease;
        }

        .search-wrap:focus-within {
            border-color: var(--st-accent);
            box-shadow: var(--st-focus-ring);
        }

        .search-wrap > i {
            position: absolute;
            left: 13px;
            font-size: 13px;
            color: var(--st-text-faint);
        }

        .search-wrap input {
            flex: 1;
            min-width: 0;
            height: 100%;
            border: 0;
            outline: 0;
            background: transparent;
            font: 400 14px var(--st-font-main);
            color: var(--st-text);
        }

        .search-wrap input::placeholder {
            color: var(--st-text-faint);
        }

        .search-wrap kbd {
            display: grid;
            place-items: center;
            min-width: 20px;
            height: 20px;
            padding: 0 5px;
            border: 1px solid var(--st-border);
            border-radius: 4px;
            background: var(--st-surface-2);
            font: 500 11px var(--st-font-main);
            color: var(--st-text-faint);
        }

        .sel-mini,
        .fld input,
        .fld select,
        .pick-bar input,
        .pick-bar select,
        .up-row select,
        .up-row input[type="text"],
        .note-add input,
        .ioc-add input {
            height: 38px;
            padding: 0 12px;
            border: 1px solid var(--st-border-strong);
            border-radius: var(--st-radius-md);
            background: var(--st-surface);
            font: 400 14px var(--st-font-main);
            color: var(--st-text);
            outline: 0;
            transition: border-color var(--st-dur-1) ease, box-shadow var(--st-dur-1) ease;
        }

        .sel-mini:focus,
        .fld input:focus,
        .fld select:focus,
        .pick-bar input:focus,
        .pick-bar select:focus,
        .up-row select:focus,
        .up-row input[type="text"]:focus,
        .note-add input:focus,
        .ioc-add input:focus {
            border-color: var(--st-accent);
            box-shadow: var(--st-focus-ring);
        }

        .sel-mini {
            padding-right: 8px;
            cursor: pointer;
        }

        .pills {
            grid-column: 1 / -1;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .pill {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            height: 32px;
            padding: 0 12px;
            border: 1px solid var(--st-border);
            border-radius: var(--st-radius-md);
            background: var(--st-surface);
            font: 400 13.5px var(--st-font-main);
            color: var(--st-text-secondary);
            cursor: pointer;
            transition: background-color var(--st-dur-1) ease, border-color var(--st-dur-1) ease, color var(--st-dur-1) ease;
        }

        .pill::before {
            content: '';
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--p, var(--st-text-faint));
        }

        .pill .cnt {
            margin-left: 6px;
            font-weight: 400;
            color: var(--st-text-faint);
            font-variant-numeric: tabular-nums;
        }

        .pill:hover {
            border-color: var(--st-border-strong);
            background: var(--st-surface-2);
        }

        .pill.on {
            border-color: var(--st-accent-border);
            background: var(--st-accent-tint);
            color: var(--st-brand-text);
            font-weight: 500;
        }

        .pill.on .cnt {
            color: inherit;
            opacity: 0.75;
        }

        /* ---------- workspace: two panels of one height ---------- */
        .inc-wrap {
            display: grid;
            grid-template-columns: minmax(320px, 392px) minmax(0, 1fr);
            gap: 20px;
            /* app bar 56 + gap 20 above, page padding 48 below: scrolled down, the two panels fill the window */
            height: max(600px, calc(100dvh - 124px));
        }

        .panel {
            display: flex;
            flex-direction: column;
            min-width: 0;
            min-height: 0;
            border: 1px solid var(--st-border);
            border-radius: var(--st-radius-lg);
            background: var(--st-surface);
            overflow: hidden;
        }

        .panel-head {
            flex: none;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            height: 52px;
            padding: 0 20px;
            border-bottom: 1px solid var(--st-border);
        }

        .main-content .panel-head h3 {
            margin: 0;
        }

        .panel-head .sub {
            font-size: 12.5px;
            color: var(--st-text-faint);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            font-variant-numeric: tabular-nums;
        }

        .scroll {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            scrollbar-width: thin;
        }

        /* ---------- queue ---------- */
        .inc-row {
            position: relative;
            padding: 14px 20px 15px;
            border-bottom: 1px solid var(--st-border);
            cursor: pointer;
            transition: background-color var(--st-dur-1) ease;
        }

        .inc-row:hover {
            background: var(--st-surface-2);
        }

        .inc-row.sel {
            background: var(--st-accent-tint);
            box-shadow: inset 2px 0 0 var(--st-accent);
        }

        .inc-row .k {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            font: 400 12px var(--st-font-mono);
            color: var(--st-text-faint);
        }

        .inc-row .t {
            display: -webkit-box;
            -webkit-box-orient: vertical;
            -webkit-line-clamp: 2;
            margin-top: 6px;
            font-size: 14px;
            font-weight: 500;
            line-height: 1.4;
            color: var(--st-text);
            overflow: hidden;
        }

        .row-meta {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 4px 14px;
            margin-top: 8px;
            font-size: 12.5px;
            color: var(--st-text-muted);
        }

        .row-meta .rm-sev {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-weight: 500;
            color: var(--st-text);
        }

        .row-meta .rm-sev::before {
            content: '';
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--c, var(--c-idle));
        }

        .row-meta .mono {
            font-family: var(--st-font-mono);
            font-size: 12px;
        }

        .row-meta i {
            font-size: 11px;
            color: var(--st-text-faint);
        }

        /* ---------- case file: header ---------- */
        .dtl {
            animation: inc-rise var(--st-dur-2) var(--st-ease-out) both;
        }

        .dtl.no-anim,
        .dtl.no-anim * {
            animation: none !important;
        }

        @keyframes inc-rise {
            from {
                opacity: 0;
                transform: translateY(8px);
            }
        }

        .hero {
            padding: 22px 24px 20px;
        }

        .hero-top {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 24px;
        }

        .hero-top > div:first-child {
            min-width: 0;
        }

        .keyline {
            font-size: 12.5px;
            color: var(--st-text-faint);
            font-variant-numeric: tabular-nums;
        }

        .main-content .hero h3 {
            margin: 6px 0 0;
            font-size: 22px;
            font-weight: 300;
            line-height: 1.25;
            letter-spacing: -0.015em !important;
            color: var(--st-text);
            overflow-wrap: anywhere;
        }

        .badges {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 8px 12px;
            margin-top: 12px;
        }

        .mini {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 12.5px;
            color: var(--st-text-muted);
        }

        .mini i {
            font-size: 11px;
            color: var(--st-text-faint);
        }

        /* severity and status marks: the data is upper case, the page shows sentence case */
        .sev,
        .st {
            display: inline-block;
            height: 22px;
            padding: 0 8px;
            border-radius: var(--st-radius-sm);
            background: var(--st-neutral-bg);
            font-size: 12px;
            font-weight: 500;
            line-height: 22px;
            color: var(--st-text-secondary);
            white-space: nowrap;
        }

        .sev-CRITICAL {
            background: var(--st-danger-bg);
            color: var(--st-danger);
        }

        .sev-HIGH {
            background: var(--st-caution-bg);
            color: var(--st-caution);
        }

        .sev-MEDIUM {
            background: var(--st-warning-bg);
            color: var(--st-warning);
        }

        .sev-LOW {
            background: var(--st-info-bg);
            color: var(--st-info);
        }

        .st-NEW,
        .st-CONTAINED {
            background: var(--st-accent-tint);
            color: var(--st-brand-text);
        }

        .st-TRIAGING {
            background: var(--st-warning-bg);
            color: var(--st-warning);
        }

        .st-INVESTIGATING {
            background: var(--st-caution-bg);
            color: var(--st-caution);
        }

        .st-RESOLVED {
            background: var(--st-success-bg);
            color: var(--st-success);
        }

        .gauges {
            display: flex;
            flex: none;
            gap: 16px;
        }

        .gauge {
            position: relative;
            width: 88px;
            height: 88px;
        }

        .gauge svg {
            display: block;
            width: 100%;
            height: 100%;
            transform: rotate(-90deg);
        }

        .gauge circle {
            fill: none;
            stroke-width: 6;
        }

        .gauge .trk {
            stroke: var(--st-surface-hover);
        }

        .gauge .val {
            stroke-linecap: round;
            stroke-dasharray: 213.6;
            transition: stroke-dashoffset 1.1s var(--st-ease-out);
        }

        .gauge .ctr {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .gauge .ctr b {
            font-size: 20px;
            font-weight: 300;
            line-height: 1;
            letter-spacing: -0.02em;
            color: var(--st-text);
            font-variant-numeric: tabular-nums;
        }

        .gauge .ctr small {
            margin-top: 4px;
            font-size: 10.5px;
            color: var(--st-text-faint);
        }

        .main-content .gauge .ctr small::first-letter {
            text-transform: uppercase !important;
        }

        /* ---------- case file: workflow ---------- */
        .wf-row {
            display: flex;
            align-items: flex-start;
            gap: 20px;
            margin-top: 22px;
        }

        .wf {
            position: relative;
            flex: 1;
            display: grid;
            grid-template-columns: repeat(5, minmax(0, 1fr));
        }

        /* the rail runs between the centres of the first and last step: 10% to 90% */
        .wf-track,
        .wf-fill {
            position: absolute;
            left: 10%;
            top: 13px;
            height: 2px;
            border-radius: 2px;
        }

        .wf-track {
            right: 10%;
            background: var(--st-border-strong);
        }

        .wf-fill {
            background: var(--st-accent);
            transition: width var(--st-dur-3) var(--st-ease-out);
        }

        .wf-step {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            padding: 0;
            border: 0;
            background: none;
            font: inherit;
            color: var(--st-text-faint);
            cursor: pointer;
        }

        .wf-dot {
            display: grid;
            place-items: center;
            width: 28px;
            height: 28px;
            border: 1.5px solid var(--st-border-strong);
            border-radius: 50%;
            background: var(--st-surface);
            font-size: 12px;
            font-weight: 500;
            color: var(--st-text-faint);
            transition: border-color var(--st-dur-1) ease, background-color var(--st-dur-1) ease, box-shadow var(--st-dur-1) ease;
        }

        .wf-lbl {
            font-size: 12.5px;
        }

        .wf-step:hover .wf-dot {
            border-color: var(--st-accent);
        }

        .wf-step.done .wf-dot {
            border-color: var(--st-accent);
            color: var(--st-accent);
        }

        .wf-step.done .wf-lbl {
            color: var(--st-text-muted);
        }

        .wf-step.cur .wf-dot {
            border-color: var(--st-brand);
            background: var(--st-brand);
            color: var(--st-on-brand);
            box-shadow: 0 0 0 4px var(--st-accent-tint);
        }

        .wf-step.cur .wf-lbl {
            font-weight: 500;
            color: var(--st-text);
        }

        /* ---------- buttons inside the case file: one look, one height ---------- */
        .sbtn,
        .wf-fp,
        .sec-act {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            height: var(--ctl-h);
            padding: 0 12px;
            border: 1px solid var(--st-accent-border);
            border-radius: var(--st-radius-md);
            background: var(--st-surface);
            font: 450 14px var(--st-font-main);
            color: var(--st-brand-text);
            white-space: nowrap;
            cursor: pointer;
            transition: background-color var(--st-dur-1) ease, border-color var(--st-dur-1) ease;
        }

        .sbtn:hover,
        .wf-fp:hover,
        .sec-act:hover {
            background: var(--st-accent-tint);
        }

        .sbtn i,
        .wf-fp i,
        .sec-act i {
            font-size: 12.5px;
        }

        .wf-fp {
            flex: none;
            border-color: var(--st-border-strong);
            color: var(--st-text-muted);
        }

        .wf-fp.cur {
            border-color: var(--st-text-faint);
            background: var(--st-neutral-bg);
            color: var(--st-text);
        }

        .sec-act {
            height: 28px;
            margin-left: auto;
            padding: 0 10px;
            font-size: 13px;
        }

        .hero-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 22px;
        }

        .hero-actions .sel-mini,
        .ioc-add .sel-mini,
        .ioc-add input {
            height: var(--ctl-h);
        }

        /* the export button sits in the same row and takes the same size */
        .hero-actions .soc-btn {
            min-height: var(--ctl-h);
            padding: 0 12px;
        }

        /* ---------- case file: tabs ---------- */
        .tabs {
            position: sticky;
            top: 0;
            z-index: 2;
            display: flex;
            gap: 24px;
            padding: 0 24px;
            border-top: 1px solid var(--st-border);
            border-bottom: 1px solid var(--st-border);
            background: var(--st-surface);
            overflow-x: auto;
            scrollbar-width: none;
        }

        .tab {
            position: relative;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            flex: none;
            height: 46px;
            padding: 0;
            border: 0;
            background: none;
            font: 400 14px var(--st-font-main);
            color: var(--st-text-muted);
            cursor: pointer;
        }

        .tab b {
            display: inline-grid;
            place-items: center;
            min-width: 20px;
            height: 18px;
            padding: 0 5px;
            border-radius: var(--st-radius-sm);
            background: var(--st-neutral-bg);
            font-size: 11.5px;
            font-weight: 500;
            color: var(--st-text-muted);
            font-variant-numeric: tabular-nums;
        }

        .tab:hover {
            color: var(--st-text);
        }

        .tab.on {
            font-weight: 500;
            color: var(--st-brand-text);
        }

        .tab.on::after {
            content: '';
            position: absolute;
            left: 0;
            right: 0;
            bottom: -1px;
            height: 2px;
            background: var(--st-accent);
        }

        .tab.on b {
            background: var(--st-accent-tint);
            color: var(--st-brand-text);
        }

        /* ---------- case file: sections ---------- */
        .tab-body {
            padding: 0 24px 28px;
        }

        .sec {
            padding: 22px 0;
            border-bottom: 1px solid var(--st-border);
            animation: inc-rise var(--st-dur-3) var(--st-ease-out) both;
            animation-delay: calc(var(--i, 0) * 45ms);
        }

        .sec:last-child {
            padding-bottom: 0;
            border-bottom: 0;
        }

        .main-content .sec > h4 {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 0 0 14px;
            font-size: 15px;
            font-weight: 500;
            letter-spacing: -0.01em !important;
            color: var(--st-text);
        }

        /* quiet supporting text */
        .rb {
            font-size: 13px;
            line-height: 1.5;
            color: var(--st-text-muted);
            overflow-wrap: anywhere;
        }

        /* why this case exists: reasons, then the score that follows from them */
        .why ul {
            display: grid;
            gap: 10px;
            margin: 0;
            padding: 0;
            list-style: none;
        }

        .why li {
            position: relative;
            padding-left: 18px;
            font-size: 13.5px;
            line-height: 1.5;
            color: var(--st-text-secondary);
            overflow-wrap: anywhere;
        }

        .why li::before {
            content: '';
            position: absolute;
            left: 2px;
            top: 8px;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--st-accent);
        }

        .rbk {
            display: grid;
            gap: 10px;
            margin-top: 18px;
            padding-top: 18px;
            border-top: 1px dashed var(--st-border-strong);
        }

        .rbk-row {
            display: grid;
            grid-template-columns: 190px minmax(0, 1fr) 44px;
            align-items: center;
            gap: 14px;
            font-size: 13px;
            color: var(--st-text-muted);
        }

        .main-content .rbk-row > span:first-child::first-letter,
        .main-content .attr-box > span:first-child::first-letter {
            text-transform: uppercase !important;
        }

        .rbk-bar {
            display: block;
            height: 6px;
            border-radius: 3px;
            background: var(--st-surface-hover);
            overflow: hidden;
        }

        .rbk-bar span {
            display: block;
            width: 0;
            height: 100%;
            border-radius: 3px;
            background: var(--st-grad-brand);
            transition: width 0.9s var(--st-ease-out);
        }

        .rbk-row b {
            text-align: right;
            font-weight: 500;
            color: var(--st-text);
            font-variant-numeric: tabular-nums;
        }

        .facts {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 16px;
        }

        .fact {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            height: 28px;
            padding: 0 10px;
            border: 1px solid var(--st-border);
            border-radius: var(--st-radius-md);
            font-size: 12.5px;
        }

        .fact em {
            font-style: normal;
            color: var(--st-text-muted);
        }

        .fact b {
            font-weight: 500;
            color: var(--st-text);
            font-variant-numeric: tabular-nums;
        }

        /* kill chain: one cell per tactic, all the same size */
        .kc {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(112px, 1fr));
            gap: 8px;
        }

        .kc-seg {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 36px;
            padding: 0 8px;
            border: 1px solid var(--st-border);
            border-radius: var(--st-radius-md);
            font-size: 12.5px;
            color: var(--st-text-faint);
            text-align: center;
        }

        .kc-seg span {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .main-content .kc-seg span::first-letter {
            text-transform: uppercase !important;
        }

        .kc-seg.hit {
            border-color: var(--st-accent-border);
            background: var(--st-accent-tint);
            font-weight: 500;
            color: var(--st-brand-text);
        }

        .chip {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            height: 26px;
            margin: 0 6px 6px 0;
            padding: 0 9px;
            border: 1px solid var(--st-border);
            border-radius: var(--st-radius-sm);
            background: var(--st-surface);
            font-size: 12.5px;
            color: var(--st-text-secondary);
            text-decoration: none !important;
            vertical-align: top;
        }

        .chip i {
            font-size: 11px;
            color: var(--st-text-faint);
        }

        a.chip:hover {
            border-color: var(--st-accent-border);
            color: var(--st-brand-text);
        }

        .chip.ioc {
            font-family: var(--st-font-mono);
            font-size: 12px;
            max-width: 100%;
            overflow: hidden;
        }

        .ioc-del {
            margin-left: 2px;
            padding: 0;
            border: 0;
            background: none;
            font-size: 15px;
            line-height: 1;
            color: var(--st-text-faint);
            cursor: pointer;
        }

        .ioc-del:hover {
            color: var(--st-danger);
        }

        /* attribution: label on the left, values on the right, a hairline between rows */
        .attr-box {
            position: relative;
            min-height: 50px;
            padding: 12px 0 6px 196px;
            border-top: 1px solid var(--st-border);
        }

        .attr-box:first-child {
            border-top: 0;
            padding-top: 0;
            min-height: 38px;
        }

        .attr-box > span:first-child {
            position: absolute;
            left: 0;
            top: 16px;
            width: 180px;
            font-size: 13px;
            color: var(--st-text-muted);
        }

        .attr-box:first-child > span:first-child {
            top: 4px;
        }

        .ioc-add {
            display: flex;
            gap: 8px;
            max-width: 560px;
        }

        .ioc-add input {
            flex: 1;
            min-width: 0;
        }

        .ioc-list {
            margin-top: 14px;
        }

        /* tables */
        table.det {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }

        .det th {
            padding: 0 12px 9px 0;
            border-bottom: 1px solid var(--st-border);
            text-align: left;
            font-size: 12.5px;
            font-weight: 500;
            color: var(--st-text-subdued);
            white-space: nowrap;
        }

        .main-content .det th::first-letter {
            text-transform: uppercase !important;
        }

        .det td {
            padding: 10px 12px 10px 0;
            border-bottom: 1px solid var(--st-border);
            vertical-align: top;
            color: var(--st-text-secondary);
            overflow-wrap: anywhere;
        }

        .det tr:last-child td {
            border-bottom: 0;
        }

        .det td.mono {
            font-family: var(--st-font-mono);
            font-size: 12px;
            color: var(--st-text);
        }

        /* timeline */
        .tl {
            position: relative;
            padding-left: 24px;
        }

        .tl::before {
            content: '';
            position: absolute;
            left: 5px;
            top: 6px;
            bottom: 6px;
            width: 1px;
            background: var(--st-border-strong);
        }

        .tl-item {
            position: relative;
            padding-bottom: 18px;
        }

        .tl-item:last-child {
            padding-bottom: 0;
        }

        .tl-item::before {
            content: '';
            position: absolute;
            left: -24px;
            top: 4px;
            width: 11px;
            height: 11px;
            border: 2px solid var(--sv, var(--st-accent));
            border-radius: 50%;
            background: var(--st-surface);
        }

        .tl-item.crit::before {
            background: var(--sv, var(--c-crit));
        }

        .tl-t {
            font-size: 12px;
            color: var(--st-text-faint);
            font-variant-numeric: tabular-nums;
        }

        .tl-h {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 6px 10px;
            margin-top: 4px;
        }

        .tl-h > span:first-child {
            font-size: 14px;
            font-weight: 500;
            color: var(--st-text);
        }

        .tl-h .mini {
            font-family: var(--st-font-mono);
            font-size: 12px;
        }

        .tl-h .chip {
            margin: 0;
        }

        .tl-r {
            margin-top: 4px;
            font-size: 13px;
            line-height: 1.5;
            color: var(--st-text-muted);
            overflow-wrap: anywhere;
        }

        /* detections */
        .dcard {
            margin-bottom: 12px;
            padding: 16px 18px;
            border: 1px solid var(--st-border);
            border-radius: var(--st-radius-lg);
            box-shadow: inset 3px 0 0 var(--sv, var(--c-idle));
        }

        .dcard:last-child {
            margin-bottom: 0;
        }

        .dh {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 16px;
        }

        .dn {
            font-size: 15px;
            font-weight: 500;
            color: var(--st-text);
        }

        .dh > div:last-child {
            display: flex;
            align-items: center;
            flex: none;
            gap: 10px;
        }

        /* evidence, notes, activity */
        .up {
            display: grid;
            gap: 10px;
            max-width: 720px;
        }

        .up-row {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .up-row input[type="text"] {
            flex: 1;
            min-width: 0;
        }

        .up-row input[type="file"] {
            font: 400 13px var(--st-font-main);
            color: var(--st-text-muted);
        }

        .note {
            padding: 12px 0;
            border-bottom: 1px solid var(--st-border);
            font-size: 13.5px;
            line-height: 1.5;
            color: var(--st-text-secondary);
            overflow-wrap: anywhere;
        }

        .note:first-child {
            padding-top: 0;
        }

        .nmeta {
            margin-bottom: 4px;
            font-size: 12px;
            color: var(--st-text-faint);
        }

        .note-add {
            display: flex;
            gap: 10px;
            margin-top: 16px;
        }

        .note-add input {
            flex: 1;
            min-width: 0;
            height: 36px;
        }

        .act-row {
            display: grid;
            grid-template-columns: 150px minmax(0, 1fr);
            gap: 16px;
            padding: 10px 0;
            border-bottom: 1px solid var(--st-border);
            font-size: 13px;
            line-height: 1.5;
            color: var(--st-text-secondary);
            overflow-wrap: anywhere;
        }

        .act-row:first-child {
            padding-top: 0;
        }

        .act-row:last-child {
            border-bottom: 0;
        }

        .act-row > span:first-child {
            font: 400 12px var(--st-font-mono);
            line-height: 1.6;
            color: var(--st-text-faint);
        }

        .act-row b {
            font-weight: 500;
            color: var(--st-text);
        }

        /* ---------- empty and loading states ---------- */
        .empty {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 8px;
            min-height: 220px;
            padding: 32px 20px;
            text-align: center;
            font-size: 14px;
            color: var(--st-text-muted);
        }

        .empty > i {
            margin-bottom: 4px;
            font-size: 22px;
            color: var(--st-v200);
        }

        .empty-hint {
            font-size: 12.5px;
            color: var(--st-text-faint);
        }

        .sk {
            display: grid;
            gap: 9px;
            padding: 16px 20px;
            border-bottom: 1px solid var(--st-border);
        }

        .sk i {
            display: block;
            height: 10px;
            border-radius: 4px;
            background: linear-gradient(90deg, var(--st-accent-tint) 25%, color-mix(in srgb, var(--st-accent) 20%, var(--st-surface)) 37%, var(--st-accent-tint) 63%) 0 0 / 400% 100%;
            animation: st-shimmer 1.4s ease-in-out infinite;
        }

        .sk i:nth-child(1) {
            width: 38%;
        }

        .sk i:nth-child(2) {
            width: 82%;
        }

        .sk i:nth-child(3) {
            width: 56%;
        }

        /* ---------- dialogs: new case, link events, techniques ---------- */
        .backdrop {
            position: fixed;
            inset: 0;
            z-index: 300;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background: var(--st-overlay);
        }

        .backdrop.open {
            display: flex;
        }

        .modal {
            display: flex;
            flex-direction: column;
            width: min(640px, 100%);
            max-height: min(780px, calc(100dvh - 48px));
            border: 1px solid var(--st-border);
            border-radius: var(--st-radius-xl);
            background: var(--st-surface);
            box-shadow: var(--st-shadow-xl);
            overflow: hidden;
            animation: inc-rise var(--st-dur-2) var(--st-ease-out);
        }

        .modal.wide {
            width: min(940px, 100%);
        }

        .modal > header {
            flex: none;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            padding: 16px 20px;
            border-bottom: 1px solid var(--st-border);
        }

        .modal > header h3 {
            margin: 0;
            font-size: 17px;
            font-weight: 500;
            letter-spacing: -0.01em;
        }

        .modal .body {
            flex: 1;
            min-height: 0;
            padding: 20px;
            overflow-y: auto;
        }

        .modal > footer {
            flex: none;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 8px;
            padding: 14px 20px;
            border-top: 1px solid var(--st-border);
            background: var(--st-surface-2);
        }

        .steps {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            padding: 12px 20px 0;
        }

        .step {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            height: 34px;
            padding: 0 12px 0 8px;
            border: 0;
            border-radius: var(--st-radius-md);
            background: none;
            font: 400 13.5px var(--st-font-main);
            color: var(--st-text-muted);
            cursor: pointer;
        }

        .step b {
            display: grid;
            place-items: center;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: var(--st-neutral-bg);
            font-size: 11.5px;
            font-weight: 500;
        }

        .step.on {
            background: var(--st-accent-tint);
            font-weight: 500;
            color: var(--st-brand-text);
        }

        .step.on b {
            background: var(--st-brand);
            color: var(--st-on-brand);
        }

        .step.done b {
            background: var(--st-success-bg);
            color: var(--st-success);
        }

        .fld {
            display: grid;
            gap: 6px;
            margin-bottom: 16px;
        }

        .fld label {
            font-size: 13px;
            font-weight: 500;
            color: var(--st-text-secondary);
        }

        .pick-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 12px;
        }

        .pick-bar input,
        .pick-bar select {
            flex: 1 1 140px;
            min-width: 0;
            height: 36px;
        }

        .pick-bar .sbtn {
            height: 36px;
        }

        .pick {
            max-height: 340px;
            border: 1px solid var(--st-border);
            border-radius: var(--st-radius-md);
            overflow-y: auto;
        }

        .pick-row {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            padding: 10px 14px;
            border-bottom: 1px solid var(--st-border);
            cursor: pointer;
        }

        .pick-row:last-child {
            border-bottom: 0;
        }

        .pick-row:hover {
            background: var(--st-surface-2);
        }

        .pick-row.on {
            background: var(--st-accent-tint);
        }

        .pick-row input {
            flex: none;
            margin-top: 3px;
            accent-color: var(--st-brand);
        }

        .pick-row > span {
            min-width: 0;
        }

        .pr-h {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 4px 10px;
            font-size: 13px;
            color: var(--st-text);
        }

        .pr-s {
            display: block;
            margin-top: 3px;
            font-size: 12.5px;
            color: var(--st-text-muted);
            overflow-wrap: anywhere;
        }

        .pick-foot {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 8px 12px;
            margin-top: 10px;
            font-size: 12.5px;
            color: var(--st-text-muted);
        }

        .pick-foot .sbtn {
            height: 30px;
            padding: 0 10px;
            font-size: 13px;
        }

        .pick-empty {
            padding: 28px;
            text-align: center;
            font-size: 13.5px;
            color: var(--st-text-muted);
        }

        .tactic-head {
            position: sticky;
            top: 0;
            padding: 8px 14px;
            border-bottom: 1px solid var(--st-border);
            background: var(--st-surface-2);
            font-size: 12.5px;
            font-weight: 500;
            color: var(--st-text-secondary);
        }

        /* ---------- page toasts (bottom centre, clear of the incident toast on the right) ---------- */
        .toasts {
            position: fixed;
            left: 50%;
            bottom: 24px;
            z-index: 400;
            display: grid;
            justify-items: center;
            gap: 8px;
            transform: translateX(-50%);
            pointer-events: none;
        }

        .toast {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 11px 16px;
            border: 1px solid var(--st-border);
            border-radius: var(--st-radius-lg);
            background: var(--st-surface);
            box-shadow: var(--st-shadow-lg), inset 3px 0 0 var(--tc, var(--st-accent));
            font-size: 13.5px;
            color: var(--st-text);
            animation: inc-rise var(--st-dur-2) var(--st-ease-out);
            transition: opacity var(--st-dur-2) ease, transform var(--st-dur-2) ease;
        }

        .toast i {
            color: var(--tc, var(--st-accent));
        }

        .toast.out {
            opacity: 0;
            transform: translateY(6px);
        }

        /* ---------- smaller screens ---------- */
        @media (max-width: 1100px) {
            .inc-wrap {
                grid-template-columns: minmax(0, 1fr);
                height: auto;
            }

            .inc-wrap > .panel:first-child .scroll {
                max-height: 420px;
            }

            .inc-wrap > .panel:last-child .scroll {
                overflow: visible;
            }

            .tabs {
                position: static;
            }
        }

        @media (max-width: 760px) {
            .inc-main .kpi-strip {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }

            /* five figures in two columns: the last one takes the full row */
            .inc-main .kpi-strip > .kpi:last-child {
                grid-column: 1 / -1;
            }

            .console-bar {
                grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
            }

            .search-wrap {
                grid-column: 1 / -1;
            }

            .hero,
            .tab-body {
                padding-left: 16px;
                padding-right: 16px;
            }

            .tabs {
                gap: 18px;
                padding: 0 16px;
            }

            .hero-top {
                flex-direction: column;
                gap: 16px;
            }

            .wf-row {
                flex-direction: column;
                align-items: stretch;
            }

            .wf-lbl {
                font-size: 10.5px;
            }

            .rbk-row {
                grid-template-columns: minmax(0, 1fr) 44px;
            }

            .rbk-row .rbk-bar {
                grid-column: 1 / -1;
                order: 3;
            }

            .attr-box,
            .attr-box:first-child {
                padding-left: 0;
            }

            .attr-box > span:first-child,
            .attr-box:first-child > span:first-child {
                position: static;
                display: block;
                width: auto;
                margin-bottom: 8px;
            }

            .act-row {
                grid-template-columns: minmax(0, 1fr);
                gap: 2px;
            }

            .up-row,
            .note-add {
                flex-wrap: wrap;
            }

            table.det {
                display: block;
                overflow-x: auto;
            }
        }

        @media (prefers-reduced-motion: reduce) {

            .dtl,
            .sec,
            .modal,
            .toast,
            .sk i,
            .icon-btn.spin i {
                animation: none !important;
            }

            .kbar span,
            .rbk-bar span,
            .gauge .val,
            .wf-fill {
                transition: none !important;
            }
        }

        /* ---------- attack replay (timeline tab) ----------
           Steps through the case's own timeline in order. It stays in view under the tabs
           while the list scrolls beneath it. */
        .rp {
            position: sticky;
            top: 47px;
            z-index: 1;
            margin: 0 0 20px;
            padding: 16px;
            border: 1px solid var(--st-border);
            border-radius: var(--st-radius-lg);
            background: var(--st-surface-2);
        }

        .rp-bar {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .rp-bar .sbtn {
            height: 32px;
        }

        .rp-play {
            min-width: 96px;
            justify-content: center;
        }

        .rp-now {
            margin-left: 8px;
            font-size: 13px;
            color: var(--st-text-muted);
        }

        .rp-now b {
            font-weight: 500;
            color: var(--st-text);
            font-variant-numeric: tabular-nums;
        }

        .rp-now span {
            margin-left: 12px;
            font-family: var(--st-font-mono);
            font-size: 12px;
        }

        .rp-bar .rp-all {
            margin-left: auto;
        }

        .rp-track {
            position: relative;
            height: 36px;
            margin-top: 12px;
            cursor: pointer;
            touch-action: none;
            outline: none;
        }

        .rp-track::before {
            content: '';
            position: absolute;
            left: 0;
            right: 0;
            top: 17px;
            height: 2px;
            border-radius: 2px;
            background: var(--st-border-strong);
        }

        .rp-fill {
            position: absolute;
            left: 0;
            top: 17px;
            width: 100%;
            height: 2px;
            border-radius: 2px;
            background: var(--st-accent);
        }

        /* one mark per timeline entry, coloured by severity; a rule firing stands taller */
        .rp-tick {
            position: absolute;
            top: 12px;
            width: 2px;
            height: 12px;
            margin-left: -1px;
            border-radius: 1px;
            background: var(--sv, var(--st-text-faint));
            opacity: 0.3;
        }

        .rp-tick.past {
            opacity: 1;
        }

        .rp-tick.det {
            top: 6px;
            width: 4px;
            height: 24px;
            margin-left: -2px;
            border-radius: 2px;
        }

        .rp-head {
            position: absolute;
            top: 8px;
            left: 100%;
            width: 12px;
            height: 20px;
            margin-left: -6px;
            border: 2px solid var(--st-accent);
            border-radius: 4px;
            background: var(--st-surface);
            box-shadow: var(--st-shadow-sm);
        }

        .rp-track:focus-visible .rp-head {
            outline: 2px solid var(--st-accent);
            outline-offset: 2px;
        }

        .rp-ends {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            margin-top: 4px;
            font-family: var(--st-font-mono);
            font-size: 12px;
            color: var(--st-text-faint);
        }

        .rp-ends .rp-note {
            font-family: var(--st-font-main);
        }

        .rp-tech {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 12px;
        }

        .rp-chip {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 4px 8px;
            border: 1px solid var(--st-border);
            border-radius: var(--st-radius-md);
            background: var(--st-surface);
            font-size: 12px;
            color: var(--st-text-faint);
            transition: color var(--st-dur-2) ease, border-color var(--st-dur-2) ease, background-color var(--st-dur-2) ease;
        }

        .rp-chip b {
            font-family: var(--st-font-mono);
            font-weight: 500;
        }

        .rp-chip.lit {
            border-color: var(--st-accent-border);
            background: var(--st-accent-tint);
            color: var(--st-brand-text);
        }

        .tl.rp-on .tl-item {
            transition: opacity var(--st-dur-2) ease;
        }

        .tl.rp-on .tl-item.rp-future {
            opacity: 0.16;
        }

        .tl.rp-on .tl-item.rp-now .tl-h > span:first-child {
            color: var(--st-brand-text);
        }

        /* a case row grows into its case file (select(), where the browser supports it) */
        ::view-transition-group(st-case) {
            animation-duration: var(--st-dur-3);
            animation-timing-function: var(--st-ease-out);
        }

        ::view-transition-old(st-case),
        ::view-transition-new(st-case) {
            height: 100%;
            object-fit: cover;
            object-position: 0 0;
        }

        ::view-transition-old(st-case) {
            animation-duration: var(--st-dur-1);
        }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300..600&family=Source+Code+Pro:wght@400;500;600&display=swap">
    <link rel="stylesheet" href="css/tokens.css">

</head>

<body>
    <div class="app-container">
        <aside class="sidebar" id="sidebar"></aside>

        <main class="main-content inc-main">
            <div class="top-bar">
                <div class="page-header">
                    <h2>Investigations</h2>

                </div>
                <div class="hdr-right">
                    <span class="live-pill" id="live-pill">
                        <span class="live-dot"></span>
                        <span id="live-txt">Syncing…</span>

                    <button class="icon-btn" id="inc-auto" title="Toggle auto-refresh (12s)"><i class="fas fa-pause"></i></button>
                    <button class="icon-btn" id="inc-refresh" title="Refresh now (r)"><i class="fas fa-rotate"></i></button>

                </div>
            </div>

            <div class="kpi-strip" id="inc-kpi"></div>

            <div class="console-bar">
                <div class="search-wrap">
                    <i class="fas fa-magnifying-glass"></i>
                    <input id="inc-q" placeholder="Filter by key, title, IP or technique" autocomplete="off">
                    <kbd>/</kbd>
                </div>
                <select class="sel-mini" id="inc-sev">
                    <option value="">All severities</option>
                    <option value="CRITICAL">Critical</option>
                    <option value="HIGH">High</option>
                    <option value="MEDIUM">Medium</option>
                    <option value="LOW">Low</option>
                </select>
                <select class="sel-mini" id="inc-sort">
                    <option value="recent">Sort: most recent</option>
                    <option value="risk">Sort: risk score</option>
                    <option value="severity">Sort: severity</option>
                    <option value="confidence">Sort: confidence</option>
                </select>
                <div class="pills" id="inc-filters"></div>
            </div>

            <div class="inc-wrap">
                <section class="panel">
                    <div class="panel-head">
                        <h3>Case queue</h3>
                        <span class="sub" id="inc-count">loading</span>
                    </div>
                    <div class="scroll" id="inc-list-scroll">
                        <div id="inc-list">
                            <div class="sk"><i></i><i></i><i></i></div>
                            <div class="sk"><i></i><i></i><i></i></div>
                            <div class="sk"><i></i><i></i><i></i></div>
                            <div class="sk"><i></i><i></i><i></i></div>
                        </div>
                    </div>
                </section>

                <section class="panel">
                    <div class="panel-head">

                            <div>Select a case from the queue</div>

                        </div>
                    </div>
                </section>
            </div>
        </main>
    </div>

    <!-- generic modal shell: case wizard, event picker, ATT&CK picker -->
    <div class="backdrop" id="modal">
        <div class="modal" id="modal-panel">
            <header>
                <h3 id="modal-title"></h3>
                <button class="icon-btn" data-close><i class="fas fa-xmark"></i></button>
            </header>
            <div id="modal-steps"></div>
            <div class="body" id="modal-body"></div>
            <footer id="modal-footer"></footer>
        </div>
    </div>

    <div class="toasts" id="toasts"></div>

    <script src="js/report-download.js"></script>
    <script src="js/sidebar.js"></script>
    <script type="module">
        import { apiService } from './js/api.js';

        /* ================= helpers ================= */
        const $ = s => document.querySelector(s);
        const $$ = s => Array.from(document.querySelectorAll(s));
        // Older backend titles used an em dash as separator; show it as a middle dot.
        const esc = s => String(s ?? '').replace(/\s+\u2014\s+/g, ' · ').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
        const fmt = t => t ? String(t).replace('T', ' ').slice(0, 19) : 'n/a';
        const num = (v, d = 0) => Number(v ?? 0).toFixed(d);
        /* severity and status arrive in capitals: 'FALSE_POSITIVE' reads as 'False positive' */
        const cap = s => { const t = String(s ?? '').replace(/_/g, ' ').toLowerCase(); return t.charAt(0).toUpperCase() + t.slice(1); };

        function rel(t) {
            if (!t) return 'n/a';
            const ms = Date.now() - new Date(/Z|[+-]\d\d:\d\d$/.test(t) ? t : t + 'Z').getTime();
            if (!isFinite(ms)) return fmt(t);
            const s = Math.max(0, Math.floor(ms / 1000));
            if (s < 60) return s + 's ago';
            if (s < 3600) return Math.floor(s / 60) + 'm ago';
            if (s < 86400) return Math.floor(s / 3600) + 'h ago';
            return Math.floor(s / 86400) + 'd ago';
        }

        const SEV_RANK = { CRITICAL: 4, HIGH: 3, MEDIUM: 2, LOW: 1 };
        const SEV_COLOR = { CRITICAL: 'var(--c-crit)', HIGH: 'var(--c-high)', MEDIUM: 'var(--c-med)', LOW: 'var(--c-low)' };
        const STATUSES = ['NEW', 'TRIAGING', 'INVESTIGATING', 'CONTAINED', 'RESOLVED'];
        const ALL_STATUSES = [...STATUSES, 'FALSE_POSITIVE'];
        const KILLCHAIN = ['reconnaissance', 'initial-access', 'execution', 'persistence', 'privilege-escalation',
            'defense-evasion', 'credential-access', 'discovery', 'lateral-movement', 'collection',
            'command-and-control', 'exfiltration', 'impact'];
        /* short forms so narrow columns break on a space instead of mid-word */
        const KC_LABEL = {
            'reconnaissance': 'recon', 'initial-access': 'initial access', 'execution': 'execution',
            'persistence': 'persistence', 'privilege-escalation': 'priv esc', 'defense-evasion': 'defense evasion',
            'credential-access': 'cred access', 'discovery': 'discovery', 'lateral-movement': 'lateral move',
            'collection': 'collection', 'command-and-control': 'c2', 'exfiltration': 'exfil', 'impact': 'impact',
        };

        function toast(msg, kind = 'ok') {
            const colors = { ok: 'var(--c-ok)', err: 'var(--c-crit)', info: 'var(--acc)', warn: 'var(--c-med)' };
            const el = document.createElement('div');
            el.className = 'toast';
            el.style.setProperty('--tc', colors[kind] || colors.info);
            el.innerHTML = `<i class="fas ${kind === 'err' ? 'fa-triangle-exclamation' : kind === 'warn' ? 'fa-circle-exclamation' : 'fa-circle-check'}"></i> ${esc(msg)}`;
            $('#toasts').appendChild(el);
            setTimeout(() => { el.classList.add('out'); setTimeout(() => el.remove(), 320); }, 3600);
        }

        function countUp(el, to, dur = 800) {
            const from = Number(el.dataset.v || 0);
            if (from === to) { el.textContent = to; return; }
            const t0 = performance.now();
            (function step(t) {
                const p = Math.min(1, (t - t0) / dur);
                const e = 1 - Math.pow(1 - p, 3);
                el.textContent = Math.round(from + (to - from) * e);
                if (p < 1) requestAnimationFrame(step);
                else el.dataset.v = to;
            })(t0);
        }

        /* ================= state ================= */
        const S = {
            statusFilter: '', severityFilter: '', q: '', sort: 'recent',
            selected: null, incidents: [], view: [], stats: null,
            detail: null, timeline: [], tab: 'overview', splunk: false,
            me: null, listSig: '', auto: true, busy: false
        };

        /* ================= KPI strip ================= */
        function renderKpis(st) {
            const wrap = $('#inc-kpi');
            const total = st.total || 0;
            const cards = [
                { k: 'var(--acc)', v: st.open || 0, l: 'Open cases', icon: 'fa-folder-open', of: total },
                { k: 'var(--c-crit)', v: st.by_severity?.CRITICAL || 0, l: 'Critical', icon: 'fa-radiation', of: total },
                { k: 'var(--c-high)', v: st.by_severity?.HIGH || 0, l: 'High', icon: 'fa-fire', of: total },
                { k: 'var(--c-ok)', v: st.by_status?.RESOLVED || 0, l: 'Resolved', icon: 'fa-circle-check', of: total },
                { k: 'var(--c-idle)', v: total, l: 'Total tracked', icon: 'fa-database', of: total },
            ];
            if (!wrap.children.length) {
                wrap.innerHTML = cards.map((c, i) => `
                    <div class="kpi" style="--k:${c.k};--i:${i}">
                        <i class="fas ${c.icon} kicon"></i>
                        <div class="kv" data-kv>0</div>
                        <div class="kl">${c.l}</div>
                        <div class="kbar"><span></span></div>
                    </div>`).join('');
            }
            Array.from(wrap.children).forEach((el, i) => {
                countUp(el.querySelector('[data-kv]'), cards[i].v);
                const pct = cards[i].of ? Math.min(100, (cards[i].v / cards[i].of) * 100) : 0;
                el.querySelector('.kbar span').style.width = pct + '%';
            });
        }

        function renderFilterPills() {
            const st = S.stats?.by_status || {};
            const open = S.stats?.open ?? '';
            const defs = [
                { v: '', label: 'All', p: 'var(--acc)', n: S.stats?.total },
                { v: 'NEW', label: 'New', p: 'var(--c-low)', n: st.NEW },
                { v: 'TRIAGING', label: 'Triaging', p: 'var(--c-med)', n: st.TRIAGING },
                { v: 'INVESTIGATING', label: 'Investigating', p: 'var(--c-high)', n: st.INVESTIGATING },
                { v: 'CONTAINED', label: 'Contained', p: 'var(--acc)', n: st.CONTAINED },
                { v: 'RESOLVED', label: 'Resolved', p: 'var(--c-ok)', n: st.RESOLVED },
                { v: 'FALSE_POSITIVE', label: 'False positive', p: 'var(--c-idle)', n: st.FALSE_POSITIVE },
            ];
            const html = defs.map(d => `
                <button class="pill ${S.statusFilter === d.v ? 'on' : ''}" style="--p:${d.p}" data-status="${d.v}">
                    <span>${d.label}${d.n != null ? `<b class="cnt">${d.n}</b>` : ''}</span>
                </button>`).join('');
            const bar = $('#inc-filters');
            if (bar.dataset.sig === html) return;
            bar.dataset.sig = html;
            bar.innerHTML = html;
            bar.querySelectorAll('.pill').forEach(b => b.onclick = () => {
                S.statusFilter = b.dataset.status;
                bar.querySelectorAll('.pill').forEach(x => x.classList.toggle('on', x === b));
                loadList({ force: true });
            });
        }

        /* ================= queue ================= */
        function applyView() {
            const q = S.q.trim().toLowerCase();
            let v = S.incidents.slice();
            if (q) {
                v = v.filter(i => {
                    const hay = [i.incident_key, i.title, i.status, i.severity, i.assigned_analyst,
                    ...(i.source_ips || []), ...(i.attack_techniques || []).map(t => `${t.id} ${t.name}`)]
                        .join(' ').toLowerCase();
                    return hay.includes(q);
                });
            }
            const cmp = {
                recent: (a, b) => String(b.last_seen || '').localeCompare(String(a.last_seen || '')),
                risk: (a, b) => (b.risk_score ?? 0) - (a.risk_score ?? 0),
                severity: (a, b) => (SEV_RANK[b.severity] || 0) - (SEV_RANK[a.severity] || 0) || (b.risk_score ?? 0) - (a.risk_score ?? 0),
                confidence: (a, b) => (b.confidence ?? 0) - (a.confidence ?? 0),
            }[S.sort];
            v.sort(cmp);
            S.view = v;
        }

        function renderList(force) {
            applyView();
            const sig = JSON.stringify(S.view.map(i => [i.id, i.status, i.severity, i.last_seen, i.risk_score, i.assigned_analyst]));
            if (!force && sig === S.listSig) { markSelected(); return; }
            S.listSig = sig;

            $('#inc-count').textContent = `${S.view.length} shown · ${S.incidents.length} loaded`;

            const list = $('#inc-list');
            const scrollWrap = $('#inc-list-scroll');
            const keepScroll = scrollWrap ? scrollWrap.scrollTop : 0;
            list.innerHTML = S.view.length ? S.view.map((i, idx) => `
                <div class="inc-row ${S.selected === i.id ? 'sel' : ''} ${i.severity === 'CRITICAL' ? 'crit' : ''}"
                     style="--i:${Math.min(idx, 24)};--sv:${SEV_COLOR[i.severity] || 'var(--c-idle)'}" data-id="${esc(i.id)}">
                    <div class="k">
                        <span>${esc(i.incident_key)}${i.auto_created ? ' · auto' : ' · manual'}</span>
                        <span>${rel(i.last_seen)}</span>
                    </div>
                    <div class="t">${esc(i.title)}</div>
                    <div class="m row-meta">
                        <span class="rm-sev" style="--c:${SEV_COLOR[i.severity] || 'var(--c-idle)'}">${esc(String(i.severity || '').charAt(0) + String(i.severity || '').slice(1).toLowerCase())}</span>
                        <span>${esc(String(i.status).replace('_', ' ').toLowerCase())}</span>
                        <span>risk ${num(i.risk_score)}</span>
                        <span>conf ${num(i.confidence, 2)}</span>
                        ${(i.source_ips || []).slice(0, 1).map(ip => `<span class="mono">${esc(ip)}</span>`).join('')}
                        ${i.assigned_analyst ? `<span><i class="fas fa-user-check"></i> ${esc(i.assigned_analyst.split('@')[0])}</span>` : ''}
                    </div>
                </div>`).join('')
                : `<div class="empty"><i class="fas fa-inbox"></i><div>No cases match this filter</div></div>`;

            list.querySelectorAll('.inc-row').forEach(r => r.onclick = () => select(r.dataset.id));
            if (scrollWrap) scrollWrap.scrollTop = keepScroll;

            // Open the first case straight away so the case file is never an empty half-page.
            if (!S.selected && S.view.length) select(S.view[0].id);
        }

        /* toggle the selected row without re-rendering (keeps animations calm) */
        function markSelected() {
            $$('#inc-list .inc-row').forEach(r => r.classList.toggle('sel', r.dataset.id === S.selected));
        }

        function select(id) {
            if (!id || id === S.selected) return;
            const first = !S.selected;
            const go = () => {
                S.selected = id;
                S.tab = 'overview';
                rpReset();
                markSelected();
                const row = $('#inc-list').querySelector('.inc-row.sel');
                if (row) row.scrollIntoView({ block: 'nearest' });
                return loadDetail(id);
            };
            // The row grows into its case file where the browser can do it.
            const from = $$('#inc-list .inc-row').find(r => r.dataset.id === id);
            if (first || !from || !document.startViewTransition || matchMedia('(prefers-reduced-motion: reduce)').matches) { go(); return; }
            from.style.viewTransitionName = 'st-case';
            const vt = document.startViewTransition(async () => {
                from.style.viewTransitionName = '';
                await go();
                const head = $('#inc-detail .hero');
                if (head) head.style.viewTransitionName = 'st-case';
            });
            vt.finished.finally(() => { const head = $('#inc-detail .hero'); if (head) head.style.viewTransitionName = ''; });
        }

        /* ================= data loads ================= */
        async function loadList({ force = false } = {}) {
            const p = new URLSearchParams();
            if (S.statusFilter) p.set('status', S.statusFilter);
            if (S.severityFilter) p.set('severity', S.severityFilter);
            p.set('limit', '300');
            try {
                const [res, stats] = await Promise.all([
                    apiService.get('/incidents?' + p.toString()),
                    apiService.get('/incidents/stats').catch(() => null),
                ]);
                S.incidents = res.incidents || [];
                if (stats) { S.stats = stats; renderKpis(stats); }
                renderFilterPills();
                renderList(force);
                markLive(true);
            } catch (e) {
                markLive(false, e.message);
                $('#inc-list').innerHTML = `<div class="empty"><i class="fas fa-plug-circle-xmark"></i><div>Queue unavailable</div><div class="rb">${esc(e.message)}</div></div>`;
            }
        }

        function markLive(ok, msg) {
            const pill = $('#live-pill');
            pill.classList.toggle('paused', !ok || !S.auto);
            $('#live-txt').textContent = ok
                ? (S.auto ? `Live · ${new Date().toLocaleTimeString()}` : `Paused · ${new Date().toLocaleTimeString()}`)
                : `Offline${msg ? ' · ' + msg.slice(0, 40) : ''}`;
        }

        async function loadDetail(id, { keepTab = false, animate = !keepTab } = {}) {
            if (!keepTab) $('#inc-detail').innerHTML = `<div class="sk"><i></i><i></i><i></i></div><div class="sk"><i></i><i></i><i></i></div>`;
            try {
                const [d, tl] = await Promise.all([
                    apiService.get('/incidents/' + id),
                    apiService.get(`/incidents/${id}/timeline?splunk=${S.splunk}`).catch(() => ({ timeline: [] })),
                ]);
                if (S.selected !== id) return;   // user moved on while in flight
                S.detail = d;
                S.timeline = tl.timeline || [];
                renderDetail(animate, keepTab);
            } catch (e) {
                $('#inc-detail').innerHTML = `<div class="empty"><i class="fas fa-triangle-exclamation"></i><div>Case file unavailable</div><div class="rb">${esc(e.message)}</div></div>`;
            }
        }

        /* ================= detail render ================= */
        function gauge(value, max, label, color, animate) {
            const C = 213.6;
            const pct = Math.max(0, Math.min(1, (value || 0) / max));
            const off = C * (1 - pct);
            return `<div class="gauge">
                <svg viewBox="0 0 80 80">
                    <circle class="trk" cx="40" cy="40" r="34"></circle>
                    <circle class="val" cx="40" cy="40" r="34" style="stroke:${color};color:${color}"
                            data-off="${off}" stroke-dashoffset="${animate ? C : off}"></circle>
                </svg>
                <div class="ctr"><b data-gv data-target="${value}">${animate ? 0 : value}</b><small>${label}</small></div>
            </div>`;
        }

        function renderDetail(animate = true, preserveScroll = !animate) {
            const d = S.detail;
            if (!d) return;
            const pane = $('#inc-detail');
            const keepScroll = preserveScroll ? pane.scrollTop : 0;
            const fresh = animate;
            $('#dtl-sub').textContent = `${d.incident_key} · updated ${rel(d.updated_at || d.last_seen)}`;
            const sevColor = SEV_COLOR[d.severity] || 'var(--c-idle)';
            const curIdx = STATUSES.indexOf(d.status);
            const isFP = d.status === 'FALSE_POSITIVE';

            const counts = {
                overview: null,
                timeline: S.timeline.length,
                detections: (d.detections || []).length,
                evidence: (d.evidence || []).length,
                notes: (d.analyst_notes || '').split('\n').filter(Boolean).length,
                activity: (d.activity || []).length,
            };

            pane.innerHTML = `
              <div class="dtl${fresh ? '' : ' no-anim'}">
                <div class="hero">
                    <div class="hero-top">
                        <div style="min-width:240px;flex:1">
                            <div class="keyline">${esc(d.incident_key)} · ${d.auto_created ? 'Auto-correlated' : 'Analyst-created'} · first seen ${fmt(d.first_seen)}</div>
                            <h3>${esc(d.title)}</h3>
                            <div class="badges">
                                <span class="sev sev-${esc(d.severity)}">${esc(cap(d.severity))}</span>
                                <span class="st st-${esc(d.status)}">${esc(cap(d.status))}</span>
                                <span class="mini"><i class="fas fa-clock"></i> last activity ${rel(d.last_seen)}</span>
                                <span class="mini"><i class="fas fa-user-shield"></i> ${d.assigned_analyst ? esc(d.assigned_analyst) : 'unassigned'}</span>
                            </div>
                        </div>
                        <div class="gauges">
                            ${gauge(Math.round(d.risk_score ?? 0), 100, 'risk', sevColor, fresh)}
                            ${gauge(Math.round((d.confidence ?? 0) * 100), 100, 'confidence', 'var(--acc)', fresh)}
                        </div>
                    </div>

                    <div class="wf-row">
                        <div class="wf">
                            <div class="wf-track"></div>
                            <div class="wf-fill" style="width:${curIdx > 0 ? (curIdx / (STATUSES.length - 1) * 80) : 0}%"></div>
                            ${STATUSES.map((s, i) => {
                                const state = d.status === s ? 'cur' : (curIdx > i && curIdx !== -1 ? 'done' : '');
                                const icon = state === 'done' ? '<i class="fas fa-check"></i>' : (i + 1);
                                return `
                            <button class="wf-step ${state}" data-set="${s}" title="${s.toLowerCase()}">
                                <span class="wf-dot">${icon}</span>
                                <span class="wf-lbl">${s.charAt(0) + s.slice(1).toLowerCase()}</span>
                            </button>`;
                            }).join('')}
                        </div>
                        <button class="wf-fp ${isFP ? 'cur' : ''}" data-set="FALSE_POSITIVE">
                            <i class="fas fa-ban"></i> False positive
                        </button>
                    </div>

                    <div class="hero-actions">
                        <button class="sbtn" id="act-assign"><i class="fas fa-user-plus"></i>
                            ${d.assigned_analyst && S.me && d.assigned_analyst === S.me.email ? 'Release' : 'Assign to me'}</button>
                        <select class="sel-mini" id="act-sev" title="Analyst severity override">
                            ${['LOW', 'MEDIUM', 'HIGH', 'CRITICAL'].map(s => `<option value="${s}" ${d.severity === s ? 'selected' : ''}>${s.charAt(0) + s.slice(1).toLowerCase()}</option>`).join('')}
                        </select>
                        ${S.timeline.length > 1 ? '<button class="sbtn" id="act-replay"><i class="fas fa-play"></i> Replay attack</button>' : ''}
                        <button class="sbtn" id="act-link"><i class="fas fa-link"></i> Link events</button>
                        <button class="sbtn" id="act-copy"><i class="fas fa-clipboard"></i> Copy summary</button>

        /* ---- tab content builders ---- */

        function tabEvidence(d) {
            const ev = d.evidence || [];
            return `
            <div class="sec" style="--i:0">
                <h4>Attach evidence</h4>
                <div class="up">
                    <div class="up-row">

            <div class="sec" style="--i:1">
                <h4>Chain of custody</h4>
                <table class="det">
                    <thead><tr><th>type</th><th>source</th><th>reference</th><th>sha-256</th><th>acquired</th><th>integrity</th></tr></thead>

                            <td class="rb">${esc(e.ref || '')}</td>
                            <td class="rb" title="${esc(e.sha256 || '')}">${e.sha256 ? esc(e.sha256.slice(0, 20)) + '…' : 'n/a'}</td>

                            <td>${e.immutable ? '<span class="chip"><i class="fas fa-lock"></i> immutable</span>' : '<span class="rb">mutable</span>'}</td>
                        </tr>`).join('') || '<tr><td colspan="6" class="rb">No evidence attached to this case</td></tr>'}
                    </tbody>
                </table>
