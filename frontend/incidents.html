        function tabNotes(d) {
            const lines = (d.analyst_notes || '').split('\n').filter(Boolean);
            return `
            <div class="sec" style="--i:0">
                <h4>Analyst notes</h4>
                <div class="note-log">
                    ${lines.map((l, i) => {
                const m = l.match(/^\[([^\]]+)\]\s*([^:]+):\s*([\s\S]*)$/);
                /* .note is pre-wrap, so no stray template whitespace inside the element */
                const inner = m ? `<div class="nmeta">${esc(m[1])} · ${esc(m[2])}</div>${esc(m[3])}` : esc(l);
                return `<div class="note" style="--i:${Math.min(i, 16)}">${inner}</div>`;
            }).join('') || '<div class="rb">No notes recorded yet</div>'}
                </div>
                <div class="note-add">
                    <input id="inc-note" placeholder="Record an observation, action or decision">
                    <button class="soc-btn" id="inc-note-add"><i class="fas fa-pen"></i> Add note</button>
                </div>
            </div>`;
        }

        function tabActivity(d) {
            const a = d.activity || [];
            return `
            <div class="sec" style="--i:0">
                <h4>Audit trail</h4>
                <div class="act">
                    ${a.slice().reverse().map((x, i) => `
                        <div class="act-row" style="--i:${Math.min(i, 20)}">
                            <span>${fmt(x.at)}</span>
                            <span>${esc(x.actor)} · <b>${esc(x.action)}</b> · ${esc(x.detail || '')}</span>
                        </div>`).join('') || '<div class="rb">No recorded activity</div>'}
                </div>
            </div>`;
        }

        /* ---- attack replay: step through the case's timeline in order ---- */
        const RP = { on: false, playing: false, pos: 0, speed: 1, at: [], total: 0, raf: 0, last: 0, count: -1 };

        // When each entry appears, in replay time: real order, with quiet gaps shortened so a
        // burst of logins and an hour of silence both stay readable.
        function rpSchedule() {
            const t = S.timeline, at = [0];
            for (let i = 1; i < t.length; i++) {
                const dt = Math.max(0, (Date.parse(t[i].timestamp) - Date.parse(t[i - 1].timestamp)) / 1000) || 0;
                at.push(at[i - 1] + Math.min(1200, 120 + 380 * Math.log10(1 + dt)));
            }
            RP.at = at;
            RP.total = (at[at.length - 1] || 0) + 500;
        }

        function rpMarkup() {
            const t = S.timeline;
            if (t.length < 2) return '';
            rpSchedule();
            const techs = S.detail.attack_techniques || [];
            return `
                <div class="rp" id="rp">
                    <div class="rp-bar">
                        <button class="sbtn rp-play" id="rp-play"><i class="fas fa-play"></i> <span>Replay</span></button>
                        <button class="sbtn" id="rp-speed" title="Playback speed">${RP.speed}x</button>
                        <div class="rp-now"><b id="rp-count">${t.length}</b> of ${t.length} entries<span id="rp-time"></span></div>
                        <button class="sbtn rp-all" id="rp-all" hidden>Show all</button>
                    </div>
                    <div class="rp-track" id="rp-track" role="slider" tabindex="0" aria-label="Position in the attack" aria-valuemin="0" aria-valuemax="${t.length}" aria-valuenow="${t.length}">
                        <div class="rp-fill" id="rp-fill"></div>
                        ${t.map((e, i) => `<i class="rp-tick${e.source === 'detection' ? ' det' : ''}" style="left:${(RP.at[i] / RP.total * 100).toFixed(2)}%;--sv:${SEV_COLOR[e.severity] || 'var(--st-text-faint)'}"></i>`).join('')}
                        <div class="rp-head" id="rp-head"></div>
                    </div>
                    <div class="rp-ends"><span>${fmt(t[0].timestamp)}</span><span class="rp-note">Real order. Quiet gaps are shortened.</span><span>${fmt(t[t.length - 1].timestamp)}</span></div>
                    ${techs.length ? `<div class="rp-tech">${techs.map(x => `<span class="rp-chip" data-tid="${esc(x.id)}"><b>${esc(x.id)}</b>${esc(x.tactic || x.name || '')}</span>`).join('')}</div>` : ''}
                </div>`;
        }

        // How many entries have happened by the current position.
        function rpCount() {
            if (!RP.on) return S.timeline.length;
            let c = 0;
            while (c < RP.at.length && RP.at[c] <= RP.pos) c++;
            return c;
        }

        function rpApply(follow) {
            if (!$('#rp')) return;
            const t = S.timeline, count = rpCount();
            const frac = RP.on ? Math.max(0, Math.min(1, RP.pos / RP.total)) : 1;
            $('#rp-fill').style.width = (frac * 100).toFixed(2) + '%';
            $('#rp-head').style.left = (frac * 100).toFixed(2) + '%';
            if (count === RP.count) return;   // nothing new has happened since the last frame
            RP.count = count;
            $('#rp-count').textContent = count;
            $('#rp-time').textContent = RP.on && count ? fmt(t[count - 1].timestamp) : '';
            $('#rp-track').setAttribute('aria-valuenow', count);
            $('#rp-all').hidden = !RP.on;
            $$('#rp .rp-tick').forEach((el, i) => el.classList.toggle('past', i < count));
            // a technique lights up when the rule that names it has fired
            const seen = new Set(t.slice(0, count).map(e => e.attack_technique).filter(Boolean));
            $$('#rp .rp-chip').forEach(c => c.classList.toggle('lit', !RP.on || seen.has(c.dataset.tid)));
            const list = $('#tab-body .tl');
            if (!list) return;
            list.classList.toggle('rp-on', RP.on);
            const items = list.children;
            for (let i = 0; i < items.length; i++) {
                items[i].classList.toggle('rp-future', RP.on && i >= count);
                items[i].classList.toggle('rp-now', RP.on && i === count - 1);
            }
            if (follow && RP.on && count && items[count - 1]) {
                const pane = $('#inc-detail'), pr = pane.getBoundingClientRect(), ir = items[count - 1].getBoundingClientRect();
                pane.scrollTo({ top: pane.scrollTop + ir.top - pr.top - pane.clientHeight * 0.6, behavior: 'smooth' });
            }
        }

        function rpButton() {
            const b = $('#rp-play');
            if (!b) return;
            const mid = RP.on && RP.pos > 0 && RP.pos < RP.total;
            b.innerHTML = RP.playing ? '<i class="fas fa-pause"></i> <span>Pause</span>' : `<i class="fas fa-play"></i> <span>${mid ? 'Resume' : 'Replay'}</span>`;
        }

        function rpTick(now) {
            if (!RP.playing) return;
            RP.pos = Math.min(RP.total, RP.pos + (now - RP.last) * RP.speed);
            RP.last = now;
            rpApply(true);
            if (RP.pos >= RP.total) { RP.playing = false; rpButton(); return; }
            RP.raf = requestAnimationFrame(rpTick);
        }

        function rpPlay() {
            if (S.timeline.length < 2) return;
            if (!RP.on || RP.pos >= RP.total) RP.pos = 0;
            RP.on = true;
            RP.playing = true;
            RP.count = -1;
            RP.last = performance.now();
            cancelAnimationFrame(RP.raf);
            RP.raf = requestAnimationFrame(rpTick);
            rpButton();
        }

        function rpPause() {
            RP.playing = false;
            cancelAnimationFrame(RP.raf);
            rpButton();
        }

        function rpReset() {
            RP.playing = false;
            RP.on = false;
            RP.pos = 0;
            RP.count = -1;
            cancelAnimationFrame(RP.raf);
        }

        function rpWire() {
            if (!$('#rp')) return;
            $('#rp-play').onclick = () => (RP.playing ? rpPause() : rpPlay());
            $('#rp-speed').onclick = () => { RP.speed = RP.speed === 1 ? 2 : RP.speed === 2 ? 4 : 1; $('#rp-speed').textContent = RP.speed + 'x'; };
            $('#rp-all').onclick = () => { rpReset(); rpApply(false); rpButton(); };
            const track = $('#rp-track');
            const seek = e => {
                const r = track.getBoundingClientRect();
                RP.on = true;
                RP.pos = Math.max(0, Math.min(1, (e.clientX - r.left) / r.width)) * RP.total;
                rpApply(true);
                rpButton();
            };
            track.onpointerdown = e => {
                track.setPointerCapture(e.pointerId);
                rpPause();
                seek(e);
                track.onpointermove = seek;
            };
            track.onpointerup = track.onpointercancel = () => { track.onpointermove = null; };
            track.onkeydown = e => {
                if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); $('#rp-play').click(); return; }
                if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
                e.preventDefault();
                rpPause();
                RP.on = true;
                const c = Math.max(0, Math.min(RP.at.length, rpCount() + (e.key === 'ArrowRight' ? 1 : -1)));
                RP.pos = c ? RP.at[c - 1] : -1;   // just before the first entry
                rpApply(true);
                rpButton();
            };
            if (RP.pos > RP.total) RP.pos = RP.total;
            RP.count = -1;
            rpApply(false);
            rpButton();
        }

        function renderTab() {
            const d = S.detail;
            const body = $('#tab-body');
            if (!body || !d) return;
            const builders = {
                overview: tabOverview, timeline: tabTimeline, detections: tabDetections,
                evidence: tabEvidence, notes: tabNotes, activity: tabActivity
            };
            body.innerHTML = (builders[S.tab] || tabOverview)(d);
            body.style.animation = 'none';
            void body.offsetWidth;
            body.style.animation = '';

            requestAnimationFrame(() => {
                $$('#tab-body .rbk-bar span').forEach(s => s.style.width = s.dataset.w + '%');
            });
            wireTab();
        }

        /* ================= wiring ================= */
        function wireDetail() {
            const d = S.detail;

            const replay = $('#act-replay');
            if (replay) replay.onclick = () => {
                S.tab = 'timeline';
                $$('#dtl-tabs .tab').forEach(x => x.classList.toggle('on', x.dataset.tab === 'timeline'));
                $('#inc-detail').scrollTop = 0;
                renderTab();
                rpReset();
                rpPlay();
            };

            $$('#dtl-tabs .tab').forEach(b => b.onclick = () => {
                if (S.tab === b.dataset.tab) return;
                S.tab = b.dataset.tab;
                $$('#dtl-tabs .tab').forEach(x => x.classList.toggle('on', x === b));
                $('#inc-detail .dtl')?.classList.remove('no-anim');   // deliberate switch → animate
                $('#inc-detail').scrollTop = 0;
                renderTab();
            });

            $$('#inc-detail .wf-step, #inc-detail .wf-fp').forEach(b => b.onclick = () => patch({ status: b.dataset.set }, `status → ${b.dataset.set.toLowerCase()}`));

            const sev = $('#act-sev');
            if (sev) sev.onchange = () => patch({ severity: sev.value }, `severity override → ${sev.value}`);

            const asg = $('#act-assign');
            if (asg) asg.onclick = () => {
                if (!S.me) { toast('cannot resolve your identity', 'err'); return; }
                const mine = d.assigned_analyst === S.me.email;
                patch({ assigned_analyst: mine ? '' : S.me.email }, mine ? 'case released' : 'case assigned to you');
            };

            const lk = $('#act-link');
            if (lk) lk.onclick = openLinkEvents;

            const cp = $('#act-copy');
            if (cp) cp.onclick = async () => {
                const txt = [
                    `${d.incident_key}: ${d.title}`,
                    `severity=${d.severity} status=${d.status} risk=${num(d.risk_score)} confidence=${num(d.confidence, 2)}`,
                    `first_seen=${fmt(d.first_seen)} last_seen=${fmt(d.last_seen)}`,
                    `source_ips=${(d.source_ips || []).join(', ') || 'n/a'}`,
                    `techniques=${(d.attack_techniques || []).map(t => t.id).join(', ') || 'n/a'}`,
                    `reasons: ${(d.detection_reasons || []).join(' | ') || 'n/a'}`,
                ].join('\n');
                try { await navigator.clipboard.writeText(txt); toast('case summary copied'); }
                catch (e) { toast('clipboard blocked by browser', 'warn'); }
            };

            const exp = $('#inc-export');
            if (exp) exp.onclick = function () {
                STReports.generateAndDownload('incident', { incident_id: this.dataset.key }, { button: this, title: 'incident' });
            };
        }

        function wireTab() {
            const id = S.selected;
            if (S.tab === 'timeline') rpWire();

            const sp = $('#tl-splunk');
            if (sp) sp.onclick = async () => {
                S.splunk = !S.splunk;
                sp.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Loading';
                try {
                    const tl = await apiService.get(`/incidents/${id}/timeline?splunk=${S.splunk}`);
                    S.timeline = tl.timeline || [];
                    renderDetail(true);
                } catch (e) { S.splunk = !S.splunk; toast('timeline fetch failed: ' + e.message, 'err'); renderTab(); }
            };

            const na = $('#inc-note-add');
            if (na) na.onclick = async () => {
                const box = $('#inc-note');
                const t = box.value.trim();
                if (!t) { box.focus(); return; }
                na.disabled = true;
                try {
                    await apiService.post(`/incidents/${id}/notes`, { text: t });
                    box.value = '';
                    toast('note recorded');
                    await loadDetail(id, { keepTab: true, animate: true });
                } catch (e) { toast('note failed: ' + e.message, 'err'); }
                finally { na.disabled = false; }
            };
            const nb = $('#inc-note');
            if (nb) nb.onkeydown = e => { if (e.key === 'Enter') $('#inc-note-add').click(); };

            /* --- overview: ATT&CK edit + IOC add/remove --- */
            const tq = $('#act-tech');
            if (tq) tq.onclick = openEditTechniques;

            const diAdd = $('#di-add');
            if (diAdd) {
                const add = async () => {
                    const v = $('#di-value').value.trim();
                    if (!v) { $('#di-value').focus(); return; }
                    diAdd.disabled = true;
                    try {
                        const r = await apiService.post(`/incidents/${id}/iocs`, { type: $('#di-type').value, value: v });
                        toast(r.created ? 'indicator added' : 'indicator already on this case', r.created ? 'ok' : 'warn');
                        await loadDetail(id, { keepTab: true, animate: true });
                    } catch (e) { toast('ioc failed: ' + e.message, 'err'); }
                    finally { diAdd.disabled = false; }
                };
                diAdd.onclick = add;
                $('#di-value').onkeydown = e => { if (e.key === 'Enter') add(); };
            }
            $$('#tab-body .ioc-del[data-ioc]').forEach(b => b.onclick = async e => {
                e.preventDefault(); e.stopPropagation();
                try {
                    await apiService.delete(`/incidents/${id}/iocs?value=${encodeURIComponent(b.dataset.ioc)}`);
                    toast('indicator removed');
                    await loadDetail(id, { keepTab: true, animate: true });
                } catch (err) { toast('remove failed: ' + err.message, 'err'); }
            });

            /* --- evidence upload --- */
            const evType = $('#ev-type');
            if (evType) {
                const syncRows = () => {
                    const isFile = evType.value === 'attachment';
                    $('#ev-file-row').style.display = isFile ? 'flex' : 'none';
                    $('#ev-text-row').style.display = isFile ? 'none' : 'flex';
                };
                evType.onchange = syncRows; syncRows();

                $('#ev-add').onclick = async () => {
                    const btn = $('#ev-add');
                    const type = evType.value;
                    const fd = new FormData();
                    fd.append('type', type);
                    const ref = $('#ev-ref').value.trim();
                    if (ref) fd.append('ref', ref);
                    if (type === 'attachment') {
                        const f = $('#ev-file').files[0];
                        if (!f) { toast('choose a file first', 'warn'); return; }
                        fd.append('file', f);
                    } else {
                        const t = $('#ev-text').value.trim();
                        if (!t) { toast('content is required for this evidence type', 'warn'); $('#ev-text').focus(); return; }
                        fd.append('text', t);
                    }
                    btn.disabled = true;
                    try {
                        await apiService.upload(`/evidence/incident/${id}`, fd);
                        toast('evidence attached');
                        await loadDetail(id, { keepTab: true, animate: true });
                    } catch (e) { toast('attach failed: ' + e.message, 'err'); }
                    finally { btn.disabled = false; }
                };
            }
        }

        async function patch(body, label) {
            if (S.busy) return;
            S.busy = true;
            try {
                await apiService._request('/incidents/' + S.selected, 'PATCH', body);
                toast(label);
                await Promise.all([
                    loadDetail(S.selected, { keepTab: true, animate: true }),
                    loadList({ force: true }),
                ]);
            } catch (e) {
                toast(`${label} failed: ${e.message} (analyst role required)`, 'err');
            } finally { S.busy = false; }
        }

        /* ================= console controls ================= */
        $('#inc-q').oninput = e => { S.q = e.target.value; renderList(true); };
        $('#inc-sev').onchange = e => { S.severityFilter = e.target.value; loadList({ force: true }); };
        $('#inc-sort').onchange = e => { S.sort = e.target.value; renderList(true); };

        $('#inc-refresh').onclick = e => {
            const b = e.currentTarget;
            b.classList.add('spin'); setTimeout(() => b.classList.remove('spin'), 700);
            loadList({ force: true });
            if (S.selected) loadDetail(S.selected, { keepTab: true });
        };

        $('#inc-auto').onclick = e => {
            S.auto = !S.auto;
            e.currentTarget.innerHTML = `<i class="fas fa-${S.auto ? 'pause' : 'play'}"></i>`;
            e.currentTarget.title = S.auto ? 'Pause auto-refresh' : 'Resume auto-refresh (12s)';
            markLive(true);
            toast(S.auto ? 'auto-refresh resumed' : 'auto-refresh paused', 'info');
        };

        /* ================= generic modal shell ================= */
        const modal = $('#modal');
        function openModal({ title, wide = false, steps = '', body = '', footer = '', focus = null }) {
            $('#modal-title').textContent = title;
            $('#modal-panel').classList.toggle('wide', wide);
            $('#modal-steps').innerHTML = steps;
            $('#modal-body').innerHTML = body;
            $('#modal-footer').innerHTML = footer;
            modal.classList.add('open');
            if (focus) setTimeout(() => $(focus)?.focus(), 60);
        }
        const closeModal = () => modal.classList.remove('open');
        modal.querySelectorAll('[data-close]').forEach(b => b.onclick = closeModal);
        modal.onclick = e => { if (e.target === modal) closeModal(); };

        /* ================= shared event picker =================
           Feeds /incidents POST event_ids and /incidents/{id}/events. Linking
           events is what gives a case a timeline, so this is the core control. */
        const EP = {
            events: [], picked: new Set(), sensors: [], loading: false,
            f: { source_ip: '', sensor: '', severity: '', session_id: '' },
        };

        /* the full sensor roster — deriving it from a page of events would hide
           quiet sensors whose last event falls outside the newest 200 */
        async function epLoadSensors() {
            if (EP.sensors.length) return;
            try {
                const rows = await apiService.get('/live/sensors');
                EP.sensors = rows.map(r => r.sensor).filter(Boolean).sort();
            } catch (e) { EP.sensors = []; }
        }

        function epMarkup() {
            const sev = ['', 'CRITICAL', 'HIGH', 'MEDIUM', 'LOW'];
            return `
            <div class="pick-bar">
                <input id="ep-ip" placeholder="Source IP" value="${esc(EP.f.source_ip)}">
                <select id="ep-sensor">
                    <option value="">All sensors</option>
                    ${EP.sensors.map(s => `<option ${EP.f.sensor === s ? 'selected' : ''}>${esc(s)}</option>`).join('')}
                </select>
                <select id="ep-sev">
                    ${sev.map(s => `<option value="${s}" ${EP.f.severity === s ? 'selected' : ''}>${s ? s.charAt(0) + s.slice(1).toLowerCase() : 'All severities'}</option>`).join('')}
                </select>
                <input id="ep-session" placeholder="Session ID" value="${esc(EP.f.session_id)}">
                <button class="sbtn" id="ep-go"><i class="fas fa-filter"></i> Apply</button>
            </div>
            <div class="pick" id="ep-list"></div>
            <div class="pick-foot">
                <span id="ep-count"></span>
                <span>
                    <button class="sbtn" id="ep-all">Select all shown</button>
                    <button class="sbtn" id="ep-none">Clear selection</button>
                </span>
            </div>`;
        }

        function epRenderList() {
            const list = $('#ep-list');
            if (!list) return;
            if (EP.loading) {
                list.innerHTML = `<div class="sk"><i></i><i></i></div><div class="sk"><i></i><i></i></div><div class="sk"><i></i><i></i></div>`;
            } else if (!EP.events.length) {
                list.innerHTML = `<div class="pick-empty">no events match these filters</div>`;
            } else {
                list.innerHTML = EP.events.map(e => `
                    <label class="pick-row ${EP.picked.has(e.event_id) ? 'on' : ''}" data-id="${esc(e.event_id)}">
                        <input type="checkbox" ${EP.picked.has(e.event_id) ? 'checked' : ''}>
                        <span>
                            <span class="pr-h">
                                <span>${fmt(e.timestamp)}</span>
                                <span class="sev sev-${esc(e.severity || 'LOW')}">${esc(cap(e.severity || 'LOW'))}</span>
                                <span>${esc(e.sensor || '')}</span>
                                <span>${esc(e.sensor_event_type || '')}</span>
                            </span>
                            <span class="pr-s">
                                ${esc(e.source_ip || '')}${e.destination_port ? ' → :' + esc(e.destination_port) : ''}
                                ${e.username ? ' · user=' + esc(e.username) : ''}
                                ${e.command ? ' · ' + esc(String(e.command).slice(0, 120)) : ''}
                            </span>
                        </span>
                    </label>`).join('');
                list.querySelectorAll('.pick-row').forEach(r => r.onclick = ev => {
                    if (ev.target.tagName !== 'INPUT') { ev.preventDefault(); }
                    const id = r.dataset.id;
                    EP.picked.has(id) ? EP.picked.delete(id) : EP.picked.add(id);
                    r.classList.toggle('on', EP.picked.has(id));
                    r.querySelector('input').checked = EP.picked.has(id);
                    epRenderCount();
                });
            }
            epRenderCount();
        }

        function epRenderCount() {
            const c = $('#ep-count');
            if (c) c.textContent = `${EP.events.length} shown · ${EP.picked.size} selected`;
            const n = $('#ep-selected-n');
            if (n) n.textContent = EP.picked.size;
        }

        async function epLoad() {
            EP.loading = true; epRenderList();
            const p = new URLSearchParams({ limit: '200' });
            for (const [k, v] of Object.entries(EP.f)) if (v) p.set(k, v);
            try {
                EP.events = await apiService.get('/live/events?' + p.toString());
            } catch (e) {
                EP.events = [];
                toast('event fetch failed: ' + e.message, 'err');
            }
            EP.loading = false; epRenderList();
        }

        function epWire() {
            const apply = () => {
                EP.f.source_ip = $('#ep-ip').value.trim();
                EP.f.sensor = $('#ep-sensor').value;
                EP.f.severity = $('#ep-sev').value;
                EP.f.session_id = $('#ep-session').value.trim();
                epLoad();
            };
            $('#ep-go').onclick = apply;
            ['#ep-ip', '#ep-session'].forEach(s => $(s).onkeydown = e => { if (e.key === 'Enter') apply(); });
            ['#ep-sensor', '#ep-sev'].forEach(s => $(s).onchange = apply);
            $('#ep-all').onclick = () => { EP.events.forEach(e => EP.picked.add(e.event_id)); epRenderList(); };
            $('#ep-none').onclick = () => { EP.picked.clear(); epRenderList(); };
        }

        /* ================= shared ATT&CK picker ================= */
        const TP = { catalog: [], picked: new Map(), q: '' };

        async function tpLoad() {
            if (TP.catalog.length) return;
            try {
                const r = await apiService.get('/mitre/catalog');
                TP.catalog = r.techniques || [];
            } catch (e) { toast('ATT&CK catalog failed: ' + e.message, 'err'); }
        }

        function tpMarkup() {
            return `
            <div class="pick-bar">
                <input id="tp-q" placeholder="Search technique ID, name or tactic" style="flex:1 1 260px" value="${esc(TP.q)}">
            </div>
            <div class="pick" id="tp-list"></div>
            <div class="pick-foot"><span id="tp-count"></span></div>`;
        }

        function tpRenderList() {
            const list = $('#tp-list');
            if (!list) return;
            const q = TP.q.trim().toLowerCase();
            const hits = TP.catalog.filter(t =>
                !q || `${t.id} ${t.name} ${t.tactic}`.toLowerCase().includes(q));

            if (!hits.length) {
                list.innerHTML = `<div class="pick-empty">no technique matches “${esc(TP.q)}”</div>`;
            } else {
                let html = '', tactic = null;
                for (const t of hits) {
                    if (t.tactic !== tactic) { tactic = t.tactic; html += `<div class="tactic-head">${esc(tactic)}</div>`; }
                    html += `
                    <label class="pick-row ${TP.picked.has(t.id) ? 'on' : ''}" data-id="${esc(t.id)}">
                        <input type="checkbox" ${TP.picked.has(t.id) ? 'checked' : ''}>
                        <span><span class="pr-h"><span>${esc(t.id)}</span><span>${esc(t.name)}</span></span></span>
                    </label>`;
                }
                list.innerHTML = html;
                list.querySelectorAll('.pick-row').forEach(r => r.onclick = ev => {
                    if (ev.target.tagName !== 'INPUT') ev.preventDefault();
                    const id = r.dataset.id;
                    if (TP.picked.has(id)) TP.picked.delete(id);
                    else TP.picked.set(id, TP.catalog.find(t => t.id === id));
                    r.classList.toggle('on', TP.picked.has(id));
                    r.querySelector('input').checked = TP.picked.has(id);
                    tpRenderCount();
                });
            }
            tpRenderCount();
        }

        function tpRenderCount() {
            const c = $('#tp-count');
            if (c) c.textContent = `${TP.picked.size} technique(s) selected`;
            const n = $('#tp-selected-n');
            if (n) n.textContent = TP.picked.size;
        }

        function tpWire() {
            $('#tp-q').oninput = e => { TP.q = e.target.value; tpRenderList(); };
        }

        /* ================= new-case wizard ================= */
        const W = { step: 1, title: '', severity: 'MEDIUM', ips: '', reason: '', iocs: [] };
        const IOC_TYPES = ['ip', 'domain', 'url', 'sha256', 'sha1', 'md5', 'email', 'filename'];
        const STEP_NAMES = ['Details', 'Events', 'ATT&CK', 'IOCs'];

        function wizStash() {
            if (W.step !== 1) return;
            W.title = $('#nw-title')?.value ?? W.title;
            W.severity = $('#nw-sev')?.value ?? W.severity;
            W.ips = $('#nw-ips')?.value ?? W.ips;
            W.reason = $('#nw-reason')?.value ?? W.reason;
        }

        function wizStepBody() {
            if (W.step === 1) return `
                <div class="fld">
                    <label>Title</label>
                    <input id="nw-title" placeholder="e.g. suspected credential stuffing from 10.0.0.7" value="${esc(W.title)}">
                </div>
                <div class="fld">
                    <label>Severity</label>
                    <select id="nw-sev">${['LOW', 'MEDIUM', 'HIGH', 'CRITICAL'].map(s =>
                `<option value="${s}" ${W.severity === s ? 'selected' : ''}>${s.charAt(0) + s.slice(1).toLowerCase()}</option>`).join('')}</select>
                </div>
                <div class="fld">
                    <label>Source IPs (comma separated)</label>
                    <input id="nw-ips" placeholder="10.0.0.7, 203.0.113.4" value="${esc(W.ips)}">
                </div>
                <div class="fld">
                    <label>Reason: why is this case being opened?</label>
                    <input id="nw-reason" placeholder="what prompted this investigation" value="${esc(W.reason)}">
                </div>`;

            if (W.step === 2) return `
                <p class="rb" style="margin:0 0 10px">
                    Pick the events this case is built from. They become the case timeline, and widen the
                    incident window so related activity from the same source is reconstructed automatically.
                </p>${epMarkup()}`;

            if (W.step === 3) return `
                <p class="rb" style="margin:0 0 10px">Which ATT&amp;CK techniques does this activity map to?</p>${tpMarkup()}`;

            return `
                <p class="rb" style="margin:0 0 10px">Indicators of compromise to record against this case.</p>
                <div class="ioc-add">
                    <select id="ioc-type" class="sel-mini">${IOC_TYPES.map(t => `<option>${t}</option>`).join('')}</select>
                    <input id="ioc-value" placeholder="Value, for example 203.0.113.4 or a SHA-256">
                    <button class="sbtn" id="ioc-add"><i class="fas fa-plus"></i> Add</button>
                </div>
                <div class="ioc-list" id="ioc-list"></div>`;
        }

        function wizRenderIocs() {
            const el = $('#ioc-list');
            if (!el) return;
            el.innerHTML = W.iocs.length
                ? W.iocs.map((i, idx) => `<span class="chip ioc"><i class="fas fa-fingerprint"></i> ${esc(i.type)}:${esc(i.value)}<button class="ioc-del" data-i="${idx}" title="remove">&times;</button></span>`).join('')
                : '<span class="rb">None added</span>';
            el.querySelectorAll('.ioc-del').forEach(b => b.onclick = () => {
                W.iocs.splice(Number(b.dataset.i), 1); wizRenderIocs();
            });
        }

        function wizRender() {
            const steps = `<div class="steps">${STEP_NAMES.map((n, i) => `
                <button class="step ${W.step === i + 1 ? 'on' : (W.step > i + 1 ? 'done' : '')}" data-step="${i + 1}">
                    <b>${i + 1}</b>${n}
                </button>`).join('')}</div>`;

            const summary = `<span class="rb" style="margin-right:auto">
                <span id="ep-selected-n">${EP.picked.size}</span> event(s) ·
                <span id="tp-selected-n">${TP.picked.size}</span> technique(s) ·
                ${W.iocs.length} ioc(s)</span>`;

            const footer = `${summary}
                <button class="sbtn" data-close>Cancel</button>
                ${W.step > 1 ? '<button class="sbtn" id="wz-back">Back</button>' : ''}
                ${W.step < 4
                    ? '<button class="soc-btn" id="wz-next">Next</button>'
                    : '<button class="soc-btn soc-btn-primary" id="wz-create"><i class="fas fa-folder-plus"></i> Create case</button>'}`;

            openModal({
                title: 'Open a new case', wide: W.step === 2 || W.step === 3,
                steps, body: wizStepBody(), footer,
                focus: W.step === 1 ? '#nw-title' : (W.step === 3 ? '#tp-q' : null),
            });
            wizWire();
        }

        function wizWire() {
            $('#modal-footer').querySelectorAll('[data-close]').forEach(b => b.onclick = closeModal);
            /* clamped so a handler on a replaced footer can't drive the step out of range */
            const go = n => { W.step = Math.min(4, Math.max(1, n)); wizRender(); };
            $('#modal-steps').querySelectorAll('.step').forEach(b => b.onclick = () => {
                wizStash();
                if (Number(b.dataset.step) > 1 && !W.title.trim()) { toast('give the case a title first', 'warn'); return; }
                go(Number(b.dataset.step));
            });
            const back = $('#wz-back'); if (back) back.onclick = () => { wizStash(); go(W.step - 1); };
            const next = $('#wz-next'); if (next) next.onclick = () => {
                wizStash();
                if (W.step === 1 && !W.title.trim()) { toast('title is required', 'warn'); $('#nw-title').focus(); return; }
                go(W.step + 1);
            };

            if (W.step === 2) { epWire(); epRenderList(); if (!EP.events.length) epLoad(); }
            if (W.step === 3) { tpWire(); tpRenderList(); }
            if (W.step === 4) {
                wizRenderIocs();
                const add = () => {
                    const v = $('#ioc-value').value.trim();
                    if (!v) return;
                    W.iocs.push({ type: $('#ioc-type').value, value: v });
                    $('#ioc-value').value = ''; $('#ioc-value').focus();
                    wizRenderIocs();
                    $('#modal-footer').querySelector('.rb').innerHTML =
                        `<span id="ep-selected-n">${EP.picked.size}</span> event(s) · <span id="tp-selected-n">${TP.picked.size}</span> technique(s) · ${W.iocs.length} ioc(s)`;
                };
                $('#ioc-add').onclick = add;
                $('#ioc-value').onkeydown = e => { if (e.key === 'Enter') add(); };
            }

            const create = $('#wz-create');
            if (create) create.onclick = async () => {
                create.disabled = true;
                try {
                    const r = await apiService.post('/incidents', {
                        title: W.title.trim(),
                        severity: W.severity,
                        source_ips: W.ips.split(',').map(s => s.trim()).filter(Boolean),
                        reason: W.reason.trim() || 'manually created by analyst',
                        event_ids: [...EP.picked],
                        attack_techniques: [...TP.picked.values()].map(t => ({ id: t.id, name: t.name, tactic: t.tactic })),
                        iocs: W.iocs,
                    });
                    closeModal();
                    const linked = r.events?.linked ?? 0;
                    toast(`case ${r.incident?.incident_key || ''} opened · ${linked} event(s) linked`);
                    wizReset();
                    await loadList({ force: true });
                    if (r.incident?.id) select(r.incident.id);
                } catch (err) {
                    toast('create failed: ' + err.message + ' (analyst role required)', 'err');
                } finally { create.disabled = false; }
            };
        }

        function wizReset() {
            W.step = 1; W.title = ''; W.ips = ''; W.reason = ''; W.severity = 'MEDIUM'; W.iocs = [];
            EP.picked.clear(); TP.picked.clear(); TP.q = '';
        }

        async function openWizard() {
            wizReset();
            await Promise.all([tpLoad(), epLoadSensors()]);
            wizRender();
        }
        $('#inc-new').onclick = openWizard;

        /* ---------- link events onto an existing case ---------- */
        async function openLinkEvents() {
            await epLoadSensors();
            EP.picked.clear();
            const d = S.detail;
            if (d?.source_ips?.length && !EP.f.source_ip) EP.f.source_ip = d.source_ips[0];
            openModal({
                title: `Link events · ${d?.incident_key || ''}`, wide: true,
                body: epMarkup(),
                footer: `<span class="rb" style="margin-right:auto">Selected events join this case's timeline</span>
                         <button class="sbtn" data-close>Cancel</button>
                         <button class="soc-btn soc-btn-primary" id="lk-go"><i class="fas fa-link"></i> Link</button>`,
            });
            $('#modal-footer').querySelectorAll('[data-close]').forEach(b => b.onclick = closeModal);
            epWire(); epLoad();
            $('#lk-go').onclick = async () => {
                if (!EP.picked.size) { toast('select at least one event', 'warn'); return; }
                const btn = $('#lk-go'); btn.disabled = true;
                try {
                    const r = await apiService.post(`/incidents/${S.selected}/events`, {
                        event_ids: [...EP.picked], reason: 'linked by analyst from the case file',
                    });
                    closeModal();
                    toast(`${r.linked} linked · ${r.already_linked} already on case · ${r.not_found} not found`);
                    await Promise.all([loadDetail(S.selected, { keepTab: true, animate: true }), loadList({ force: true })]);
                } catch (e) { toast('link failed: ' + e.message, 'err'); }
                finally { btn.disabled = false; }
            };
        }

        /* ---------- edit the ATT&CK set on an existing case ---------- */
        async function openEditTechniques() {
            const d = S.detail;
            await tpLoad();
            TP.picked.clear(); TP.q = '';
            (d.attack_techniques || []).forEach(t =>
                TP.picked.set(t.id, TP.catalog.find(c => c.id === t.id) || t));
            openModal({
                title: `ATT&CK techniques · ${d.incident_key}`, wide: true,
                body: tpMarkup(),
                footer: `<span class="rb" style="margin-right:auto">Replaces the technique set on this case</span>
                         <button class="sbtn" data-close>Cancel</button>
                         <button class="soc-btn soc-btn-primary" id="tq-save"><i class="fas fa-check"></i> Save</button>`,
                focus: '#tp-q',
            });
            $('#modal-footer').querySelectorAll('[data-close]').forEach(b => b.onclick = closeModal);
            tpWire(); tpRenderList();
            $('#tq-save').onclick = async () => {
                const btn = $('#tq-save'); btn.disabled = true;
                try {
                    await apiService._request('/incidents/' + S.selected, 'PATCH', {
                        attack_techniques: [...TP.picked.values()].map(t => ({ id: t.id, name: t.name, tactic: t.tactic })),
                    });
                    closeModal();
                    toast('techniques updated');
                    await loadDetail(S.selected, { keepTab: true, animate: true });
                } catch (e) { toast('save failed: ' + e.message, 'err'); }
                finally { btn.disabled = false; }
            };
        }

        /* Browsers freeze CSS transitions in background tabs, so a page rendered while
           hidden comes back with bars/gauges stuck part-way. Snap them to final state. */
        document.addEventListener('visibilitychange', () => {
            if (document.hidden) return;
            $$('#tab-body .rbk-bar span').forEach(s => {
                s.style.transition = 'none';
                s.style.width = (s.dataset.w || 0) + '%';
                requestAnimationFrame(() => s.style.transition = '');
            });
            $$('#inc-detail .gauge .val').forEach(c => c.style.strokeDashoffset = c.dataset.off);
            $$('#inc-detail [data-gv]').forEach(b => { b.textContent = b.dataset.target; b.dataset.v = b.dataset.target; });
        });

        /* keyboard */
        document.addEventListener('keydown', e => {
            const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement?.tagName || '');
            if (e.key === 'Escape') { closeModal(); if (typing) document.activeElement.blur(); return; }
            if (typing) return;
            if (e.key === '/') { e.preventDefault(); $('#inc-q').focus(); return; }
            if (e.key === 'r') { $('#inc-refresh').click(); return; }
            if (e.key === 'n') { e.preventDefault(); openWizard(); return; }
            if (e.key === 'j' || e.key === 'k') {
                e.preventDefault();
                if (!S.view.length) return;
                const i = S.view.findIndex(x => x.id === S.selected);
                const next = e.key === 'j' ? Math.min(S.view.length - 1, i + 1) : Math.max(0, i - 1);
                select(S.view[i === -1 ? 0 : next].id);
            }
        });

        /* ================= boot ================= */
        (async () => {
            S.me = await apiService.get('/users/me').catch(() => null);
            await loadList({ force: true });
        })();

        // The detection engine pushes a message the moment a cycle creates detections or incidents.
        if (window.STLive) {
            const refreshQueue = window.STLive.debounce(() => {
                if (!S.auto) return;
                loadList();
                if (S.selected && !/^(INPUT|TEXTAREA)$/.test(document.activeElement?.tagName || '')) {
                    loadDetail(S.selected, { keepTab: true });
                }
                markLive(true);
            }, 800);
            window.STLive.on('detection', refreshQueue);
        }

        setInterval(() => {
            if (!S.auto || document.hidden) return;
            loadList();
            if (S.selected && !/^(INPUT|TEXTAREA)$/.test(document.activeElement?.tagName || '')) {
                loadDetail(S.selected, { keepTab: true });
            }
            markLive(true);
        }, 12000);
    </script>
</body>

</html>
