<!DOCTYPE html>
<html lang="en" data-require-admin>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System diagnostics · ShadowTrust</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 28 28'%3E%3Crect width='28' height='28' rx='6' fill='%23533afd'/%3E%3Cpath d='M4.5 14c2.5-4.3 5.7-6.4 9.500-6.400s7 2.100 9.500 6.400c-2.500 4.300-5.700 6.400-9.500 6.400S7 18.300 4.500 14Z' fill='none' stroke='%23fff' stroke-width='1.8' stroke-linejoin='round'/%3E%3Ccircle cx='14' cy='14' r='3.2' fill='%23fff'/%3E%3C/svg%3E">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#ffffff">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .debug-terminal {
            min-height: 400px;
            max-height: 60vh;
            overflow-y: auto;
            padding: 16px 18px;
            border: 1px solid var(--st-border);
            border-radius: var(--st-radius-md);
            background: var(--st-surface-2);
        }

        .terminal-line {
            display: flex;
            align-items: flex-start;
            gap: 14px;
            margin-bottom: 8px;
            font-family: var(--st-font-mono);
            font-size: 13px;
            color: var(--st-text-secondary);
        }

        .ts {
            min-width: 96px;
            color: var(--st-text-faint);
        }

        .tag {
            min-width: 50px;
        }

        .tag.sys {
            color: var(--st-accent);
        }

        .tag.aws {
            color: var(--st-caution);
        }

        .status {
            font-weight: 500;
        }

        .status.pass {
            color: var(--st-success);
        }

        .status.fail {
            color: var(--st-danger);
        }

        .status.wait {
            color: var(--st-text-faint);
        }

        .terminal-detail {
            color: var(--st-text-muted);
        }

        .error-dump {
            margin: 4px 0 12px 110px;
            padding: 10px 12px;
            border-left: 2px solid var(--st-danger);
            background: var(--st-danger-bg);
            color: var(--st-danger);
            font-family: var(--st-font-mono);
            font-size: 12.5px;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
        }

        @media (max-width: 640px) {
            .terminal-line {
                flex-wrap: wrap;
                gap: 4px 10px;
            }

            .error-dump {
                margin-left: 0;
            }
        }
    </style>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300..600&family=Source+Code+Pro:wght@400;500;600&display=swap">
    <link rel="stylesheet" href="css/tokens.css">
    <script src="js/theme.js"></script>
</head>

<body>

    <div class="app-container">

        <aside class="sidebar" id="sidebar"></aside>

        <main class="main-content">

            <div class="top-bar">
                <div class="page-header">
                    <h2>System diagnostics</h2>
                    <p>Checks the AWS integration with the keys saved on the AWS connection page, before any lab machine is launched.</p>
                </div>
                <div class="filters-bar">
                    <button class="soc-btn" onclick="clearTerminal()">Clear log</button>
                    <button class="soc-btn soc-btn-primary" id="runScanBtn" onclick="runDiagnostics()">Run diagnostics</button>
                </div>
            </div>

            <div class="soc-card">
                <div class="soc-card-header">
                    <div class="card-title"><i class="fas fa-microchip"></i> AWS orchestration test</div>
                </div>
                <div class="debug-terminal" id="terminalBox">
                    <div class="terminal-line">
                        <span class="ts">00:00:00</span>
                        <span class="tag sys">[SYS]</span>
                        <span class="msg">Diagnostic console ready. Nothing has run yet.</span>
                    </div>
                </div>
            </div>

        </main>
    </div>

    <script src="js/sidebar.js"></script>
    <script type="module">
        import { apiService } from './js/api.js';

        // Wait to attach globals so inline onclick handlers work
        window.apiService = apiService;

        function logToTerminal(tag, message, statusClass = '', detail = '', error = null) {
            const term = document.getElementById('terminalBox');
            const now = new Date();
            const ts = now.toTimeString().split(' ')[0] + '.' + now.getMilliseconds().toString().padStart(3, '0');

            const line = document.createElement('div');
            line.className = 'terminal-line';

            const timeSpan = `<span class="ts">${ts}</span>`;
            const tagSpan = `<span class="tag ${tag.toLowerCase()}">[${tag}]</span>`;
            // message and detail carry backend text (AWS error strings), so they are escaped
            const esc = (v) => String(v).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
            const msgSpan = `<span>${esc(message)}</span>`;

            let statSpan = '';
            if (statusClass) {
                const text = statusClass === 'pass' ? 'SUCCESS' : (statusClass === 'fail' ? 'FAILED' : 'WAITING');
                statSpan = `<span class="status ${statusClass}">[${text}]</span>`;
            }

            let detailSpan = detail ? `<span class="terminal-detail">${esc(detail)}</span>` : '';

            line.innerHTML = `${timeSpan} ${tagSpan} ${msgSpan} ${statSpan} ${detailSpan}`;
            term.appendChild(line);

            if (error) {
                const errBox = document.createElement('div');
                errBox.className = 'error-dump';
                errBox.innerText = error;
                term.appendChild(errBox);
            }

            // Auto-scroll to bottom
            term.scrollTop = term.scrollHeight;
        }

        window.clearTerminal = function () {
            document.getElementById('terminalBox').innerHTML = `
                <div class="terminal-line">
                    <span class="ts">00:00:00</span>
                    <span class="tag sys">[SYS]</span>
                    <span class="msg">Terminal cleared.</span>
                </div>
            `;
        }

        window.runDiagnostics = async function () {
            const btn = document.getElementById('runScanBtn');
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Running';

            logToTerminal('SYS', 'Initiating full AWS infrastructure diagnostic sequence...', 'wait');

            const payload = {
                aws_access_key: localStorage.getItem('_st_aws_ak'),
                aws_secret_key: localStorage.getItem('_st_aws_sk'),
                aws_region: localStorage.getItem('_st_aws_region'),
                s3_bucket: localStorage.getItem('_st_s3_bucket'),
                iam_profile: localStorage.getItem('_st_iam_profile')
            };

            if (!payload.aws_access_key) {
                logToTerminal('SYS', 'Aborting test. No AWS Keys found in local vault.', 'fail');
                btn.disabled = false;
                btn.innerHTML = 'Run diagnostics';
                return;
            }

            try {
                logToTerminal('AWS', 'Dispatching Boto3 connection request...', 'wait');

                const response = await window.apiService.post('/aws/debug', Object.fromEntries(Object.entries(payload).filter(([_, v]) => v != null)));

                if (response.results) {
                    response.results.forEach(res => {
                        const statusClass = res.status === 'PASS' ? 'pass' : 'fail';
                        const errorDump = res.status === 'FAIL' ? res.info : null;
                        const okDetail = res.status === 'PASS' ? res.info : '';

                        logToTerminal('AWS', `Testing ${res.name}`, statusClass, okDetail, errorDump);
                    });
                } else {
                    logToTerminal('AWS', 'Fatal Backend Reject', 'fail', '', response.message);
                }

                if (response.status === 'success') {
                    logToTerminal('SYS', 'All checks passed. Ready to launch.', 'pass');
                } else {
                    logToTerminal('SYS', 'Some checks failed. Fix them before launching instances.', 'fail');
                }

            } catch (error) {
                logToTerminal('SYS', 'Network Error', 'fail', '', error.message);
            }

            btn.disabled = false;
            btn.innerHTML = 'Run diagnostics';
        }
    </script>
</body>

</html>
